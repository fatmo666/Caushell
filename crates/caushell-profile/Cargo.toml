[package]
name = "caushell-profile"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search", "unicode"] }
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.9", default-features = false, features = ["parse", "std", "serde"] }
caushell-parse = { path = "../caushell-parse" }
caushell-types = { path = "../caushell-types" }
