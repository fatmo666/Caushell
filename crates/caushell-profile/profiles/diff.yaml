dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
read_only_control_surface: true

identity:
  canonical_name: diff
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: compare_paths
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: information}}
        - kind: any
          items:
            - kind: all
              items:
                - {kind: has_positional_at, index: 1}
                - {kind: not, item: {kind: has_positional_at, index: 2}}
                - {kind: not, item: {kind: has_modifier, modifier: file_anchor}}
            - kind: all
              items:
                - {kind: has_modifier, modifier: file_anchor}
                - {kind: has_positional_at, index: 0}
    remaining_selector: {kind: no_positional_args}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: consume_stdin, target: {kind: slot, name: stdin_markers}}
      - {kind: transform_data, target: {kind: none}}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - {id: format, matcher: {kind: any_flag, flags: ['-e', '-n', '-q', --brief, '-s', --report-identical-files, '-y', --side-by-side]}}
  - {id: comparison_controls, matcher: {kind: any_flag, flags: ['-a', --text, '-b', --ignore-space-change, '-B', --ignore-blank-lines, '-w', --ignore-all-space, '-i', --ignore-case, '-Z', --ignore-trailing-space, '-E', --ignore-tab-expansion, --strip-trailing-cr, '-t', --expand-tabs, '-T', --initial-tab, '-p', --show-c-function, --minimal, --speed-large-files, --suppress-common-lines, --left-column]}}
  - {id: recursive, matcher: {kind: any_flag, flags: ['-r', --recursive, '-N', --new-file, --unidirectional-new-file, --no-dereference]}}
  - id: context_optional
    matcher: {kind: any_flag, flags: ['-u', --unified, '-c', --context]}
    parameters: [{name: context_optional, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_many}]
  - id: context_lines
    matcher: {kind: any_flag, flags: ['-U', '-C']}
    parameters: [{name: context_lines, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: label
    matcher: {kind: any_flag, flags: ['-L', --label, '-x', --exclude, '-I', --ignore-matching-lines, '-F', --show-function-line, '-W', --width, --tabsize, '-S', --starting-file, '-D', --ifdef]}
    parameters: [{name: label_or_pattern, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: file_anchor
    matcher: {kind: any_flag, flags: [--from-file, --to-file]}
    parameters:
      - name: anchor_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
        structured_projection:
          branches: [{matcher: {kind: literal, value: '-'}, target: {name: anchor_stdin, semantic: {kind: plain_value}}}]
          fallback: {name: anchor_paths, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: anchor_paths}}
      - {kind: consume_stdin, target: {kind: slot, name: anchor_stdin}}

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
