dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: tailscale
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
option_scope: permuted_options
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
- id: serve_local_file
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: serve
    - kind: not
      item:
        kind: has_modifier
        modifier: information
    - kind: not
      item: {kind: has_positional_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^(status|reset|drain|advertise|get-config|set-config)$'}}
  parameters:
  - name: serve_operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: served_target
    semantic:
      kind: plain_value
    binding:
      kind: last_positional
    cardinality: required_one
    structured_projection:
      branches: [{matcher: {kind: regex_capture, pattern: '^/.+$', group: 0}, target: {name: served_file, semantic: {kind: path, role: read, purpose: generic_operand}}}]
  effects:
  - {kind: state_operation, state_operation: {domain: network_configuration, operation: control}, target: {kind: none}}
  - kind: read_path
    target:
      kind: slot
      name: served_file
- id: serve_inspect
  selector: {kind: all, items: [{kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: serve}}, {kind: has_positional_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^(status|get-config)$'}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
  parameters: &control_parameters [{name: serve_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}]
  effects: [{kind: state_operation, state_operation: {domain: network_configuration, operation: inspect}, target: {kind: none}}]
- id: serve_control
  selector: {kind: all, items: [{kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: serve}}, {kind: has_positional_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^(reset|drain|advertise|set-config)$'}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
  parameters: *control_parameters
  effects: [{kind: state_operation, state_operation: {domain: network_configuration, operation: control}, target: {kind: none}}]
modifiers:
- id: http
  matcher: {kind: any_flag, flags: [--http, --https, --tcp, --tls-terminated-tcp, --set-path, --service]}
  parameters: [{name: serve_options, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
- {id: serve_flags, matcher: {kind: any_flag, flags: [--bg, --yes, --json]}}
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/tailscale (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - The URL is reachable by any host of the same Tailnet.
  - Serve publication and reconfiguration are explicit network-configuration controls, not host file writes. The daemon's resolved listener address is not invented. Status/get-config remain inspect operations.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
