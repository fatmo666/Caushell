dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: tailscale
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: serve_local_file
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: serve
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: serve_operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: served_file
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: last_positional
    cardinality: required_one
  - name: http_port
    semantic:
      kind: plain_value
    binding:
      kind: args_with_prefix
      prefix: "--http="
    cardinality: optional_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: served_file
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/tailscale (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - The URL is reachable by any host of the same Tailnet.
  - The Tailscale daemon owns its Serve listener/runtime config; the effective listener
    endpoint and daemon-state path are not expressible from this source invocation,
    so the profile models the file read and leaves listener materialization partial.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
