dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: sort, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}

  - &quiet_check
    id: check_quiet
    selector: {kind: all, items: [&running {kind: not, item: {kind: has_modifier, modifier: information}}, &quiet {kind: any, items: [{kind: has_modifier, modifier: check_quiet}, {kind: has_modifier_parameter_matching, modifier: check_long, parameter: check_method, matcher: {kind: regex_pattern, pattern: '^(q|qu|qui|quie|quiet|s|si|sil|sile|silen|silent)$'}}]}, &no_stdin {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    remaining_selector: &valid_check
      kind: all
      items:
        - {kind: no_positional_args}
        - {kind: not, item: {kind: has_modifier, modifier: output_path}}
        - {kind: not, item: {kind: all, items: [{kind: has_modifier, modifier: check_diagnostic}, *quiet]}}
        - &known_long_check
          kind: any
          items:
            - {kind: not, item: {kind: has_modifier_parameter_matching, modifier: check_long, parameter: check_method, matcher: {kind: regex_pattern, pattern: '^.+$'}}}
            - {kind: has_modifier_parameter_matching, modifier: check_long, parameter: check_method, matcher: {kind: regex_pattern, pattern: '^(q|qu|qui|quie|quiet|s|si|sil|sile|silen|silent|d|di|dia|diag|diagn|diagno|diagnos|diagnose|diagnose-|diagnose-f|diagnose-fi|diagnose-fir|diagnose-firs|diagnose-first)$'}}
    parameters: &check_input
      - {name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_one}
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: optional_one}
    effects: &read [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: check_quiet_stdin
    selector: {kind: all, items: [*running, *quiet, *stdin]}
    remaining_selector: *valid_check
    parameters: *check_input
    effects: *read
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - &diagnostic_check
    id: check_diagnostic
    selector: {kind: all, items: [*running, {kind: not, item: *quiet}, &check {kind: any, items: [{kind: has_modifier, modifier: check_quiet}, {kind: has_modifier, modifier: check_diagnostic}, {kind: has_modifier, modifier: check_long}]}, *no_stdin]}
    remaining_selector: *valid_check
    parameters: *check_input
    effects: *read
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: data, stdout_dependency: independent, stderr_dependency: inputs}
  - id: check_diagnostic_stdin
    selector: {kind: all, items: [*running, {kind: not, item: *quiet}, *check, *stdin]}
    remaining_selector: *valid_check
    parameters: *check_input
    effects: *read
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stderr_mode: data, stdout_dependency: independent, stderr_dependency: inputs}

  - &stdout_sort
    id: sort_to_stdout
    selector: {kind: all, items: [*running, &sorting {kind: not, item: *check}, {kind: not, item: &file_output {kind: has_modifier, modifier: output_path}}, *no_stdin]}
    remaining_selector: &complete {kind: no_positional_args}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects: &sort_effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}}
      - {kind: write_path, path_access: content_open, target: {kind: slot, name: output_path}}
      - {kind: write_path, target: {kind: slot, name: temp_directory}}
      - {kind: dispatch_command, target: {kind: dispatch, command: compress_program}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: independent}
  - id: sort_stdin_to_stdout
    selector: {kind: all, items: [*running, *sorting, {kind: not, item: *file_output}, *stdin]}
    remaining_selector: *complete
    parameters: *inputs
    effects: *sort_effects
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: independent}
  - &file_sort
    id: sort_to_file
    selector: {kind: all, items: [*running, *sorting, *file_output, *no_stdin]}
    remaining_selector: *complete
    parameters: *inputs
    effects: *sort_effects
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: sort_stdin_to_file
    selector: {kind: all, items: [*running, *sorting, *file_output, *stdin]}
    remaining_selector: *complete
    parameters: *inputs
    effects: *sort_effects
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - {id: check_diagnostic, matcher: {kind: any_flag, flags: [-c]}}
  - {id: check_quiet, matcher: {kind: any_flag, flags: [-C]}}
  - id: check_long
    matcher: {kind: any_flag, flags: [--check]}
    parameters: [{name: check_method, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]
  - id: output_path
    matcher: {kind: any_flag, flags: [-o, --output]}
    parameters:
      - name: output_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
        structured_projection:
          branches:
            - {matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, unless_modifiers: [information, check_diagnostic, check_quiet, check_long], target: {name: output_path, semantic: {kind: path, role: write, purpose: generic_operand}}}
  - id: temp_directory
    matcher: {kind: any_flag, flags: [-T, --temporary-directory]}
    parameters:
      - name: temp_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
        structured_projection:
          branches:
            - {matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, unless_modifiers: [information, check_diagnostic, check_quiet, check_long], target: {name: temp_directory, semantic: {kind: path, role: write, purpose: generic_operand}}}
  - id: key
    matcher: {kind: any_flag, flags: [-k, --key]}
    parameters: [{name: key_spec, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: field_separator
    matcher: {kind: any_flag, flags: [-t, --field-separator]}
    parameters: [{name: separator, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: compare_mode, matcher: {kind: any_flag, flags: [-b, --ignore-leading-blanks, -d, --dictionary-order, -f, --ignore-case, -g, --general-numeric-sort, -h, --human-numeric-sort, -i, --ignore-nonprinting, -M, --month-sort, -n, --numeric-sort, -R, --random-sort, -r, --reverse, -V, --version-sort]}}
  - {id: output_mode, matcher: {kind: any_flag, flags: [-m, --merge, -s, --stable, -u, --unique, -z, --zero-terminated, --debug]}}
  - id: tuning
    matcher: {kind: any_flag, flags: [-S, --buffer-size, --batch-size, --parallel, --sort]}
    parameters: [{name: tuning_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: random_source
    matcher: {kind: any_flag, flags: [--random-source]}
    parameters: [{name: random_source_operand, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, unless_modifier: information, target: {name: random_source, semantic: {kind: path, role: read, purpose: auxiliary_input}}}]}}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: random_source}}]
  - id: compress_program
    matcher: {kind: any_flag, flags: [--compress-program]}
    parameters: [{name: compress_program, semantic: {kind: command_ref, dispatch: command_name}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]

extensions:
  caushell.profile/sources: [https://github.com/coreutils/coreutils/blob/master/src/sort.c]
  caushell.profile/known_limitations:
    - Implicit sorting temporary directories and file-list expansion are not inferred from host state. Unmodeled --files0-from invocations retain unresolved operation semantics.
