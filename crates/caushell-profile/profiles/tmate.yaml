---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: tmate
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
- id: execute_default_shell_command
  selector:
    kind: has_modifier
    modifier: command
  parameters: []
  effects: []
  stream_contract:
    stdin_mode: data_optional
    stdout_mode: opaque
    stderr_mode: opaque
modifiers:
- id: command
  matcher:
    kind: any_flag
    flags:
    - "-c"
  parameters:
  - name: shell_command
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: shell_command
- id: config_file
  matcher:
    kind: any_flag
    flags:
    - "-f"
  parameters:
  - name: config_file
    semantic:
      kind: path
      role: read
      purpose: tool_config
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: config_file
extensions:
  caushell.profile/source_research:
  - https://manpages.debian.org/unstable/tmate/tmate.1.en.html
  - 'GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/tmate shell'
  caushell.profile/known_limitations:
  - The documented -c option executes shell-command using the configured default shell;
    its string is opaque and is never projected as a shell argv.
  - tmate also creates or joins shared sessions and requires backend connectivity;
    this profile focuses on the pinned -c form.
