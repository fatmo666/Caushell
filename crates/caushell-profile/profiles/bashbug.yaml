dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true

identity:
  canonical_name: bashbug
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families: [posix, linux, macos]
  shell_families: []
  requires_features: []

forms:
  - id: help_or_version
    selector:
      kind: any
      items:
        - {kind: has_modifier, modifier: help}
        - {kind: has_modifier, modifier: version}

  - id: inherited_interactive_editor
    selector:
      kind: all
      items:
        - {kind: no_positional_args}
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_flag, flag: "--help"}
              - {kind: has_flag, flag: "--version"}
    effects:
      - kind: open_interactive_escape_surface
        target: {kind: none}
        surface:
          kind: editor
          requires_tty: true
          capabilities: [spawn_shell, run_command, write_buffer_to_path]

extensions:
  caushell.profile/source_research:
    - GTFOBins upstream bashbug inherits vi's shell function.
    - GNU Bash documentation identifies bashbug as a bug report template/editor tool.
  caushell.profile/known_limitations:
    - Editor selection and execution come from the installed bashbug implementation and editor environment configuration. That host-dependent editor command is not statically resolved here; only the interactive editor capabilities are declared.

modifiers:
  - {id: help, matcher: {kind: any_flag, flags: ["--help"]}}
  - {id: version, matcher: {kind: any_flag, flags: ["--version"]}}
