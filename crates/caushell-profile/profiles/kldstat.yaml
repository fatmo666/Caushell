{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "kldstat",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-h",
          "-q",
          "-v",
          "-d"
        ]
      }
    },
    {
      "id": "id",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-i"
        ]
      },
      "parameters": [
        {
          "name": "module_id",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    },
    {
      "id": "name",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-n"
        ]
      },
      "parameters": [
        {
          "name": "module_name",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    },
    {
      "id": "module",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-m"
        ]
      },
      "parameters": [
        {
          "name": "module_name",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/sources": [
      "https://github.com/freebsd/freebsd-src/blob/main/sbin/kldstat/kldstat.8",
      "https://github.com/freebsd/freebsd-src/blob/main/sbin/kldstat/kldstat.c"
    ],
    "caushell.profile/review_scope": "Kernel status query via kldstat/modstat. -n is a loaded-module name filter, not a module file load. No kldload/kldunload alias or dispatch; arbitrary positional/unknown controls stay Ask."
  }
}
