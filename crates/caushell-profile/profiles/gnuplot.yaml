---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true
identity:
  canonical_name: gnuplot
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: information
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: information
    - kind: not
      item:
        kind: has_modifier
        modifier: code
    - kind: not
      item:
        kind: has_modifier
        modifier: program_file
- id: evaluate_commands
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: code
    - &3
      kind: no_positional_args
    - &1
      kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - &2
    name: program_args
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  stream_contract:
    stdin_mode: data_optional
    stdout_mode: opaque
    stderr_mode: opaque
- id: script_file
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_modifier
        modifier: code
    - kind: not
      item:
        kind: has_modifier
        modifier: program_file
    - *1
  parameters:
  - name: script_program
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: next_positional
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: script_reads
        semantic:
          kind: path
          role: read
          purpose: script_source
  - *2
  effects:
  - kind: read_path
    target:
      kind: slot
      name: script_reads
  - kind: execute_payload
    target:
      kind: slot
      name: script_program
  stream_contract:
    stdin_mode: data_optional
    stdout_mode: opaque
    stderr_mode: opaque
- id: interactive_plotter
  selector:
    kind: all
    items:
    - *3
    - kind: not
      item:
        kind: has_modifier
        modifier: code
    - kind: not
      item:
        kind: has_modifier
        modifier: program_file
    - *1
  implicit_inputs:
  - source: interactive_session
    semantic:
      kind: payload
      language: opaque
      source: interactive
      recursive: true
  effects:
  - kind: execute_payload
    target:
      kind: implicit_input
      source: interactive_session
  stream_contract:
    stdin_mode: payload_optional
    stdout_mode: opaque
    stderr_mode: opaque
extensions:
  caushell.profile/source_research:
  - https://gtfobins.org/gtfobins/gnuplot/
  - https://www.gnuplot.info/docs_6.1/loc720.html
  - https://www.gnuplot.info/docs_6.1/Gnuplot_6.pdf
  caushell.profile/known_limitations:
  - Gnuplot command text and system() contents remain opaque; no embedded command
    is inferred as argv.
  - Only declared native entry grammar is supported. Foreign program content, runtime
    startup/config files and argument-dependent inner effects stay opaque. Unknown
    CLI options use the existing unresolved-operation boundary; no suffix-based file
    type guess. Mixed metadata/code and complex repeated native operations are not
    claimed as normal metadata-only calls.
modifiers:
- id: code
  matcher:
    kind: any_flag
    flags:
    - "-e"
  parameters:
  - name: program
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: program
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-h"
    - "--help"
    - "-V"
    - "--version"
  parameters: []
  effects: []
- id: mode_switches
  matcher:
    kind: any_flag
    flags:
    - "-persist"
    - "-p"
    - "-d"
    - "--default-settings"
  parameters: []
  effects: []
