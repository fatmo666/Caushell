dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: cut
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: select_fields
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: &effects
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths
      - kind: transform_data
        target:
          kind: none
  - id: select_nul_tab_tail
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: information}}
        - &nul_tab_tail
          kind: all
          items:
            - {kind: no_positional_args}
            # The complete argv certifies this stream format while legacy
            # forms keep their existing option and positional binding.
            - kind: any
              items:
                - kind: all
                  items:
                    - {kind: exact_argument_count, count: 1}
                    - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: '-zf2-'}}
                - kind: all
                  items:
                    - {kind: exact_argument_count, count: 2}
                    - kind: any
                      items:
                        - kind: all
                          items:
                            - {kind: has_argument_at_matching, index: 0, matcher: &nul_flag {kind: regex_pattern, pattern: '^(?:-z|--zero-terminated)$'}}
                            - {kind: has_argument_at_matching, index: 1, matcher: &inline_field {kind: regex_pattern, pattern: '^(?:-f2-|--fields=2-)$'}}
                        - kind: all
                          items:
                            - {kind: has_argument_at_matching, index: 0, matcher: *inline_field}
                            - {kind: has_argument_at_matching, index: 1, matcher: *nul_flag}
                - kind: all
                  items:
                    - {kind: exact_argument_count, count: 3}
                    - kind: any
                      items:
                        - kind: all
                          items:
                            - {kind: has_argument_at_matching, index: 0, matcher: *nul_flag}
                            - {kind: has_argument_at_matching, index: 1, matcher: &field_flag {kind: regex_pattern, pattern: '^(?:-f|--fields)$'}}
                            - {kind: has_argument_at_matching, index: 2, matcher: &tail_field {kind: literal, value: '2-'}}
                        - kind: all
                          items:
                            - {kind: has_argument_at_matching, index: 0, matcher: *field_flag}
                            - {kind: has_argument_at_matching, index: 1, matcher: *tail_field}
                            - {kind: has_argument_at_matching, index: 2, matcher: *nul_flag}
    parameters: *inputs
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    stdout_records: {projection: {kind: stdin_transform, transform: after_first_tab_nul}}
    effects: *effects
  - id: select_fields_stdin
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, *stdin, {kind: not, item: *nul_tab_tail}]}
    parameters: *inputs
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: *effects

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: selection
    matcher:
      kind: any_flag
      flags:
        - "-b"
        - "--bytes"
        - "-c"
        - "--characters"
        - "-f"
        - "--fields"
    parameters:
      - name: selection_list
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many

  - id: delimiter
    matcher:
      kind: any_flag
      flags:
        - "-d"
        - "--delimiter"
        - "--output-delimiter"
    parameters:
      - name: delimiter_value
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many


subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
