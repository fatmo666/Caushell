dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true

identity:
  canonical_name: rename
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: rename_paths
    parameters:
      - {name: argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    payload_projections:
      - format: rename_arguments
        source: {kind: slot, name: argv}
        reads: rename_reads
        writes: rename_destinations
        deletes: rename_deletes
        moves: rename_sources
        executions: rename_executions
        max_bytes: 65536
        max_operations: 512
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: rename_reads}}
      - {kind: write_path, target: {kind: slot, name: rename_destinations}}
      - {kind: delete_path, target: {kind: slot, name: rename_deletes}}
      - {kind: move_path, target: {kind: slot, name: rename_sources}, host_risk: {semantic_class: move_source_path}}
      - {kind: execute_payload, target: {kind: slot, name: rename_executions}}

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
  caushell.profile/known_limitations:
    - Unknown implementation uses the union of util-linux and Perl contracts, including option ordering. Explicit rename.ul and file-rename/prename profiles select their documented dialects. Unsupported programs, options and path transformations remain unresolved; no Perl code or filesystem state is evaluated.
  caushell.profile/sources: [https://man7.org/linux/man-pages/man1/rename.1.html, https://metacpan.org/pod/File::Rename, https://cpan.metacpan.org/authors/id/R/RM/RMBARKER/File-Rename-2.02.tar.gz]
