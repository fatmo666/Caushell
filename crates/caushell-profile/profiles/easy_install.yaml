dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: easy_install
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: install_project
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: project_directory
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: derived_path
      source:
        kind: slot
        name: project_directory
      rule:
        kind: child_under
        relative_path: setup.py
      purpose: script_source
  - kind: execute_imported_package_logic
    target:
      kind: none
  - kind: write_path
    target:
      kind: none
subcommands:
extensions:
  caushell.profile/source_research:
  - https://gtfobins.org/gtfobins/easy_install/
  caushell.profile/known_limitations:
  - The pinned source explicitly states that setup.py in the supplied project directory
    executes as Python. The setup script path is a project convention, not inferred
    from a suffix on the CLI argument; TTY is lost in the cited mechanism.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
