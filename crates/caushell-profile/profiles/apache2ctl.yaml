dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: apache2ctl
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: executable_configuration_inline_c
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: inline_c
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: configuration_directive
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: following_flag
      flag: "-c"
      operand_mode: next_arg
    cardinality: required_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: configuration_directive
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-h"
- id: inline_c
  matcher:
    kind: any_flag
    flags:
    - "-c"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/apache2ctl (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://httpd.apache.org/docs/2.4/en/invoking.html
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - The first line only is likely leaked as an error message.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
