dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity: {canonical_name: choom, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}

forms:
  - id: information
    selector: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    remaining_selector: {kind: no_positional_args}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}

  - id: adjust_and_execute
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: adjustment}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_modifier, modifier: process_id}}
    parameters:
      - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    effects:
      - kind: dispatch_command
        target: {kind: dispatch, command: child_command, argv: [child_argv], stdin_from_parent: true, stdout_to_parent: true}

modifiers:
  - id: adjustment
    matcher: {kind: any_flag, flags: ['-n', '--adjust']}
    parameters: [{name: adjustment_value, semantic: {kind: structured_value, context: numeric_quantity}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: process_id
    matcher: {kind: any_flag, flags: ['-p', '--pid']}
    parameters: [{name: process_id, semantic: {kind: process_target, target_kind: pid, broad_match: false}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-V', '--version']}}

subcommands: null
extensions:
  caushell.profile/sources:
    - https://man.archlinux.org/man/core/util-linux/choom.1.en
    - https://manpages.debian.org/testing/util-linux/choom.1.en.html
    - GTFOBins fixed snapshot choom/shell/0
  caushell.profile/scope: Models the child-command form with an explicit OOM score adjustment and dispatch. PID inspection/adjustment, kernel acceptance, and resulting score are not modeled. The value is not range-validated; unsupported or missing forms remain unresolved.
