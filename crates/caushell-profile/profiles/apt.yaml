dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: apt
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
option_scope: all_arguments
opaque_on_unresolved: true
forms:
- id: install_repository_packages
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "^[^./]"
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: package_specs
    semantic:
      kind: package_locator
      manager: apt
      locator_kinds:
      - registry_ref
      - unknown_dynamic
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: import_package
    target:
      kind: slot
      name: package_specs
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: package_specs
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
      purpose: generic_operand
- id: install_local_package
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "^(\\./|/)"
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: package_files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: import_package
    target:
      kind: slot
      name: package_files
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: package_files
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
      purpose: generic_operand
- id: update_with_shell_hook
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: update
    - kind: has_modifier_parameter_matching
      modifier: option
      parameter: option_values
      matcher:
        kind: regex_pattern
        pattern: "^(APT::Update::Pre-Invoke::|APT::Update::Post-Invoke::|DPkg::Pre-Invoke::|DPkg::Post-Invoke::)="
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: apt_update_pre_hooks
  - kind: execute_payload
    target:
      kind: slot
      name: apt_update_post_hooks
  - kind: execute_payload
    target:
      kind: slot
      name: dpkg_pre_hooks
  - kind: execute_payload
    target:
      kind: slot
      name: dpkg_post_hooks
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
- id: update_metadata
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: update
    - kind: all
      items:
      - kind: not
        item:
          kind: has_modifier_parameter_matching
          modifier: option
          parameter: option_values
          matcher:
            kind: regex_pattern
            pattern: "^(APT::Update::Pre-Invoke::|APT::Update::Post-Invoke::|DPkg::Pre-Invoke::|DPkg::Post-Invoke::)="
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
- id: changelog_pager
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: changelog
    - kind: has_positional_at
      index: 1
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: open_interactive_escape_surface
    surface:
      kind: pager
      requires_tty: true
      capabilities:
      - spawn_shell
      - run_command
      - launch_external_editor
    target:
      kind: none
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
- id: read_only_query
  selector:
    kind: any
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: list
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: search
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: show
      - kind: all
        items: []
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
modifiers:
- id: configuration
  matcher:
    kind: any_flag
    flags:
    - "-c"
    - "--config-file"
  parameters:
  - name: configuration_hooks
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
    structured_projection:
      branches: []
      fallback:
        name: configuration_path
        semantic:
          kind: path
          role: config
          purpose: tool_config
  effects:
  - kind: load_config
    target:
      kind: slot
      name: configuration_path
  - kind: read_path
    target:
      kind: slot
      name: configuration_path
  - kind: execute_payload
    target:
      kind: slot
      name: configuration_hooks
- id: declared_non_value_options
  matcher:
    kind: any_flag
    flags:
    - "-y"
    - "--assume-yes"
    - "--installed"
- id: option
  matcher:
    kind: any_flag
    flags:
    - "-o"
    - "--option"
  parameters:
  - name: option_values
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
    structured_projection:
      branches:
      - matcher:
          kind: keyword_value
          keyword: 'APT::Update::Pre-Invoke::'
        target:
          name: apt_update_pre_hooks
          semantic:
            kind: payload
            language: opaque
            source: dynamic_reference
            recursive: true
      - matcher:
          kind: keyword_value
          keyword: 'APT::Update::Post-Invoke::'
        target:
          name: apt_update_post_hooks
          semantic:
            kind: payload
            language: opaque
            source: dynamic_reference
            recursive: true
      - matcher:
          kind: keyword_value
          keyword: 'DPkg::Pre-Invoke::'
        target:
          name: dpkg_pre_hooks
          semantic:
            kind: payload
            language: opaque
            source: dynamic_reference
            recursive: true
      - matcher:
          kind: keyword_value
          keyword: 'DPkg::Post-Invoke::'
        target:
          name: dpkg_post_hooks
          semantic:
            kind: payload
            language: opaque
            source: dynamic_reference
            recursive: true
extensions:
  caushell.profile/source_research: GTFOBins apt source is an alias of apt-get, materialized
    with apt's own identity. Debian apt.conf documents Pre-Invoke/Post-Invoke shell
    hooks executed by /bin/sh.
  caushell.profile/known_limitations:
  - Only explicit APT::Update::Pre-Invoke/Post-Invoke and DPkg::Pre-Invoke/Post-Invoke
    -o keys become opaque dynamic execution entries. DSL structured projection cannot
    retype the extracted hook into inline Bash, so nested shell command detail remains
    partial.
  - Explicit -c config files are kept in native apt.conf format and are never parsed
    as Bash. The file is recorded as config/read plus opaque script-file execution
    boundary because it may select shell hooks.
  - Repository/local apt operands are separated by explicit ./ or / evidence; bare
    RPM/deb suffixes are not treated as paths.
  - Other apt transactions and source/build-dependency handling remain unresolved.
  - Operation selection and global option operands share one declarative root binding
    region; config operands are not mistaken for package inputs.
  - Installation mutates files selected by package contents and native package configuration.
    The static target remains genuinely unknown, never fabricated as a root-directory
    file write.
