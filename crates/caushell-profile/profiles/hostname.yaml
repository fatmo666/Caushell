dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity:
  canonical_name: hostname
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: &information {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent}

  - id: set_hostname
    selector:
      kind: all
      items:
        - &running {kind: not, item: *information}
        - {kind: not, item: {kind: has_modifier, modifier: name_file}}
        - kind: any
          items:
            - {kind: has_positional_at, index: 0}
            - {kind: has_modifier, modifier: boot}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: hostname_value
        semantic:
          kind: plain_value
        binding:
          kind: next_positional
        cardinality: optional_one
    effects:
      - &host_mutation
        kind: state_operation
        state_operation: {domain: host_identity, operation: mutate}
        target:
          kind: none

  - id: set_hostname_from_file
    selector: {kind: all, items: [*running, {kind: has_modifier, modifier: name_file}]}
    parameters:
      - {name: hostname_value, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: optional_one}
    remaining_selector: {kind: no_positional_args}
    effects:
      - *host_mutation
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: name_file}}

  - id: print_hostname
    selector:
      kind: all
      items:
        - *running
        - {kind: no_positional_args}
        - {kind: not, item: {kind: has_modifier, modifier: name_file}}
        - {kind: not, item: {kind: has_modifier, modifier: boot}}
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque
    effects:
      - kind: transform_data
        target:
          kind: none

modifiers:
  - {id: query, matcher: {kind: any_flag, flags: ['-a', '--alias', '-A', '--all-fqdns', '-d', '--domain', '-f', '--fqdn', '--long', '-i', '--ip-address', '-I', '--all-ip-addresses', '--all-ip-address', '-s', '--short', '-n', '--node', '-y', '--yp', '--nis', '-v', '--verbose']}}
  - {id: information, matcher: {kind: any_flag, flags: ['-h', '--help', '-V', '--version']}, ends_option_scope: true}
  - {id: boot, matcher: {kind: any_flag, flags: ['-b', '--boot']}}
  - id: name_file
    matcher: {kind: any_flag, flags: ['-F', '--file']}
    parameters:
      - {name: name_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - https://github.com/ecki/net-tools/blob/master/hostname.c
    - https://github.com/apple-oss-distributions/shell_cmds/blob/main/hostname/hostname.c
  caushell.profile/known_limitations:
    - No positional name, name file or boot fallback means a query. A supplied name can set the hostname under BSD even when a display option is present; without a platform fact that possibility remains a host-identity mutation.
    - Hostname, NIS/DECnet name and boot fallback effects are host identity, not filesystem metadata. File contents and current name are not read dynamically.
