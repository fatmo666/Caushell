dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: w3m
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true
forms:
- id: dump_file
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_modifier
        modifier: dump
      - kind: has_positional_at
        index: 0
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 0
        matcher:
          kind: regex_pattern
          pattern: "^[A-Za-z][A-Za-z0-9+.-]*:"
  parameters:
  - name: input_paths
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
    value_constraints:
    - kind: exclude_literal
      value: "-"
  effects:
  - kind: read_path
    target:
      kind: slot
      name: input_paths
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
    stdout_dependency: inputs
- id: browse_files
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: not
        item:
          kind: has_modifier
          modifier: dump
      - kind: has_positional_at
        index: 0
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 0
        matcher:
          kind: regex_pattern
          pattern: "^[A-Za-z][A-Za-z0-9+.-]*:"
  parameters:
  - name: input_paths
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
    value_constraints:
    - kind: exclude_literal
      value: "-"
  effects:
  - kind: read_path
    target:
      kind: slot
      name: input_paths
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers:
- id: dump
  matcher:
    kind: any_flag
    flags:
    - "-dump"
subcommands:
extensions:
  caushell.profile/source_research:
  - https://github.com/tats/w3m/blob/master/doc/README
  - 'GTFOBins fixed snapshot acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/w3m
    file-read'
  caushell.profile/known_limitations:
  - The -dump form emits rendered text rather than source bytes; URL resources and
    interactive browser behavior are opaque.
  - Declared local-file forms accept one path. URI-shaped operands and additional
    resources remain unsupported instead of becoming fabricated workspace paths.
