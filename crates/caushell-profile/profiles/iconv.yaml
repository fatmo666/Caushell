dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: iconv
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: convert_to_stdout
    selector: {kind: all, items: [{kind: not, item: &output {kind: all, items: [{kind: has_modifier, modifier: output_path}, {kind: not, item: {kind: has_modifier_parameter_matching, modifier: output_path, parameter: output_operand, matcher: {kind: literal, value: '-'}}}]}}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: convert_stdin_to_stdout
    selector: {kind: all, items: [{kind: not, item: *output}, *stdin]}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: convert_to_file
    selector: {kind: all, items: [*output, {kind: not, item: *stdin}]}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: convert_stdin_to_file
    selector: {kind: all, items: [*output, *stdin]}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}

modifiers:
  - id: from_encoding
    matcher:
      kind: any_flag
      flags:
        - "-f"
        - "--from-code"
    parameters:
      - name: from_encoding
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: to_encoding
    matcher:
      kind: any_flag
      flags:
        - "-t"
        - "--to-code"
    parameters:
      - name: to_encoding
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: output_path
    matcher:
      kind: any_flag
      flags:
        - "-o"
        - "--output"
    parameters:
      - name: output_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches: [{matcher: {kind: literal, value: '-'}, target: null}]
          fallback: {name: output_path, semantic: {kind: path, role: write, purpose: generic_operand}}
    effects:
      - kind: write_path
        path_access: content_open
        target:
          kind: slot
          name: output_path

subcommands: null
extensions:
  caushell.profile/known_limitations:
    - Character-set conversion is modeled as a generic data transform; encoding-specific safety properties are not inferred.
