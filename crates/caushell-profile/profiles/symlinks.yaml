dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: symlinks, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: short_clusters
opaque_on_unresolved: true
forms:
  - id: report_links
    selector: {kind: all, items: [{kind: no_dash_dash}, {kind: has_positional_at, index: 0}]}
    parameters:
      - {name: scan_roots, semantic: {kind: path, role: target, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects: [{kind: target_path, target: {kind: slot, name: scan_roots}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: inputs}
modifiers:
  - {id: reporting, matcher: {kind: any_flag, flags: [-r, -s, -v]}}
extensions:
  caushell.profile/source_research:
    - https://sources.debian.org/src/symlinks/1.4-4/symlinks.c
    - https://manpages.debian.org/bookworm/symlinks/symlinks.1.en.html
  caushell.profile/known_limitations:
    - Report mode visits named roots and may recurse with -r. It reports link metadata and does not open target file contents.
    - Conversion, deletion, dry-run combinations and unproved options remain opaque. Report text does not certify a path record format.
