dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: fold
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: fold_lines
    selector: {kind: all, items: [{kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque
    effects: &effects
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths
      - kind: transform_data
        target:
          kind: none

  - id: fold_lines_stdin
    selector: {kind: all, items: [*stdin]}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - id: width
    matcher:
      kind: any_flag
      flags:
        - "-w"
        - "--width"
    parameters:
      - name: width
        semantic:
          kind: structured_value
          context: numeric_quantity
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_one

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
