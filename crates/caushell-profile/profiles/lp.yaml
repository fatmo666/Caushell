---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: lp
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
- id: submit_file_to_remote_printer
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: "-"
  parameters:
  - name: input_files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: remaining_positionals
    cardinality: required_many
    value_constraints:
    - kind: exclude_literal
      value: "-"
  effects:
  - kind: read_path
    path_access: content_open
    target:
      kind: slot
      name: input_files
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: submit_stdin_to_remote_printer
  selector:
    kind: any
    items:
    - kind: no_positional_args
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: "-"
  effects:
  - kind: consume_stdin
    target:
      kind: implicit_input
      source: stdin_data
  stream_contract:
    stdin_mode: data_required
    stdout_mode: opaque
    stderr_mode: opaque
  parameters:
  - name: stdin_marker
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  implicit_inputs:
  - source: stdin_data
    semantic:
      kind: plain_value
modifiers:
- id: server
  matcher:
    kind: any_flag
    flags:
    - "-h"
  parameters:
  - name: server
    semantic:
      kind: endpoint
      endpoint_kind: host_port
      usage: upload_target
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
  effects:
  - kind: network_endpoint
    target:
      kind: slot
      name: server
extensions:
  caushell.profile/source_research:
  - https://www.cups.org/doc/man-lp.html
  - https://www.cups.org/doc/options.html
  - 'GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/lp upload'
  caushell.profile/known_limitations:
  - CUPS sends the selected local document to a print server; local spool internals
    are not modeled as host file writes.
  - The remote printer/backend setup is a precondition and is not simulated.
  - The profile records the server endpoint and source-file reads; it does not infer
    a raw TCP receiver from CUPS configuration.
