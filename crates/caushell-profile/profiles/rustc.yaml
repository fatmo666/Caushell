dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: rustc
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: explanation_pager
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: explain
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: explanation_code
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - run_command
      - spawn_shell
- id: compile_source
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: not
        item:
          kind: has_modifier
          modifier: output
      - kind: not
        item:
          kind: has_modifier
          modifier: explain
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: source_path
    semantic:
      kind: path
      role: read
      purpose: script_source
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: source_path
  - kind: write_path
    target:
      kind: none
- id: compile_source_explicit_output
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: has_modifier
        modifier: output
      - kind: not
        item:
          kind: has_modifier
          modifier: explain
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: source_path
    semantic:
      kind: path
      role: read
      purpose: script_source
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: source_path
  - kind: write_path
    target:
      kind: slot
      name: output_path
modifiers:
- id: explain
  matcher:
    kind: any_flag
    flags:
    - "--explain"
- id: output
  matcher:
    kind: any_flag
    flags:
    - "-o"
  parameters:
  - name: output_path
    semantic:
      kind: path
      role: write
      purpose: generic_operand
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
    - "--version"
    - "-V"
  parameters: []
  ends_option_scope: true
subcommands:
extensions:
  caushell.profile/source_research:
  - https://doc.rust-lang.org/rustc/command-line-arguments.html
  - https://gtfobins.org/gtfobins/rustc/
  caushell.profile/known_limitations:
  - Compilation reads Rust source; when -o is absent, the compiler chooses an output
    path derived from crate/input and target settings, represented as an unknown write
    target rather than no write. Source text remains opaque; proc macros, plugins
    and build scripts may execute, but the source example does not establish arbitrary
    callback argv. --explain may invoke a pager according to terminal/environment
    behavior.
option_matching: exact_names
