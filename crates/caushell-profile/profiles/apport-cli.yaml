dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: apport-cli
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: file_bug_report_with_pager
  selector:
    kind: has_flag
    flag: "-f"
  parameters: []
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: pager
      requires_tty: true
      capabilities:
      - spawn_shell
      - launch_external_editor
      - run_command
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: other_report_mode
  selector:
    kind: not
    item:
      kind: has_flag
      flag: "-f"
  parameters: []
  effects: []
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers:
- id: file_bug
  matcher:
    kind: any_flag
    flags:
    - "-f"
    - "--file-bug"
  parameters: []
- id: package
  matcher:
    kind: any_flag
    flags:
    - "-p"
    - "--package"
  parameters:
  - name: package_name
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/apport-cli (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://manpages.debian.org/experimental/apport/apport-cli.1.en.html
  caushell.profile/known_limitations:
  - The source is an apport-cli -f interactive report flow that inherits less; the
    menu choices and pager keystrokes are native UI input, not shell argv.
  - Only the documented file-bug startup is modeled as a pager escape surface. Other
    report operands/options and upload behavior remain unresolved, not classified
    as harmless.
