{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "kextstat",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "macos"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-a",
          "-arch",
          "--arch",
          "-h",
          "-help",
          "--help",
          "-k",
          "-no-kernel",
          "--no-kernel",
          "-l",
          "-list-only",
          "--list-only",
          "-s",
          "-sort",
          "--sort"
        ]
      }
    },
    {
      "id": "bundle",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-b",
          "-bundle-id",
          "--bundle-id"
        ]
      },
      "parameters": [
        {
          "name": "bundle_ids",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/sources": [
      "https://github.com/apple-oss-distributions/kext_tools/blob/main/kextstat.8",
      "https://github.com/apple-oss-distributions/kext_tools/blob/main/kextstat_main.c"
    ],
    "caushell.profile/review_scope": "Loaded-kext status query. Legacy uses OSKextCopyLoadedKextInfo; current fixed system compatibility helper is kmutil showloaded, not an arbitrary command/extension loader. Only documented parsed query flags admitted; unknown flags/positionals stay Ask."
  },
  "option_matching": "exact_names"
}
