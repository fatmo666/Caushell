dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: uuid, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
forms:
  - id: generate_or_decode
    selector: {kind: all, items: []}
    parameters:
      - {name: values, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
    effects: [{kind: transform_data, target: {kind: none}}]
modifiers:
  - {id: display, matcher: {kind: any_flag, flags: ['-1', -r, -m, -h]}}
  - id: version
    matcher: {kind: any_flag, flags: [-v]}
    parameters:
      - {name: version, semantic: {kind: structured_value, context: numeric_quantity}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
  - id: count
    matcher: {kind: any_flag, flags: [-n]}
    parameters:
      - {name: count, semantic: {kind: structured_value, context: numeric_quantity}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
  - id: format
    matcher: {kind: any_flag, flags: [-F]}
    parameters:
      - {name: format, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
  - id: output
    matcher: {kind: any_flag, flags: [-o]}
    parameters:
      - {name: output_file, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
    # OSSP opens this file while parsing options, before mode/operand checks.
    # In particular, '-' is a literal filename, not a stdout sentinel.
    effects: [{kind: write_path, target: {kind: slot, name: output_file}}]
  - id: decode
    matcher: {kind: any_flag, flags: [-d]}
    effects: [{kind: consume_stdin, target: {kind: none}}]
subcommands: null
extensions:
  caushell.profile/sources:
    - https://sources.debian.org/src/ossp-uuid/1.6.2-1.5/uuid_cli.c/
    - https://sources.debian.org/src/ossp-uuid/1.6.2-1.5/uuid.c/
  caushell.profile/review_scope:
    - OSSP UUID generation/decoding only. It does not share util-linux uuidgen's clock-state contract.
    - Version/count/format/name operands are data, never shell code or file reads. Invalid values may produce diagnostics.
    - Decode conservatively retains stdin dependency, including when a UUID operand was supplied. Output files remain writes in every mode, including help and malformed operands.
    - No total symbolic argv, output shape, numeric stdout or growth certificate is asserted.
