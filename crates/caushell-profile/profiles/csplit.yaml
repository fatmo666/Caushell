dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: csplit, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: split_file_with_prefix
    selector: &prefix_file {kind: all, items: [&running {kind: not, item: {kind: has_modifier, modifier: information}}, &safe_suffix {kind: not, item: {kind: has_modifier_parameter_matching, modifier: suffix_format, parameter: suffix_format, matcher: {kind: regex_pattern, pattern: '/'}}}, &prefix {kind: has_modifier, modifier: prefix}, &file_input {kind: has_positional_at, index: 0}, &named {kind: not, item: &stdin {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}}]}
    remaining_selector: &counting {kind: all, items: [{kind: no_positional_args}, {kind: not, item: &silent {kind: has_modifier, modifier: silent}}]}
    parameters: &inputs
      - {name: input_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: positional_at, index: 0}, cardinality: required_one, value_constraints: [{kind: exclude_literal, value: '-'}]}
      - {name: split_patterns, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects: &prefix_reads
      - &read {kind: read_path, path_access: content_open, target: {kind: slot, name: input_path}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: output_prefix}, rule: {kind: file_name_prefix}, purpose: generic_operand}}
    stream_contract: &named_streams {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: split_stdin_with_prefix
    selector: &prefix_stdin {kind: all, items: [*running, *safe_suffix, *prefix, *file_input, *stdin]}
    remaining_selector: *counting
    parameters: &stdin_inputs
      - {name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
      - {name: split_patterns, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects: &prefix_stdin_effects
      - &consume {kind: consume_stdin, target: {kind: slot, name: stdin_marker}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: output_prefix}, rule: {kind: file_name_prefix}, purpose: generic_operand}}
    stream_contract: &stdin_streams {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: split_file_default_prefix
    selector: &default_file {kind: all, items: [*running, *safe_suffix, &no_prefix {kind: not, item: *prefix}, *file_input, *named]}
    remaining_selector: *counting
    parameters: *inputs
    effects: &default_file_effects
      - *read
      - &default_root {kind: target_path, target: {kind: tool_convention_path, path: xx, convention: csplit.default_prefix, purpose: generic_operand}}
      - &default_write {kind: write_path, target: {kind: derived_path, source: {kind: tool_convention_root, convention: csplit.default_prefix}, rule: {kind: file_name_prefix}, purpose: generic_operand}}
    stream_contract: *named_streams
  - id: split_stdin_default_prefix
    selector: &default_stdin {kind: all, items: [*running, *safe_suffix, *no_prefix, *file_input, *stdin]}
    remaining_selector: *counting
    parameters: *stdin_inputs
    effects: [*consume, *default_root, *default_write]
    stream_contract: *stdin_streams
  - id: split_file_with_prefix_silent
    selector: *prefix_file
    remaining_selector: &silent_shape {kind: all, items: [{kind: no_positional_args}, *silent]}
    parameters: *inputs
    effects: *prefix_reads
    stream_contract: &silent_named_streams {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: split_stdin_with_prefix_silent
    selector: *prefix_stdin
    remaining_selector: *silent_shape
    parameters: *stdin_inputs
    effects: *prefix_stdin_effects
    stream_contract: &silent_stdin_streams {stdin_mode: declared_effects, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: split_file_default_prefix_silent
    selector: *default_file
    remaining_selector: *silent_shape
    parameters: *inputs
    effects: *default_file_effects
    stream_contract: *silent_named_streams
  - id: split_stdin_default_prefix_silent
    selector: *default_stdin
    remaining_selector: *silent_shape
    parameters: *stdin_inputs
    effects: [*consume, *default_root, *default_write]
    stream_contract: *silent_stdin_streams
  - id: split_unresolved_suffix
    operation_semantics_unresolved: true
    selector: {kind: all, items: [*running, {kind: not, item: *safe_suffix}]}
    parameters: *inputs
    effects: [*read]
    stream_contract: {stdin_mode: declared_effects, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}

modifiers:
  - id: prefix
    matcher: {kind: any_flag, flags: [-f, --prefix]}
    parameters: [{name: output_prefix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: suffix_format
    matcher: {kind: any_flag, flags: [-b, --suffix-format]}
    parameters: [{name: suffix_format, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: digits
    matcher: {kind: any_flag, flags: [-n, --digits]}
    parameters: [{name: digits, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: silent, matcher: {kind: any_flag, flags: [-s, --silent, -q, --quiet]}}
  - {id: options, matcher: {kind: any_flag, flags: [-k, --keep-files, -z, --elide-empty-files, --suppress-matched]}}
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
