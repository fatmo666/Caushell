dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: nl
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: number_lines
    stdout_growth: {kind: preserve_records, empty_slots: [input_paths]}
    selector: {kind: all, items: [&running {kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}, {kind: not, item: {kind: has_positional_at, index: 1}}]}
    remaining_selector: {kind: no_positional_args}
    parameters: &inputs
      - name: input_operand
        semantic: {kind: plain_value}
        binding: {kind: next_positional}
        cardinality: optional_one
        structured_projection:
          branches: [{matcher: {kind: literal, value: '-'}, target: null}]
          fallback: {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: number_lines_stdin
    stdout_growth: {kind: preserve_records, empty_slots: [input_paths]}
    selector: {kind: all, items: [*running, *stdin, {kind: not, item: {kind: has_positional_at, index: 1}}]}
    remaining_selector: {kind: no_positional_args}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - id: blank_line_group
    matcher: {kind: any_flag, flags: ['-l', '--join-blank-lines']}
    parameters: [{name: blank_line_count, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: numbering_style
    matcher:
      kind: any_flag
      flags:
        - "-b"
        - "--body-numbering"
        - "-h"
        - "--header-numbering"
        - "-f"
        - "--footer-numbering"
    parameters:
      - name: style
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many

  - id: line_format
    matcher:
      kind: any_flag
      flags:
        - "-n"
        - "--number-format"
        - "-s"
        - "--number-separator"
        - "-w"
        - "--number-width"
        - "-v"
        - "--starting-line-number"
        - "-i"
        - "--line-increment"
        - "-d"
        - "--section-delimiter"
    parameters:
      - name: format_value
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many

  - id: no_renumber
    matcher:
      kind: any_flag
      flags:
        - "-p"
        - "--no-renumber"

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
