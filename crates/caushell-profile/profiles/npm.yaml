dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: npm
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms: []
modifiers:
  - id: working_directory
    matcher: {kind: any_flag, flags: ["-C"]}
    parameters:
      - {name: working_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}
    effects: [{kind: set_execution_working_directory, target: {kind: configured_path, sources: [{slot: working_directory, projection: {kind: identity}}], missing: unknown}}]
subcommands:
  roots:
    - name: install
      option_scope: permuted_options
      aliases:
        - i
        - add
      forms:
        - id: show_help
          selector: {kind: has_modifier, modifier: information}
          parameters: [{name: help_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
        - id: preview_install
          selector: {kind: all, items: [{kind: has_modifier, modifier: preview}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
          parameters: &install_parameters [{name: package_specs, semantic: {kind: package_locator, manager: npm, locator_kinds: [registry_ref, local_path, direct_url, vcs_url, unknown_dynamic]}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
          effects: [&manifest {kind: load_config, target: {kind: tool_convention_path, path: package.json, convention: npm.package_json, purpose: task_config}}]
        - id: install_without_scripts
          selector: {kind: all, items: [{kind: has_modifier, modifier: no_scripts}, {kind: not, item: {kind: has_modifier, modifier: preview}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
          parameters: *install_parameters
          effects:
            - *manifest
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - &install_scope {kind: write_path, target: {kind: configured_path, sources: [{slot: install_prefix, projection: {kind: identity}}], missing: unknown}}
        - id: install_current_project
          operation_semantics_unresolved: true
          selector: {kind: all, items: [{kind: no_positional_args}, {kind: not, item: {kind: has_modifier, modifier: preview}}, {kind: not, item: {kind: has_modifier, modifier: no_scripts}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
          effects:
            - {kind: load_config, target: {kind: tool_convention_path, path: package.json, convention: npm.package_json, purpose: task_config}}
            - {kind: execute_config_defined_task, target: {kind: none}}
            - *install_scope
        - id: install_packages
          selector:
            kind: all
            items:
              - {kind: has_positional_at, index: 0}
              - {kind: not, item: {kind: has_modifier, modifier: preview}}
              - {kind: not, item: {kind: has_modifier, modifier: no_scripts}}
              - {kind: not, item: {kind: has_modifier, modifier: information}}
          parameters:
            - name: package_specs
              semantic:
                kind: package_locator
                manager: npm
                locator_kinds:
                  - registry_ref
                  - local_path
                  - direct_url
                  - vcs_url
                  - unknown_dynamic
              binding:
                kind: remaining_positionals
              cardinality: required_many
          effects:
            - kind: load_config
              target:
                kind: tool_convention_path
                path: package.json
                convention: npm.package_json
                purpose: task_config
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
      modifiers:
        - {id: information, matcher: {kind: any_flag, flags: [-h, --help]}}
        - {id: preview, matcher: {kind: any_flag, flags: [--dry-run]}}
        - {id: no_scripts, matcher: {kind: any_flag, flags: [--ignore-scripts, --package-lock-only]}}
        - id: prefix
          matcher: {kind: any_flag, flags: [--prefix]}
          parameters: [{name: install_prefix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: global_install
          matcher: {kind: any_flag, flags: [-g, --global]}
          effects_when: {unless_modifiers: [preview, information]}
          effects: [*install_scope]
        - id: install_flag
          matcher:
            kind: any_flag
            flags:
              - "-D"
              - "--save-dev"
              - "--dev"
              - "-P"
              - "--save-prod"
              - "--save-optional"
              - "--save-peer"
              - "--save-exact"
              - "--no-save"
              - "--force"
              - "--legacy-peer-deps"
              - "--workspaces"
        - id: install_value_option
          matcher:
            kind: any_flag
            flags:
              - "--registry"
              - "--cache"
              - "--tag"
              - "-w"
              - "--workspace"
              - "--omit"
              - "--include"
              - "--userconfig"
          parameters:
            - name: option_value
              semantic:
                kind: plain_value
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: config
      aliases: []
      forms: []
      modifiers: []
      children:
        - name: get
          aliases: []
          forms:
            - id: get_configuration
              selector: {kind: all, items: []}
              parameters:
                - {name: config_key, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
              effects:
                - {kind: load_config, target: {kind: none}}
              stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
      default_behavior: reject_unknown
      extensions: {}

    - name: ci
      aliases: []
      forms:
        - id: install_from_lockfile
          selector:
            kind: all
            items: []
          effects:
            - kind: load_config
              target:
                kind: tool_convention_path
                path: package.json
                convention: npm.package_json
                purpose: task_config
            - kind: load_config
              target:
                kind: tool_convention_path
                path: package-lock.json
                convention: npm.package_lock
                purpose: task_config
            - kind: execute_imported_package_logic
              target:
                kind: none
      modifiers:
        - id: ci_flag
          matcher:
            kind: any_flag
            flags:
              - "--ignore-scripts"
              - "--dry-run"
              - "--force"
              - "--legacy-peer-deps"
              - "--workspaces"
        - id: ci_value_option
          matcher:
            kind: any_flag
            flags:
              - "--registry"
              - "--cache"
              - "--prefix"
              - "-w"
              - "--workspace"
              - "--omit"
              - "--include"
              - "--userconfig"
          parameters:
            - name: option_value
              semantic:
                kind: plain_value
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: exec
      option_scope: permuted_options
      aliases:
        - x
      forms:
        - id: exec_shell_call
          selector: {kind: has_modifier, modifier: call}
          parameters: [{name: ignored_call_tail, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
        - id: exec_interactive
          selector: {kind: all, items: [{kind: no_positional_args}, {kind: not, item: {kind: has_modifier, modifier: call}}]}
          implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: sh, source: interactive, recursive: true}}]
          effects: [{kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}]
        - id: exec_package_from_modifier
          selector:
            kind: all
            items:
              - {kind: has_modifier, modifier: package}
              - {kind: has_positional_at, index: 0}
              - {kind: not, item: {kind: has_modifier, modifier: call}}
          parameters:
            - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
            - name: exec_args
              semantic:
                kind: plain_value
              binding:
                kind: remaining_args
              cardinality: optional_many
          effects: [{kind: dispatch_command, target: {kind: dispatch, command: child_command, argv: [exec_args], stdout_to_parent: true}}]

        - id: exec_local_program_or_package
          selector:
            kind: all
            items:
              - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(\./|\.\./|/)'}}
              - {kind: not, item: {kind: has_modifier, modifier: package}}
              - {kind: not, item: {kind: has_modifier, modifier: call}}
          parameters:
            - {name: local_execution, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}, binding: {kind: next_positional}, cardinality: required_one}
            - {name: exec_args, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
          effects: [{kind: execute_payload, target: {kind: slot, name: local_execution}}]

        - id: exec_package
          selector:
            kind: all
            items:
              - kind: has_positional_at
                index: 0
              - {kind: not, item: {kind: has_modifier, modifier: call}}
              - {kind: not, item: {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(\./|\.\./|/)'}}}
              - kind: not
                item:
                  kind: has_modifier
                  modifier: package
          parameters:
            - name: package_specs
              semantic:
                kind: package_locator
                manager: npm
                locator_kinds:
                  - registry_ref
                  - local_path
                  - direct_url
                  - vcs_url
                  - unknown_dynamic
              binding:
                kind: next_positional
              cardinality: required_one
            - name: exec_args
              semantic:
                kind: plain_value
              binding:
                kind: remaining_args
              cardinality: optional_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
      modifiers:
        - id: call
          matcher: {kind: any_flag, flags: [-c, --call]}
          parameters: [{name: shell_call, semantic: {kind: payload, language: sh, source: inline_string, recursive: true}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
          effects: [{kind: execute_payload, target: {kind: slot, name: shell_call}}]
        - id: package
          matcher:
            kind: any_flag
            flags:
              - "--package"
              - "-p"
          parameters:
            - name: package_specs
              semantic:
                kind: package_locator
                manager: npm
                locator_kinds:
                  - registry_ref
                  - local_path
                  - direct_url
                  - vcs_url
                  - unknown_dynamic
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
        - id: exec_flag
          matcher:
            kind: any_flag
            flags:
              - "-y"
              - "--yes"
              - "--no"
              - "--ignore-existing"
              - "--workspaces"
        - id: exec_value_option
          matcher:
            kind: any_flag
            flags:
              - "--registry"
              - "--cache"
              - "--prefix"
              - "-w"
              - "--workspace"
              - "--userconfig"
          parameters:
            - name: option_value
              semantic:
                kind: plain_value
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: run
      aliases: []
      forms:
        - id: run_script
          selector:
            kind: all
            items: []
          parameters:
            - name: script_name
              semantic:
                kind: plain_value
              binding:
                kind: next_positional
              cardinality: required_one
            - name: script_args
              semantic:
                kind: plain_value
              binding:
                kind: remaining_args
              cardinality: optional_many
          effects:
            - kind: load_config
              target:
                kind: tool_convention_path
                path: package.json
                convention: npm.package_json
                purpose: task_config
            - kind: execute_config_defined_task
              target:
                kind: none
      modifiers: []
      children: []
      default_behavior: reject_unknown
      extensions: {}
    - name: test
      aliases: []
      forms:
        - id: test_script
          selector:
            kind: all
            items: []
          parameters:
            - name: test_args
              semantic:
                kind: plain_value
              binding:
                kind: remaining_args
              cardinality: optional_many
          effects:
            - kind: load_config
              target:
                kind: tool_convention_path
                path: package.json
                convention: npm.package_json
                purpose: task_config
            - kind: execute_config_defined_task
              target:
                kind: none
      modifiers: []
      children: []
      default_behavior: reject_unknown
      extensions: {}
extensions:
  caushell.profile/known_limitations:
    - npm install/add/i and exec/x are modeled for package execution coverage; lifecycle script details are not expanded.
    - npm ci records lockfile-backed imported package execution semantics, but lockfile dependency contents are not expanded into individual package locators.
    - Package.json content is not parsed here; the profile only captures the convention-backed config load and task execution surface.
