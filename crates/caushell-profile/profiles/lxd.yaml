dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  aliases: []
  canonical_name: lxc
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: information_subcommand
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: literal
      value: help
- id: privileged_container_setup
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: init
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: init_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
- id: container_device_setup
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: config
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: literal
        value: device
    - kind: has_positional_at_matching
      index: 2
      matcher:
        kind: literal
        value: add
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: device_configuration
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
- id: container_start
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: start
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: instance_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
- id: image_import
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: image
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: literal
        value: import
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: image_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
- id: container_command
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: exec
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: container_command_argv
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: container_command_argv
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
- id: config_c
  matcher:
    kind: any_flag
    flags:
    - "-c"
  parameters:
  - name: config_assignment
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_many
- id: image_alias
  matcher:
    kind: any_flag
    flags:
    - "--alias"
  parameters:
  - name: image_alias
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/lxd (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - The image (e.g., `ubuntu:16.04`) must be present already, otherwise it will be
    downloaded.
  - 'This requires steps to be run offline, then the resulting image must be uploaded
    to target. Build the local image with [lxd-alpine-builder](https://github.com/saghul/lxd-alpine-builder):  ```
    git clone https://github.com/saghul/lxd-alpine-builder cd lxd-alpine-builder sudo
    ./build-alpine -a i686 ```'
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
