dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: xmllint, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true

environment_inputs:
  - name: xml_catalog_files
    environment: {name: XML_CATALOG_FILES, empty_is_unset: false}
    require_observation: true
    semantic: {kind: plain_value}

forms:
  - id: xpath_file_with_catalog
    selector:
      kind: all
      items:
        - kind: any
          items:
            - kind: all
              items:
                - {kind: has_argument_at_matching, index: 0, matcher: &query_flag {kind: regex_pattern, pattern: '\A--?xpath\z'}}
                - {kind: has_argument_at_matching, index: 2, matcher: &path {kind: regex_pattern, pattern: '\A[[:alnum:]_./][[:alnum:]_. /-]*\z'}}
            - kind: all
              items:
                - {kind: has_argument_at_matching, index: 0, matcher: *path}
                - {kind: has_argument_at_matching, index: 1, matcher: *query_flag}
                - {kind: has_argument_at_matching, index: 2, matcher: &any_arg {kind: regex_pattern, pattern: '(?s)\A.*\z'}}
        - {kind: not, item: {kind: has_argument_at_matching, index: 3, matcher: *any_arg}}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: document
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: next_positional}
        cardinality: required_one
        value_constraints: [{kind: require_match, pattern: '\A[[:alnum:]_./][[:alnum:]_. /-]*\z'}]
    # The XML loader can consult a catalog and select a different resource.
    # Even --nocatalogs does not close that route in all supported builds.
    operation_semantics_unresolved: true
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: document}}
      - {kind: load_config, target: {kind: configured_path, sources: [], missing: unknown, purpose: tool_config}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: inputs}

modifiers:
  - id: xpath
    matcher: {kind: any_flag, flags: [-xpath, --xpath]}
    parameters:
      - name: expression
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one

extensions:
  caushell.profile/source_research:
    - https://github.com/GNOME/libxml2/blob/v2.9.14/xmllint.c
    - https://github.com/GNOME/libxml2/blob/v2.9.14/xmlIO.c
    - https://github.com/GNOME/libxml2/blob/v2.14.6/xmllint.c
  caushell.profile/known_limitations:
    - Covers XPath with one named local document operand and a separate query. The query result depends on the document and is not an exact output proof.
    - Catalog selection and replacement URLs remain unresolved. URI operands, stdin and additional switches are outside this form.
