dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options_with_operand
opaque_on_unresolved: true

identity:
  canonical_name: ssh
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: local_version_information
    selector: {kind: has_modifier, modifier: local_version}
    parameters: &information_args [{name: ignored_args, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    stream_contract: &local_information {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: independent, stderr_dependency: independent}
  - id: local_algorithm_query
    selector: {kind: has_modifier, modifier: algorithm_query}
    parameters: *information_args
    stream_contract: *local_information
  - id: local_configuration_query
    selector: {kind: has_modifier, modifier: configuration_query}
    parameters: [{name: configuration_host, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}, {name: ignored_args, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    effects:
      - {kind: load_config, target: {kind: slot, name: config_file}}
      - &log_write {kind: write_path, path_access: content_open, target: {kind: slot, name: log_file}}
    stream_contract: *local_information
  - id: inspect_control_master
    selector:
      kind: all
      items:
        - &running {kind: not, item: {kind: any, items: [{kind: has_modifier, modifier: local_version}, {kind: has_modifier, modifier: algorithm_query}, {kind: has_modifier, modifier: configuration_query}]}}
        - {kind: has_modifier_parameter_matching, modifier: control_operation, parameter: control_operation, matcher: {kind: regex_pattern, pattern: '^(check|conninfo|channels)$'}}
    parameters: &host_only [{name: remote_host, semantic: {kind: endpoint, endpoint_kind: host_port, usage: control_plane}, binding: {kind: next_positional}, cardinality: required_one}, {name: ignored_control_tail, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    effects:
      - {kind: target_path, target: {kind: slot, name: control_socket}}
      - *log_write
      - {kind: state_operation, state_operation: {domain: remote_access, operation: inspect}, target: {kind: none}}
    stream_contract: *local_information
  - id: change_control_master
    selector: {kind: all, items: [*running, {kind: has_modifier, modifier: control_operation}, {kind: not, item: {kind: has_modifier_parameter_matching, modifier: control_operation, parameter: control_operation, matcher: {kind: regex_pattern, pattern: '^(check|conninfo|channels)$'}}}]}
    parameters: *host_only
    effects:
      - {kind: target_path, target: {kind: slot, name: control_socket}}
      - *log_write
      - {kind: state_operation, state_operation: {domain: remote_access, operation: control}, target: {kind: none}}
    stream_contract: *local_information
  - id: stdio_forward_only
    selector: {kind: all, items: [*running, &not_control {kind: not, item: {kind: has_modifier, modifier: control_operation}}, {kind: has_modifier, modifier: stdio_forward}]}
    parameters: *host_only
    effects: &transport_effects
      - &remote_endpoint {kind: network_endpoint, target: {kind: slot, name: remote_host}}
      - &control_state {kind: state_operation, state_operation: {domain: remote_access, operation: control}, target: {kind: none}}
      - &identity_read {kind: read_path, target: {kind: slot, name: identity_file}}
      - &configuration_load {kind: load_config, target: {kind: slot, name: config_file}}
      - *log_write
      - &provider_load {kind: load_in_process_code, target: {kind: slot, name: provider}}
      - &socket_target {kind: target_path, target: {kind: slot, name: control_socket}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
    # Forwarded bytes are data, never local shell execution code.
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: transport_only
    selector: {kind: all, items: [*running, *not_control, {kind: has_modifier, modifier: no_command}, {kind: not, item: {kind: has_modifier, modifier: stdio_forward}}]}
    parameters: *host_only
    effects: [*remote_endpoint, *control_state, *identity_read, *configuration_load, *log_write, *provider_load, *socket_target]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: interactive_remote_session
    selector:
      kind: all
      items:
        - *running
        - *not_control
        - {kind: not, item: &no_remote_command {kind: any, items: [{kind: has_modifier, modifier: no_command}, {kind: has_modifier, modifier: stdio_forward}]}}
        - kind: has_positional_at
          index: 0
        - kind: not
          item:
            kind: has_positional_at
            index: 1
    parameters:
      - name: remote_host
        semantic:
          kind: endpoint
          endpoint_kind: host_port
          usage: control_plane
        binding:
          kind: next_positional
        cardinality: required_one
    effects:
      - kind: network_endpoint
        target:
          kind: slot
          name: remote_host
      - kind: execute_remote_command
        target:
          kind: none
      - &opaque_remote {kind: state_operation, state_operation: {domain: remote_access, operation: opaque}, target: {kind: none}}
      - *identity_read
      - *configuration_load
      - *log_write
      - *provider_load
      - *socket_target

  - id: remote_command
    selector:
      kind: all
      items: [*running, *not_control, {kind: not, item: *no_remote_command}, {kind: has_positional_at, index: 1}]
    parameters:
      - name: remote_host
        semantic:
          kind: endpoint
          endpoint_kind: host_port
          usage: control_plane
        binding:
          kind: next_positional
        cardinality: required_one
      - name: remote_command
        semantic:
          kind: plain_value
        binding:
          kind: remaining_args
        cardinality: required_many
    effects:
      - kind: network_endpoint
        target:
          kind: slot
          name: remote_host
      - kind: execute_remote_command
        target:
          kind: slot
          name: remote_command
      - *opaque_remote
      - *identity_read
      - *configuration_load
      - *log_write
      - *provider_load
      - *socket_target

modifiers:
  - {id: local_version, matcher: {kind: any_flag, flags: ["-V"]}}
  - {id: configuration_query, matcher: {kind: any_flag, flags: [-G]}}
  - id: algorithm_query
    matcher: {kind: any_flag, flags: [-Q]}
    parameters: [{name: query_topic, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: no_command, matcher: {kind: any_flag, flags: [-N]}}
  - id: stdio_forward
    matcher: {kind: any_flag, flags: [-W]}
    parameters: [{name: stdio_destination, semantic: {kind: endpoint, endpoint_kind: host_port, usage: control_plane}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: control_operation
    matcher: {kind: any_flag, flags: [-O]}
    parameters: [{name: control_operation, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: control_socket
    matcher: {kind: any_flag, flags: [-S]}
    parameters: [{name: control_socket_operand, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: literal, value: none}, target: null}], fallback: {name: control_socket, semantic: {kind: path, role: target, purpose: generic_operand}}}}]
  - id: logging
    matcher: {kind: any_flag, flags: [-E]}
    parameters: [{name: log_file, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: ssh_option
    matcher: {kind: any_flag, flags: [-o]}
    parameters: [{name: ssh_option, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: forwarding
    matcher: {kind: any_flag, flags: [-L, -R, -D, -w, -J]}
    parameters: [{name: forwarding_specification, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: value_options
    matcher: {kind: any_flag, flags: [-B, -b, -c, -e, -l, -m, -P]}
    parameters: [{name: option_value, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - {id: connection_switches, matcher: {kind: any_flag, flags: ['-2', '-4', '-6', -A, -a, -C, -f, -g, -K, -k, -M, -n, -q, -s, -T, -t, -v, -X, -x, -Y, -y, -Z]}}
  - id: provider
    matcher: {kind: any_flag, flags: [-I]}
    parameters: [{name: provider, semantic: {kind: in_process_code_load, load_kind: library_path}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: port
    matcher:
      kind: any_flag
      flags:
        - "-p"
    parameters:
      - name: port
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: identity_file
    matcher:
      kind: any_flag
      flags:
        - "-i"
    parameters:
      - name: identity_file
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: config_file
    matcher:
      kind: any_flag
      flags:
        - "-F"
    parameters:
      - name: config_file_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches: [{matcher: {kind: literal, value: none}, target: null}]
          fallback: {name: config_file, semantic: {kind: path, role: config, purpose: tool_config}}

subcommands: null
extensions:
  caushell.profile/known_limitations:
    - Remote commands are surfaced as remote execution semantics and are intentionally not recursively parsed as local shell payload.
    - Connection/remote-execution boundaries use the existing opaque remote-access policy, never the local workspace or a guessed remote shell. Control inspection and local information remain separate.
    - Config includes, Match exec, local helper precedence, percent substitutions and exact forwarding endpoint expansion remain opaque, not invented local Bash calls.
