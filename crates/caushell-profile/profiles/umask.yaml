{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "umask",
    "aliases": [],
    "execution_domain": "shell_builtin"
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "linux",
      "macos"
    ],
    "shell_families": [
      "bash"
    ],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-p",
          "-S"
        ]
      }
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/sources": [
      "https://git.savannah.gnu.org/cgit/bash.git/tree/builtins/umask.def?h=bash-5.2"
    ],
    "caushell.profile/review_scope": "No mode operand means query. Any numeric/symbolic mask update or unknown argv remains unresolved, not a query. Shell builtin lookup only."
  }
}
