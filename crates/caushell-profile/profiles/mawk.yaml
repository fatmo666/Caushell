dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: mawk
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families: [posix, linux]
  shell_families: []
  requires_features: []

forms:
  - id: execute_inline_program
    selector:
      kind: all
      items:
        - kind: has_positional_at
          index: 0
        - kind: not
          item:
            kind: has_modifier
            modifier: program_file
    parameters:
      - name: program
        semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}
        binding: {kind: next_positional}
        cardinality: required_one
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints:
          - {kind: exclude_literal, value: "-"}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: execute_payload, target: {kind: slot, name: program}}
      - {kind: read_path, target: {kind: slot, name: input_paths}}

  - id: execute_program_file
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: program_file}
        - kind: not
          item: {kind: has_modifier_parameter_matching, modifier: program_file, parameter: program_files, matcher: {kind: literal, value: '-'}}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints:
          - {kind: exclude_literal, value: "-"}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: input_paths}}

  - id: execute_program_stdin
    selector: {kind: has_modifier_parameter_matching, modifier: program_file, parameter: program_files, matcher: {kind: literal, value: '-'}}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    implicit_inputs:
      - {source: stdin_payload, semantic: {kind: payload, language: opaque, source: stdin, recursive: true}}
    stream_contract: {stdin_mode: payload_required, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: input_paths}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}
      - {kind: execute_payload, target: {kind: implicit_input, source: stdin_payload}}

modifiers:
  - id: program_file
    matcher: {kind: any_flag, flags: ["-f"]}
    parameters:
      - name: program_files
        semantic: {kind: payload, language: opaque, source: script_file_ref, recursive: true}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
        structured_projection:
          branches:
            - {matcher: {kind: literal, value: '-'}}
          fallback: {name: program_file_paths, semantic: {kind: path, role: read, purpose: script_source}}
    effects:
      - {kind: read_path, target: {kind: slot, name: program_file_paths}}
      - {kind: execute_payload, target: {kind: slot, name: program_files}}

  - id: field_separator
    matcher: {kind: any_flag, flags: ["-F"]}
    parameters:
      - name: field_separator
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one

  - id: assign_variable
    matcher: {kind: any_flag, flags: ["-v"]}
    parameters:
      - name: assignments
        semantic: {kind: structured_value, context: env_assignment}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: optional_many

extensions:
  caushell.profile/known_limitations:
    - AWK source is explicitly opaque executable code. Inline and -f programs require approval through the existing unresolved-payload policy; their internal system(), pipe, and redirection syntax is not parsed as Bash or guessed as file effects.
    - The -f '-' reference has an explicit stdin-payload form and no fabricated file named '-'; the original CLI reference is retained alongside its actual implicit stdin source.
