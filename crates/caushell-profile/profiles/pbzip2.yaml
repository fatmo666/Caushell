dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: pbzip2, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: short_clusters
opaque_on_unresolved: true

forms:
  - id: compress_stdin
    selector:
      kind: all
      items:
        - &no_files {kind: all, items: [{kind: no_dash_dash}, {kind: no_positional_args}]}
        - {kind: not, item: &decompress {kind: has_modifier, modifier: decompress}}
    effects:
      - &consume {kind: consume_stdin, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: &data_stream {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: inputs}
  - id: decompress_stdin
    selector:
      kind: all
      items:
        - *no_files
        - *decompress
        - {kind: not, item: {kind: has_modifier, modifier: compress}}
    effects:
      - *consume
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: *data_stream

modifiers:
  - {id: compress, matcher: {kind: any_flag, flags: [-z, --compress]}}
  - {id: decompress, matcher: {kind: any_flag, flags: [-d, --decompress]}}
  - {id: stdout, matcher: {kind: any_flag, flags: [-c, --stdout]}}

extensions:
  caushell.profile/source_research:
    - https://sources.debian.org/src/pbzip2/1.1.13-1.1/pbzip2.cpp
    - https://www.gnu.org/software/tar/manual/html_node/gzip.html
  caushell.profile/known_limitations:
    - Covers only the no-filename stream forms and the flags they share with tar's compression callback.
    - Named files, explicit stream operands, testing and all other flags remain unresolved.
