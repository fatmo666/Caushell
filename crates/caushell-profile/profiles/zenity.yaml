dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity: {canonical_name: zenity, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true

forms:
  - id: select_list_row
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: list}
        - {kind: has_modifier, modifier: column}
    parameters:
      - name: cells
        semantic: {kind: plain_value}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects: [{kind: transform_data, target: {kind: none}}]

modifiers:
  - id: list
    matcher: {kind: any_flag, flags: ['--list']}
  - id: column
    matcher: {kind: any_flag, flags: ['--column']}
    parameters:
      - name: column_names
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

extensions:
  caushell.profile/source_research:
    - https://github.com/GNOME/zenity/blob/master/help/C/list.page
  caushell.profile/known_limitations:
    - Only the list dialog with declared column headers is modeled. Its output depends on UI selection.
