dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: rustdoc
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: document_source
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: has_modifier
        modifier: output
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: source_path
    semantic:
      kind: path
      role: read
      purpose: script_source
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: source_path
  - kind: write_path
    target:
      kind: slot
      name: output_directory
- id: document_source_default_output
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: not
        item:
          kind: has_modifier
          modifier: output
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: source_path
    semantic:
      kind: path
      role: read
      purpose: script_source
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: source_path
  - kind: write_path
    target:
      kind: none
modifiers:
- id: output
  matcher:
    kind: any_flag
    flags:
    - "-o"
  parameters:
  - name: output_directory
    semantic:
      kind: path
      role: write
      purpose: generic_operand
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
    - "--version"
    - "-V"
  parameters: []
  ends_option_scope: true
subcommands:
extensions:
  caushell.profile/source_research:
  - https://doc.rust-lang.org/rustdoc/command-line-arguments.html
  - https://gtfobins.org/gtfobins/rustdoc/
  caushell.profile/known_limitations:
  - Rust doc comments are processed and output pages are generated. The exact generated
    file set depends on source/module structure; no single output path is asserted
    as universal.
  - Unknown options and configuration-driven behavior remain unresolved; the profile
    records only the demonstrated mechanism.
option_matching: exact_names
