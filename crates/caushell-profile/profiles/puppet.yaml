dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: puppet
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: apply_manifest
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: apply
      - kind: has_flag
        flag: "-e"
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects: []
- id: filebucket_diff
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: filebucket
      - kind: has_positional_at_matching
        index: 1
        matcher:
          kind: literal
          value: diff
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: bucket_operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 1
    cardinality: required_one
  - name: files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: read_path
    target:
      kind: slot
      name: files
modifiers:
- id: eval
  matcher:
    kind: any_flag
    flags:
    - "-e"
  parameters:
  - name: manifest
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: manifest
- id: local_bucket
  matcher:
    kind: any_flag
    flags:
    - "-l"
  parameters: []
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
subcommands:
extensions:
  caushell.profile/source_research:
  - https://help.puppet.com/core/current/Content/PuppetCore/Markdown/apply.htm
  - https://gtfobins.org/gtfobins/puppet/
  caushell.profile/known_limitations:
  - The Puppet manifest language is opaque. apply -e evaluates resource declarations;
    the Exec resource's command content is part of the manifest, not Bash input and
    is not expanded into fabricated argv.
