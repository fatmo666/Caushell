dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  aliases: []
  canonical_name: mosh
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: server_shell_request
  selector:
    kind: all
    items:
    - kind: has_argument_at_matching
      index: 0
      matcher:
        kind: regex_pattern
        pattern: "^--server="
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: server_command
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: args_with_prefix
      prefix: "--server="
    cardinality: required_many
  - name: remote_command_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: server_command
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/mosh-server (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - This requires a valid SSH access.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
