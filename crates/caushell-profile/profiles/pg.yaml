extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/pg (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://manpages.debian.org/unstable/bsdmainutils/pg.1.en.html"]
  caushell.profile/known_limitations: ["The GTFOBins example is an interactive pager command sequence; no `!` keystroke is parsed as CLI argv or shell syntax. On a non-TTY stdout, pg behaves as a cat-like file reader, so file data can flow to downstream commands.", "The interactive escape surface requires a TTY; runtime pager behavior and privilege retention are not evaluated."]
