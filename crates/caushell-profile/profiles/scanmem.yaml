dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: scanmem, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: process_memory_debugger
    selector: {kind: all, items: [{kind: not, item: {kind: any, items: [{kind: has_flag, flag: -h}, {kind: has_flag, flag: -v}, {kind: has_flag, flag: --help}, {kind: has_flag, flag: --version}]}}]}
    parameters: []
    effects: [{kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: line_editor, requires_tty: true, capabilities: [spawn_shell, run_command]}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: help_or_version
    selector: {kind: any, items: [{kind: has_flag, flag: -h}, {kind: has_flag, flag: -v}, {kind: has_flag, flag: --help}, {kind: has_flag, flag: --version}]}
    parameters: []
    effects: []
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
modifiers:
  - id: help
    matcher: {kind: any_flag, flags: [-h, --help]}
    parameters: []
  - id: version
    matcher: {kind: any_flag, flags: [-v, --version]}
    parameters: []
subcommands: null
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/scanmem (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://manpages.debian.org/testing/scanmem/scanmem.1.en.html"]
  caushell.profile/known_limitations: ["The source uses scanmem's native interactive command shell /bin/sh; process selection and prompt commands are not caller shell argv.", "scanmem can inspect and modify a target process's memory. The source escape scenario does not supply a PID; attach targets and memory mutations are not modeled."]
