dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: pypi-server
  aliases: []
  module_entrypoints: [{runtime: python, name: pypiserver}]
option_scope: permuted_options
opaque_on_unresolved: true
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters:
      - {name: information_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    # argparse exits before main() initializes logging or starts a server.
    extensions: {caushell.form/suppress_modifier_effects: true}
  - id: run
    selector:
      kind: all
      items:
        - &not_information {kind: not, item: {kind: has_modifier, modifier: information}}
        - &not_update {kind: not, item: {kind: has_modifier, modifier: legacy_update}}
        - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: run}}
    parameters:
      - {name: operation, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one, value_constraints: [{kind: require_match, pattern: '^run$'}]}
      - &roots {name: package_directories, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects: &serve
      - {kind: load_in_process_code, target: {kind: none}}
      - {kind: read_path, target: {kind: slot, name: package_directories}}
      - kind: listen_network
        target:
          kind: network_listener
          host: {slot: host, default_value: '0.0.0.0'}
          port: {slot: port, default_value: '8080'}
  - id: legacy_run
    selector:
      kind: all
      items:
        - *not_information
        - *not_update
        # Modern subcommands with preceding global options and native legacy
        # fallback ambiguities are deliberately not guessed to be directories.
        - {kind: not, item: {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(run|update)$'}}}
        # The native legacy adapter scans raw argv for -U, including after --.
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-U'}}}
    parameters: [*roots]
    effects: *serve

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: ['-h', '--help', '--version']}}
  - {id: legacy_update, matcher: {kind: any_flag, flags: ['-U']}}
  - id: host
    matcher: {kind: any_flag, flags: ['-i', '-H', '--interface', '--host']}
    parameters:
      - {name: host, semantic: &plain {kind: plain_value}, binding: &following {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
  - id: port
    matcher: {kind: any_flag, flags: ['-p', '--port']}
    parameters:
      - name: port
        semantic: *plain
        binding: *following
        cardinality: required_many
        # Preserve incomplete/invalid ports even if the host is loopback.
        value_constraints: [{kind: require_match, pattern: '^(0*[0-9]{1,4}|0*[1-5][0-9]{4}|0*6[0-4][0-9]{3}|0*65[0-4][0-9]{2}|0*655[0-2][0-9]|0*6553[0-5])$'}]
  - id: log_file
    matcher: {kind: any_flag, flags: ['--log-file']}
    parameters:
      - {name: log_file, semantic: {kind: path, role: write, purpose: generic_operand}, binding: *following, cardinality: required_many}
    effects: [{kind: write_path, target: {kind: slot, name: log_file}}]
  - id: welcome
    matcher: {kind: any_flag, flags: ['--welcome']}
    parameters:
      - {name: welcome_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: *following, cardinality: required_many}
    effects: [{kind: read_path, target: {kind: slot, name: welcome_file}}]
  - id: server
    matcher: {kind: any_flag, flags: ['--server']}
    parameters:
      # Other adapters can introduce executable configuration (e.g. Gunicorn).
      # Retain the listener fact, but do not certify those routes as complete.
      - {name: server_method, semantic: *plain, binding: *following, cardinality: required_many, value_constraints: [{kind: require_match, pattern: '^(auto|wsgiref)$'}]}
  - id: backend
    matcher: {kind: any_flag, flags: ['--backend']}
    parameters:
      - {name: backend, semantic: *plain, binding: *following, cardinality: required_many, value_constraints: [{kind: require_match, pattern: '^(auto|simple-dir|cached-dir)$'}]}
  - id: log_stream
    matcher: {kind: any_flag, flags: ['--log-stream']}
    parameters:
      - {name: log_stream, semantic: *plain, binding: *following, cardinality: required_many, value_constraints: [{kind: require_match, pattern: '(?i)^(stdout|stderr|none)$'}]}
  - id: data_options
    matcher: {kind: any_flag, flags: ['--log-frmt', '--log-req-frmt', '--log-res-frmt', '--log-err-frmt', '--fallback-url', '--health-endpoint', '--cache-control', '--server-base-url', '--hash-algo']}
    parameters: [{name: data_values, semantic: *plain, binding: *following, cardinality: required_many}]
  - {id: switches, matcher: {kind: any_flag, flags: ['-v', '--verbose', '--disable-fallback']}}

extensions:
  caushell.profile/sources:
    - https://github.com/pypiserver/pypiserver/blob/v2.4.2/pyproject.toml
    - https://github.com/pypiserver/pypiserver/blob/v2.4.2/pypiserver/config.py
    - https://github.com/pypiserver/pypiserver/blob/v2.4.2/pypiserver/__main__.py
  caushell.profile/scope:
    - Declares native run and unambiguous legacy startup through the existing listener effect. Explicit arguments precede literal defaults, repeated scalar options use their last owned operand, and hostnames/dynamic addresses are never resolved with DNS or the guard's environment.
    - Package directories are read targets, not listener permission or ownership. Loopback only exempts the listener rule; logging paths, startup uncertainty, independent mutations and Deny findings remain separate.
    - The supported default authentication route has no password file and rejects updates. Authentication/password/overwrite options remain unresolved because they can enable upload/removal routes. Update mode and adapters with unmodeled executable configuration also remain Ask.
    - Help/version does not start a listener or initialize a log file. Option-looking operands stay with their native option. Incomplete grammar, abbreviations and ambiguous global-option/subcommand fallback are not silently completed.
