dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: postfix, aliases: []}
option_scope: leading_options
opaque_on_unresolved: true
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix], shell_families: [], requires_features: []}

# The native program invokes postfix-script or a configured multi-instance
# wrapper. CLI identity alone cannot certify that helper/configuration route.
selection_failure_effects:
  - &configured_helper {kind: state_operation, state_operation: {domain: service_manager, operation: opaque}, target: {kind: none}}

forms:
  - id: control_service
    selector: {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(start|start-fg|stop|abort|reload|flush)$'}}
    parameters:
      - &operation {name: operation, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    effects:
      - {kind: state_operation, state_operation: {domain: service_manager, operation: control}, target: {kind: none}}
      - *configured_helper
  - id: maintain_service
    selector: {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(check|set-permissions|upgrade-configuration|logrotate)$'}}
    parameters:
      - *operation
      - {name: settings, semantic: {kind: structured_value, context: env_assignment}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects:
      # In particular, `check` may create missing directories.
      - {kind: state_operation, state_operation: {domain: service_manager, operation: mutate}, target: {kind: none}}
      - *configured_helper
  - id: inspect_status
    selector: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: status}}
    parameters: [*operation]
    effects:
      - {kind: state_operation, state_operation: {domain: service_manager, operation: inspect}, target: {kind: none}}
      - *configured_helper

modifiers:
  - id: configuration
    matcher: {kind: any_flag, flags: ['-c']}
    parameters:
      - {name: configuration_directory, semantic: {kind: path, role: read, purpose: tool_config}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}
    effects:
      - {kind: read_path, target: {kind: slot, name: configuration_directory}}
      - {kind: load_config, target: {kind: slot, name: configuration_directory}}
  - {id: verbose, matcher: {kind: any_flag, flags: ['-v']}}
  - id: debugger
    matcher: {kind: any_flag, flags: ['-D']}
    effects: [*configured_helper]

extensions:
  caushell.profile/sources:
    - https://www.postfix.org/postfix.1.html
    - https://raw.githubusercontent.com/vdukhovni/postfix/master/postfix/man/man1/postfix.1
  caushell.profile/scope:
    - Declares typed service operations through the existing state guard. A configuration directory or instance name is not resource authorization.
    - Helper selection, MAIL_CONFIG, multi-instance wrappers, debugger commands and configuration bodies are not interpreted or executed. Their unresolved route remains a separate opaque state operation, including for status.
    - Unknown operations/options and missing operands retain an opaque state effect. No default configuration, queue path, process identity or successful service transition is invented.
