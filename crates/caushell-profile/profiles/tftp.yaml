dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: tftp, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: open_tftp_transfer_prompt
    selector: {kind: any, items: [{kind: has_positional_at, index: 0}, {kind: no_positional_args}]}
    parameters: [{name: startup_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects: [{kind: open_interactive_escape_surface, target: {kind: implicit_input, source: interactive_session}, surface: {kind: terminal_ui, requires_tty: false, capabilities: []}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers: []
extensions:
  caushell.profile/source_research: ['https://man.openbsd.org/OpenBSD-7.3/tftp.1', 'https://www.gnu.org/software/inetutils/manual/html_node/tftp-invocation.html', 'GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/tftp download and upload']
  caushell.profile/known_limitations: ['The source materializes as startup command tftp attacker.com and later native prompt input get /path/to/input-file or put /path/to/input-file; prompt commands are not shell commands.', 'Startup records a default host but does not transfer data. Later get writes a local file and put reads one; these prompt operations remain outside argv.', 'Local get filename defaults, remote path mapping, transfer mode and server behavior are not projected.']
