dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: ftp, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: ftp_transfer_prompt
    selector: {kind: all, items: []}
    parameters: [{name: host, semantic: {kind: endpoint, endpoint_kind: remote_spec, usage: control_plane}, binding: {kind: next_positional}, cardinality: optional_one}]
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects: [{kind: network_endpoint, target: {kind: slot, name: host}}, {kind: open_interactive_escape_surface, target: {kind: implicit_input, source: interactive_session}, surface: {kind: terminal_ui, requires_tty: false, capabilities: [run_command, spawn_shell]}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - {id: anonymous_login, matcher: {kind: any_flag, flags: [-a]}}
  - {id: no_auto_login, matcher: {kind: any_flag, flags: [-n]}}
  - {id: passive_mode, matcher: {kind: any_flag, flags: [-p]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/ftp (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://www.gnu.org/software/inetutils/manual/html_node/ftp-invocation.html", "https://www.gnu.org/software/inetutils/manual/html_node/ftp-commands.html"]
  caushell.profile/known_limitations: ["The source's get and put lines are FTP prompt commands, not caller argv; they are kept as opaque interactive input and no transfer is claimed at startup.", "A successful server connection, authentication, transfer path resolution and data movement are runtime-dependent."]
