dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity: {canonical_name: softlimit, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: set_limits_and_execute
    selector: {kind: has_positional_at, index: 0}
    parameters:
      - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    effects:
      - kind: dispatch_command
        target: {kind: dispatch, command: child_command, argv: [child_argv], stdin_from_parent: true, stdout_to_parent: true}

modifiers: []
subcommands: null
extensions:
  caushell.profile/sources:
    - https://manpages.debian.org/unstable/daemontools/softlimit.8.en.html
    - http://cr.yp.to/daemontools/softlimit.html
    - GTFOBins fixed snapshot softlimit/shell/0
  caushell.profile/scope: Models command execution with inherited streams. The current DSL has no dedicated resource-limit effect, so the source recipe's launch under new soft limits is documented but not represented as a control_process signal. The source recipe supplies no limit options, so option parsing is intentionally not generalized. Resource values, platform support, and limit enforcement are not inspected.
