dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true
identity: {canonical_name: irb, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
  - id: startup_script
    selector: {kind: all, items: [{kind: has_positional_at, index: 0}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters:
      - {name: script, semantic: {kind: payload, language: opaque, source: script_file_ref, recursive: true}, binding: {kind: next_positional}, cardinality: required_one, structured_projection: {branches: [], fallback: {name: script_path, semantic: {kind: path, role: read, purpose: script_source}}}}
      - {name: script_args, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects: [{kind: read_path, target: {kind: slot, name: script_path}}, {kind: execute_payload, target: {kind: slot, name: script}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: interactive_repl
    selector: {kind: all, items: [{kind: no_positional_args}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects:
      - {kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}
    stream_contract: {stdin_mode: payload_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, -h, --version, -v]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/irb (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://docs.ruby-lang.org/en/3.4/IRB.html"]
  caushell.profile/known_limitations:
    - "GTFOBins starts irb and supplies later Ruby REPL input; the Ruby input is opaque and is never parsed as Bash."
    - "Ruby code can invoke arbitrary process and filesystem APIs, but those inner effects are not inferred from the startup command."
    - "IRB startup configuration and initialization scripts are not modeled."
    - "An explicit first positional argument is modeled as IRB's Ruby initialization script; its content remains opaque."
