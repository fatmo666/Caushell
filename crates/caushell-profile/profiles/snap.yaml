dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: snap
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information_subcommand
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: literal
      value: help
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: install_hook_package
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "\\.snap$"
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: install_operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: snap_package
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: last_positional
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: snap_package
  - kind: import_package
    target:
      kind: slot
      name: snap_package
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: snap_package
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
modifiers:
- id: dangerous
  matcher:
    kind: any_flag
    flags:
    - "--dangerous"
- id: devmode
  matcher:
    kind: any_flag
    flags:
    - "--devmode"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/snap (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Generate the Snap package with [fpm](https://github.com/jordansissel/fpm) and
    upload it to the target.  ``` mkdir -p meta/hooks echo -e '#!/bin/sh\n/path/to/command;
    false' >meta/hooks/install chmod +x meta/hooks/install fpm -n xxxx -s dir -t snap
    -a all meta ```
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
