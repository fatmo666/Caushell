dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: opencode
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: shell_escape_ui
  selector:
    kind: all
    items:
    - kind: no_arguments
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  implicit_inputs:
  - source: interactive_session
    semantic:
      kind: payload
      language: opaque
      source: interactive
      recursive: true
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - run_command
- id: database_query
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: db
      - kind: has_positional_at
        index: 1
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: sql
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: sql
- id: database_ui
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: db
      - kind: not
        item:
          kind: has_positional_at
          index: 1
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - run_command
subcommands:
extensions:
  caushell.profile/source_research:
  - https://github.com/anomalyco/opencode
  - https://gtfobins.org/gtfobins/opencode/
  caushell.profile/known_limitations:
  - OpenCode db <query> passes SQL to sql.raw and executes it through the application's
    database API; it is opaque SQL input, not sqlite3 CLI syntax. Without a query
    the command spawns sqlite3 and may expose its interactive UI. The ! command is
    entered in the interactive terminal UI; UI parsing, config-driven queries, and
    startup plugins remain partial.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
