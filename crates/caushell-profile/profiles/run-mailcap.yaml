  caushell.profile/known_limitations: ["The profile projects text/plain and application/octet-stream MIME targets with an absolute path; other MIME types and path spellings remain unresolved rather than being guessed from extensions.", "Viewer/editor dispatch and the selected pager depend on the mailcap database. The profile records a possible native surface and never fabricates the configured child argv.", "Edit requires an existing nonempty target according to the source. Successful file writes and editor selection are runtime-dependent."]
