{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "lshw",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "linux"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-help",
          "--help",
          "-version",
          "-verbose",
          "-quiet",
          "-json",
          "-xml",
          "-html",
          "-short",
          "-businfo",
          "-sanitize",
          "-sanitise",
          "-numeric",
          "-notime"
        ]
      }
    },
    {
      "id": "class",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-class",
          "-C",
          "-c"
        ]
      },
      "parameters": [
        {
          "name": "classes",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    },
    {
      "id": "dump",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-dump"
        ]
      },
      "parameters": [
        {
          "name": "dump_database",
          "semantic": {
            "kind": "path",
            "role": "write",
            "purpose": "generic_operand"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many",
          "value_constraints": [
            {
              "kind": "require_match",
              "pattern": "^(?:/.*|\\./.*|\\.\\./.*|[^:]+)$"
            }
          ]
        }
      ],
      "effects": [
        {
          "kind": "write_path",
          "path_access": "content_open",
          "target": {
            "kind": "slot",
            "name": "dump_database"
          }
        }
      ]
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/sources": [
      "https://github.com/lyonel/lshw/blob/master/src/lshw.cc",
      "https://github.com/lyonel/lshw/blob/master/src/core/options.cc"
    ],
    "caushell.profile/review_scope": "Reviewed CLI scan/display/class selection and -dump file write. Class operands filter output, not scan control names. -X starts gtk-lshw and -enable/-disable can toggle internal output/scan features: all remain unresolved. No assumption that all lshw invocations are read-only. Dump binds only unambiguous ordinary filesystem paths. Bare SQLite URI/special names remain unresolved; explicit ./ disambiguates literal colon filenames."
  },
  "option_matching": "exact_names"
}
