---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: openvpn
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
- id: read_config_file
  selector:
    kind: has_modifier
    modifier: config
  parameters: []
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: config_file
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: execute_opaque_up_callback
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: up_callback
    - &1
      kind: has_modifier_parameter_matching
      modifier: script_security
      parameter: script_security_level
      matcher:
        kind: regex_pattern
        pattern: "^[23]$"
    - kind: not
      item:
        kind: has_modifier
        modifier: config
  parameters: []
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: up_command
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: callback_disabled_by_security
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: up_callback
    - kind: not
      item: *1
    - kind: not
      item:
        kind: has_modifier
        modifier: config
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers:
- id: config
  matcher:
    kind: any_flag
    flags:
    - "--config"
  parameters:
  - name: config_file
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
    structured_projection:
      branches: []
      fallback:
        name: config_reads
        semantic:
          kind: path
          role: read
          purpose: tool_config
  effects:
  - kind: read_path
    target:
      kind: slot
      name: config_reads
- id: up_callback
  matcher:
    kind: any_flag
    flags:
    - "--up"
  parameters:
  - name: up_command
    semantic:
      kind: payload
      language: opaque
      source: dynamic_reference
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
  effects: []
- id: script_security
  matcher:
    kind: any_flag
    flags:
    - "--script-security"
  parameters:
  - name: script_security_level
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
- id: device
  matcher:
    kind: any_flag
    flags:
    - "--dev"
  parameters:
  - name: device_name
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
extensions:
  caushell.profile/source_research:
  - https://openvpn.net/community-docs/community-articles/openvpn-2-6-manual.html
  - 'GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/openvpn file-read
    and shell'
  caushell.profile/known_limitations:
  - "--config reads OpenVPN directives; directives and subordinate file references
    are not parsed."
  - "--up executes an external program after interface setup when script security
    permits. OpenVPN appends runtime-generated arguments and environment; callback
    remains opaque and no fixed argv or DispatchCommand is invented."
  - The sudo source context substitutes /bin/sh -p -s; callback privilege, interface
    availability and runtime arguments are not simulated.
