dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: dnf
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: install_local_package
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "^(\\./|/)"
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: package_files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: read_path
    target:
      kind: slot
      name: package_files
  - kind: import_package
    target:
      kind: slot
      name: package_files
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: package_files
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
      purpose: generic_operand
- id: install_packages
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "^[^./]"
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: local_package_files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: positionals_matching
      matcher:
        kind: regex_pattern
        pattern: "^(\\./|/)"
    cardinality: optional_many
  - name: packages
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: import_package
    target:
      kind: slot
      name: packages
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: packages
  - kind: read_path
    target:
      kind: slot
      name: local_package_files
  - kind: import_package
    target:
      kind: slot
      name: local_package_files
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: local_package_files
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
      purpose: generic_operand
- id: read_only_query
  selector:
    kind: any
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: list
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: info
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: search
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: provides
      - kind: all
        items: []
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: repoquery
      - kind: all
        items: []
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
extensions:
  caushell.profile/source_research:
  - https://dnf.readthedocs.io/en/latest/command_ref.html
  - 'GTFOBins _gtfobins/dnf: install mode imports RPM package scriptlets.'
  caushell.profile/known_limitations:
  - No PackageManagerKind exists for DNF; package operands stay plain values or explicit
    paths, without a false Apt/Yum label.
  - Bare .rpm suffixes are not file evidence. Only explicit ./ or / operands are read
    as local files; other origins remain unresolved by the native transaction.
  - The RPM package scriptlets are modeled as imported package logic; their contents
    and resulting file-level effects are not enumerated.
  - Package writes retain a genuine unknown target; installation root is not fabricated
    as a concrete file being written.
  - Native repository and installroot option operands share the same root region as
    operation selection and package binding; they are not mistaken for packages.
  - Installation mutates files selected by package contents and native package configuration.
    The static target remains genuinely unknown, never fabricated as a root-directory
    file write.
modifiers:
- id: declared_non_value_options
  matcher:
    kind: any_flag
    flags:
    - "-y"
    - "--assumeyes"
- id: repository_selection
  matcher:
    kind: any_flag
    flags:
    - "--disablerepo"
    - "--enablerepo"
  parameters:
  - name: repository_names
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
- id: installroot
  matcher:
    kind: any_flag
    flags:
    - "--installroot"
  parameters:
  - name: installroot
    semantic:
      kind: path
      role: target
      purpose: generic_operand
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
