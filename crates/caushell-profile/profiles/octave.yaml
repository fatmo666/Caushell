dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true
identity: {canonical_name: octave, aliases: [octave-cli]}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos, windows], shell_families: [], requires_features: []}
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
  - id: evaluate_code
    selector: {kind: all, items: [{kind: has_modifier, modifier: code}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters:
      - {name: code, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: following_flag, flag: --eval, operand_mode: next_arg}, cardinality: optional_one}
      - {name: code_short, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: following_flag, flag: -e, operand_mode: next_arg}, cardinality: optional_one}
    effects: [{kind: execute_payload, target: {kind: slot, name: code}}, {kind: execute_payload, target: {kind: slot, name: code_short}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: interactive_repl
    selector: {kind: all, items: [{kind: no_arguments}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects:
      - {kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}
    stream_contract: {stdin_mode: payload_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - id: code
    matcher: {kind: any_flag, flags: [--eval, -e]}
    parameters: [{name: raw_code, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
  - {id: information, matcher: {kind: any_flag, flags: [--help, -h, --version, -v]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/octave (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://docs.octave.org/interpreter/Command-Line-Options.html"]
  caushell.profile/known_limitations:
    - "All upstream examples use octave-cli --eval. octave-cli is retained as an explicit native alias of this octave profile; no other tool is treated as an alias."
    - "Octave code is opaque and never parsed as Bash. system() arguments, fopen/fputs targets and other inner file/process effects are not inferred from -eval code."
    - "The source notes payload compatibility with GUI mode, but the materialized examples specifically launch octave-cli."
