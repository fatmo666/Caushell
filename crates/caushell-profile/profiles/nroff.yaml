dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true
identity: {canonical_name: nroff, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
environment_inputs:
  - name: helper_search_path
    environment: {name: GROFF_BIN_PATH, empty_is_unset: true}
    semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}
    unless_modifiers: [information]
forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
  - id: format_input_files
    selector: {kind: all, items: [{kind: has_positional_at, index: 0}, {kind: not, item: {kind: has_modifier, modifier: unsafe}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]
  - id: format_stdin
    selector: {kind: all, items: [{kind: no_positional_args}, {kind: not, item: {kind: has_modifier, modifier: unsafe}}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    implicit_inputs:
      - {source: stdin_payload, semantic: {kind: payload, language: opaque, source: stdin, recursive: false}}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
    effects: [{kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}]
  - id: unsafe_format_input_files
    selector: {kind: all, items: [{kind: has_modifier, modifier: unsafe}, {kind: has_positional_at, index: 0}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters:
      - {name: input_payloads, semantic: {kind: payload, language: opaque, source: script_file_ref, recursive: true}, binding: {kind: remaining_positionals}, cardinality: required_many, structured_projection: {branches: [], fallback: {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}}}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: unknown}
    effects:
      - {kind: read_path, target: {kind: slot, name: input_paths}}
      - {kind: execute_payload, target: {kind: slot, name: input_payloads}}
  - id: unsafe_format_stdin
    selector: {kind: all, items: [{kind: no_positional_args}, {kind: has_modifier, modifier: unsafe}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    implicit_inputs:
      - {source: stdin_payload, semantic: {kind: payload, language: opaque, source: stdin, recursive: true}}
    stream_contract: {stdin_mode: payload_required, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: unknown}
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}
      - {kind: execute_payload, target: {kind: implicit_input, source: stdin_payload}}
modifiers:
  - {id: information, matcher: {kind: any_flag, flags: ['--help', '-V']}}
  - {id: version, matcher: {kind: any_flag, flags: ['--version', '-v']}}
  - {id: unsafe, matcher: {kind: any_flag, flags: ['-U']}}
extensions:
  caushell.profile/source_research:
    - https://www.gnu.org/software/groff/manual/groff.html
  caushell.profile/known_limitations:
    - Named roff documents are content reads and formatter output may disclose their text; -U enables unsafe document requests and is represented as opaque executable input.
    - Explicit GROFF_BIN_PATH selects opaque native helper execution; absent ambient values do not add a new policy. --help and -V do not execute helpers; -v/--version can execute helpers to obtain versions.
    - Roff macros, included files, helper search, and postprocessor behavior are not interpreted. A '-' stdin operand is unresolved.
