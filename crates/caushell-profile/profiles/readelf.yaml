dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: readelf, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
argument_files:
  - {prefix: '@', possible_effects: [read_path]}
forms:
  - id: information
    selector: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: inspect_response_file
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}}
        - {kind: has_modifier, modifier: all}
        - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@.+'}}
        - {kind: not, item: {kind: has_positional_at, index: 1}}
    parameters:
      - name: response_argument
        semantic: {kind: plain_value}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection:
          branches:
            - matcher: {kind: prefix, value: '@'}
              target: {name: response_paths, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: response_paths}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
  - id: inspect_elf_files
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters: [{name: elf_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: elf_paths}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
modifiers:
  - {id: all, matcher: {kind: any_flag, flags: ['-a', '--all']}}
  - {id: display, matcher: {kind: any_flag, flags: ['-W', '--wide', '-T', '--silent-truncation', '-h', '--file-header', '-l', '--program-headers', '--segments', '-S', '--section-headers', '--sections', '-g', '--section-groups', '-t', '--section-details', '-e', '--headers', '-s', '--syms', '--symbols', '--dyn-syms', '--lto-syms', '-n', '--notes', '-r', '--relocs', '-u', '--unwind', '-d', '--dynamic', '-V', '--version-info', '-A', '--arch-specific', '-D', '--use-dynamic', '-L', '--lint', '--enable-checks', '-c', '--archive-index', '-I', '--histogram', '--quiet']}}
  - {id: help, matcher: {kind: any_flag, flags: ['-H', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-v', '--version']}}
subcommands: null
extensions:
  caushell.profile/source_research:
    - https://sourceware.org/binutils/docs/binutils/readelf.html
    - https://gtfobins.org/gtfobins/readelf/
  caushell.profile/known_limitations:
    - The @FILE recipe has an explicit form that projects the concrete response path after the @ prefix. The argument_files mechanism also retains an opaque possible read_path effect for expanded argv; nested option ownership and further response-file paths are not interpreted.
    - ELF diagnostic and display streams depend on object/response-file content. Response-file contents can introduce more read requests that are not identified by path; no mutations or command execution are claimed for readelf.
