dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true
identity: {canonical_name: ghci, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos, windows], shell_families: [], requires_features: []}
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
  - id: evaluate_expression
    selector: {kind: all, items: [{kind: has_modifier, modifier: expression}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters: [{name: expression, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: following_flag, flag: -e, operand_mode: next_arg}, cardinality: required_one}]
    effects: [{kind: execute_payload, target: {kind: slot, name: expression}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: interactive_repl
    selector: {kind: all, items: [{kind: no_arguments}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects:
      - {kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}
    stream_contract: {stdin_mode: payload_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - id: expression
    matcher: {kind: any_flag, flags: [-e]}
    parameters: [{name: raw_expression, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
  - {id: information, matcher: {kind: any_flag, flags: [--help, -?, --version, -V]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/ghci (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://downloads.haskell.org/ghc/latest/docs/users_guide/ghci.html"]
  caushell.profile/known_limitations:
    - "GTFOBins starts ghci and enters a later Haskell expression; prompt input is opaque Haskell and is never parsed as Bash."
    - "System.Process actions and effects of loaded modules or startup configuration are not inferred from an interactive startup."
    - "This profile remains distinct from ghc expression-evaluation mode."
    - "Documented ghci -e evaluation is retained as an opaque expression payload and does not make ghci an alias of ghc."
