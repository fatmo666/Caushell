dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: find
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

option_matching: exact_names
opaque_on_unresolved: true
argument_regions:
  - id: exec
    start_flags: ["-exec"]
    terminators:
      - {value: ";"}
      - {value: "+", preceding: "{}"}
  - id: execdir
    start_flags: ["-execdir"]
    terminators:
      - {value: ";"}
      - {value: "+", preceding: "{}"}

forms:
  - id: exec_command
    selector:
      kind: any
      items:
        - kind: has_flag
          flag: "-exec"
        - kind: has_flag
          flag: "-execdir"
    parameters:
      - name: exec_command
        semantic:
          kind: command_ref
          dispatch: wrapper_command
        binding:
          kind: argument_region_command
          region: exec
        cardinality: optional_many
      - name: execdir_command
        semantic:
          kind: command_ref
          dispatch: wrapper_command
        binding:
          kind: argument_region_command
          region: execdir
        cardinality: optional_many
      - name: exec_args
        semantic:
          kind: plain_value
        binding:
          kind: argument_region_args
          region: exec
        cardinality: optional_many
      - name: execdir_args
        semantic:
          kind: plain_value
        binding:
          kind: argument_region_args
          region: execdir
        cardinality: optional_many
      - name: search_roots
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "{}"
          - kind: exclude_literal
            value: ";"
          - kind: exclude_literal
            value: "+"
    stream_contract:
      stdin_mode: ignored
      stdout_mode: path_list
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: search_roots
      - kind: dispatch_command
        target:
          kind: dispatch
          command: exec_command
          argv:
            - exec_args
      - kind: dispatch_command
        target:
          kind: dispatch
          command: execdir_command
          argv:
            - execdir_args

  - id: enumerate_paths
    selector:
      kind: not
      item:
        kind: any
        items:
          - kind: has_flag
            flag: "-exec"
          - kind: has_flag
            flag: "-execdir"
    parameters:
      - name: search_roots
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    stream_contract:
      stdin_mode: ignored
      stdout_mode: path_list
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: search_roots

modifiers:
  - id: follow_symlinks
    matcher: {kind: any_flag, flags: ["-L", "-H", "-follow"]}
  - id: physical_walk
    matcher: {kind: any_flag, flags: ["-P"]}
  - id: expression_control
    matcher:
      kind: any_flag
      flags: ["-a", "-and", "-o", "-or", "-not", "-depth", "-xdev", "-mount", "-prune", "-quit"]
  - id: operand_free_tests
    matcher: {kind: any_flag, flags: ["-empty", "-true", "-false", "-readable", "-writable", "-executable"]}
  - id: name_pattern
    matcher:
      kind: any_flag
      flags:
        - "-name"
        - "-iname"
        - "-path"
        - "-ipath"
        - "-regex"
        - "-iregex"
    parameters:
      - name: patterns
        semantic:
          kind: structured_value
          context: path_expression
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: type_filter
    matcher:
      kind: any_flag
      flags:
        - "-type"
    parameters:
      - name: file_types
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: traversal_control
    matcher:
      kind: any_flag
      flags:
        - "-maxdepth"
        - "-mindepth"
    parameters:
      - name: depth_values
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: output_actions
    matcher:
      kind: any_flag
      flags:
        - "-print"
        - "-print0"
        - "-ls"

  - id: delete_action
    matcher:
      kind: any_flag
      flags:
        - "-delete"
    effects:
      - kind: delete_path
        target:
          kind: slot
          name: search_roots
        catastrophic:
          semantic_class: delete_path

subcommands: null
extensions:
  caushell.profile/known_limitations:
    - Outer option ownership is opt-in and exact; an undeclared outer option or unknown argv boundary requires approval rather than guessing its operand count. Child argv never supplies outer flags or search roots.
    - Dispatch arguments and bounded search-root domains are modeled for common -exec and -execdir forms, but this is not a full find expression evaluator; uncommon predicates remain residual operands.
    - Semicolon and plus terminators are recognized for dispatch, but batched execution cardinality and all platform-specific find behavior are not modeled exactly.
    - Symlink traversal and execution-directory context that cannot be established conservatively widen or leave the argument domain unknown.
