dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: find
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

option_matching: exact_names
opaque_on_unresolved: true
# GNU/BSD find expression controls are exact words. Leading options retain
# their conservative prefix bound until an expression boundary is known.
# Keep unmodeled expression controls/clusters opaque when a glob can generate
# them; this is a grammar fact, not a risk allowlist.
argument_control_vocabulary:
  # -O / -- belong only to the leading-option grammar, already guarded by
  # the prefix proof. They cannot introduce an action inside an expression.
  unmodeled_words: ["-files0-from", "-f", "-printx", "-exit"]
  unmodeled_short_clusters: ["EHLPXdsx"]
  operand_free_short_clusters: ["EHLPXdsx"]
  positional_boundary_words: ["-name", "-iname", "-path", "-ipath", "-regex", "-iregex", "-wholename", "-iwholename", "-lname", "-ilname", "-context", "-type", "-xtype", "-amin", "-atime", "-cmin", "-ctime", "-mmin", "-mtime", "-Bmin", "-Btime", "-size", "-inum", "-links", "-uid", "-gid", "-used", "-perm", "-flags", "-user", "-group", "-fstype", "-newer", "-mnewer", "-anewer", "-cnewer", "-Bnewer", "-samefile", "-newerat", "-newerBt", "-newerct", "-newermt", "-printf", "-fprintf", "-fprint", "-fprint0", "-fls", "-print", "-print0", "-ls", "-delete", "-empty", "-true", "-false", "-readable", "-writable", "-executable", "-nouser", "-nogroup", "-acl", "-sparse", "-local", "-xattr", "-depth", "-xdev", "-mount", "-prune", "-quit", "-maxdepth", "-mindepth", "-regextype", "-daystart", "-noleaf", "-ignore_readdir_race", "-noignore_readdir_race", "-warn", "-nowarn"]
argument_regions:
  - id: exec
    start_flags: ["-exec"]
    terminators:
      - {value: ";"}
      - {value: "+", preceding: "{}"}
  - id: execdir
    start_flags: ["-execdir"]
    terminators:
      - {value: ";"}
      - {value: "+", preceding: "{}"}
  - id: ok
    start_flags: ["-ok"]
    terminators: [{value: ";"}]
  - id: okdir
    start_flags: ["-okdir"]
    terminators: [{value: ";"}]

forms:
  - id: exec_command
    selector:
      kind: all
      items:
        - &has_dispatch
          kind: any
          items:
            - {kind: has_flag, flag: "-exec"}
            - {kind: has_flag, flag: "-execdir"}
            - {kind: has_flag, flag: "-ok"}
            - {kind: has_flag, flag: "-okdir"}
        - kind: not
          item: &formatted_stdout
            kind: any
            items:
              - {kind: has_flag, flag: "-printf"}
              - {kind: has_flag, flag: "-ls"}
    parameters: &dispatch_parameters
      - name: exec_command
        semantic:
          kind: command_ref
          dispatch: wrapper_command
        binding:
          kind: argument_region_command
          region: exec
        cardinality: optional_many
      - name: execdir_command
        semantic:
          kind: command_ref
          dispatch: wrapper_command
        binding:
          kind: argument_region_command
          region: execdir
        cardinality: optional_many
      - name: exec_args
        semantic:
          kind: plain_value
        binding:
          kind: argument_region_args
          region: exec
        cardinality: optional_many
      - name: execdir_args
        semantic:
          kind: plain_value
        binding:
          kind: argument_region_args
          region: execdir
        cardinality: optional_many
      - name: search_roots
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "{}"
          - kind: exclude_literal
            value: ";"
          - kind: exclude_literal
            value: "+"
      - name: ok_command
        semantic: {kind: command_ref, dispatch: wrapper_command}
        binding: {kind: argument_region_command, region: ok}
        cardinality: optional_many
      - name: okdir_command
        semantic: {kind: command_ref, dispatch: wrapper_command}
        binding: {kind: argument_region_command, region: okdir}
        cardinality: optional_many
      - name: ok_args
        semantic: {kind: plain_value}
        binding: {kind: argument_region_args, region: ok}
        cardinality: optional_many
      - name: okdir_args
        semantic: {kind: plain_value}
        binding: {kind: argument_region_args, region: okdir}
        cardinality: optional_many
    stream_contract:
      stdin_mode: ignored
      stdout_mode: path_list
      stderr_mode: opaque
    effects: &dispatch_effects
      - kind: read_path
        target:
          kind: slot
          name: search_roots
      - &default_root_read
        kind: read_path
        target:
          kind: configured_path
          sources: [{slot: search_roots, projection: {kind: identity}}]
          only_when_sources_absent: true
          default_value: "."
          purpose: generic_operand
      - kind: dispatch_command
        target:
          kind: dispatch
          command: exec_command
          argv:
            - exec_args
      - kind: dispatch_command
        target:
          kind: dispatch
          command: execdir_command
          argv:
            - execdir_args
      - kind: dispatch_command
        target: {kind: dispatch, command: ok_command, argv: [ok_args]}
      - kind: dispatch_command
        target: {kind: dispatch, command: okdir_command, argv: [okdir_args]}

  - id: exec_formatted_output
    selector: {kind: all, items: [*has_dispatch, *formatted_stdout]}
    parameters: *dispatch_parameters
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
    effects: *dispatch_effects

  - id: enumerate_paths
    selector:
      kind: all
      items:
        - {kind: not, item: *has_dispatch}
        - {kind: not, item: *formatted_stdout}
    parameters: &enumerate_parameters
      - name: search_roots
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    stream_contract:
      stdin_mode: ignored
      stdout_mode: path_list
      stderr_mode: opaque
    stdout_records:
      projection:
        kind: paths
        roots_slot: search_roots
        default_root: "."
        separator: nul
        escape_modifiers: [follow_symlinks]
      required_modifiers: [nul_output]
      # Named file outputs can alias stdout. Their combined stream has no
      # unconditional pure-path guarantee, even alongside -print0.
      excluded_modifiers: [line_output, information_options, file_output, formatted_file_output, legacy_archive_output]
    effects: &enumerate_effects
      - kind: read_path
        target:
          kind: slot
          name: search_roots
      - *default_root_read

  - id: enumerate_formatted_output
    selector:
      kind: all
      items:
        - {kind: not, item: *has_dispatch}
        - *formatted_stdout
    parameters: *enumerate_parameters
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
    effects: *enumerate_effects

modifiers:
  - id: follow_symlinks
    matcher: {kind: any_flag, flags: ["-L", "-H", "-follow"]}
  - id: physical_walk
    matcher: {kind: any_flag, flags: ["-P"]}
  - id: expression_control
    matcher:
      kind: any_flag
      flags: ["(", ")", "!", ",", "-a", "-and", "-o", "-or", "-not", "-depth", "-d", "-xdev", "-x", "-mount", "-prune", "-quit"]
  - id: operand_free_tests
    matcher: {kind: any_flag, flags: ["-empty", "-true", "-false", "-readable", "-writable", "-executable", "-nouser", "-nogroup", "-acl", "-sparse", "-local", "-xattr"]}
  - id: traversal_options
    matcher:
      kind: any_flag
      flags: ["-daystart", "-noleaf", "-ignore_readdir_race", "-noignore_readdir_race", "-warn", "-nowarn", "-O0", "-O1", "-O2", "-O3", "-E", "-X", "-s"]
  - id: information_options
    matcher: {kind: any_flag, flags: ["-help", "--help", "-version", "--version"]}
  - id: name_pattern
    matcher:
      kind: any_flag
      flags:
        - "-name"
        - "-iname"
        - "-path"
        - "-ipath"
        - "-regex"
        - "-iregex"
        - "-wholename"
        - "-iwholename"
        - "-lname"
        - "-ilname"
        - "-context"
    parameters:
      - name: patterns
        semantic:
          kind: structured_value
          context: path_expression
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: type_filter
    matcher:
      kind: any_flag
      flags:
        - "-type"
    parameters:
      - name: file_types
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: traversal_control
    matcher:
      kind: any_flag
      flags:
        - "-maxdepth"
    parameters:
      - name: depth_values
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: minimum_traversal_depth
    matcher: {kind: any_flag, flags: ["-mindepth"]}
    parameters:
      - name: minimum_depth
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  # These arguments are tests, not search roots or file modifications. In
  # particular, negative ages and permission masks own their leading '-'.
  - id: numeric_filter
    matcher:
      kind: any_flag
      flags: ["-amin", "-atime", "-cmin", "-ctime", "-mmin", "-mtime", "-Bmin", "-Btime", "-size", "-inum", "-links", "-uid", "-gid", "-used"]
    parameters:
      - name: numeric_tests
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: permission_filter
    matcher: {kind: any_flag, flags: ["-perm", "-flags"]}
    parameters:
      - name: permission_tests
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: owner_filter
    matcher: {kind: any_flag, flags: ["-user", "-group"]}
    parameters:
      - name: owners
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: filesystem_filter
    matcher: {kind: any_flag, flags: ["-fstype"]}
    parameters:
      - name: filesystem_types
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: expression_syntax
    matcher: {kind: any_flag, flags: ["-regextype"]}
    parameters:
      - name: regex_syntax
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: debug_options
    matcher: {kind: any_flag, flags: ["-D"]}
    parameters:
      - name: debug_categories
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  # In -newerXY, Y=t is a date literal; all other Y values name a
  # reference file. Do not invent a file read for a timestamp string.
  - id: timestamp_filter
    matcher: {kind: any_flag, flags: ["-newerat", "-newerBt", "-newerct", "-newermt"]}
    parameters:
      - name: reference_times
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: reference_file_filter
    matcher:
      kind: any_flag
      flags: ["-newer", "-mnewer", "-anewer", "-cnewer", "-Bnewer", "-samefile", "-neweraa", "-neweraB", "-newerac", "-neweram", "-newerBa", "-newerBB", "-newerBc", "-newerBm", "-newerca", "-newercB", "-newercc", "-newercm", "-newerma", "-newermB", "-newermc", "-newermm"]
    parameters:
      - name: reference_files
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
    effects:
      - kind: read_path
        target: {kind: slot, name: reference_files}

  - id: alternate_type_filter
    matcher: {kind: any_flag, flags: ["-xtype"]}
    parameters:
      - name: alternate_file_types
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  - id: formatted_output
    matcher: {kind: any_flag, flags: ["-printf"]}
    parameters:
      - name: output_formats
        semantic: {kind: structured_value, context: format_string}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many

  # These actions open/create/truncate a named output file even when no
  # paths match. A filter or -false must not erase their write effects.
  - id: file_output
    matcher: {kind: any_flag, flags: ["-fprint", "-fprint0", "-fls"]}
    parameters:
      - name: output_paths
        semantic: {kind: path, role: write, purpose: generic_operand}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: output_paths}
        catastrophic: {semantic_class: raw_write_target}

  - id: nul_output
    matcher: {kind: any_flag, flags: ["-print0"]}
  # Both operands belong to this action. The second is format data, never
  # an outer predicate, traversal root or dispatch opener.
  - id: formatted_file_output
    matcher: {kind: any_flag, flags: ["-fprintf"]}
    parameters:
      - name: formatted_output_paths
        semantic: {kind: path, role: write, purpose: generic_operand}
        binding: {kind: following_matched_flag, operand_mode: first_of_two_args}
        cardinality: required_many
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: formatted_output_paths}
        catastrophic: {semantic_class: raw_write_target}

  - id: legacy_archive_output
    matcher: {kind: any_flag, flags: ["-cpio", "-ncpio"]}
    parameters:
      - name: archive_output_paths
        semantic: {kind: path, role: write, purpose: generic_operand}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: archive_output_paths}
        catastrophic: {semantic_class: raw_write_target}
  - id: line_output
    matcher: {kind: any_flag, flags: ["-print"]}
  - id: list_output
    matcher: {kind: any_flag, flags: ["-ls"]}

  - id: delete_action
    matcher:
      kind: any_flag
      flags:
        - "-delete"
    effects:
      - kind: delete_path
        path_scope: {kind: subtree, escape_modifiers: [follow_symlinks]}
        target:
          kind: slot
          name: search_roots
        catastrophic:
          semantic_class: delete_path
      # Preserve all explicit roots through the slot effect above. The
      # configured target supplements it with find's implicit cwd when the
      # slot is empty; an unresolved explicit root must not become '.'.
      - kind: delete_path
        path_scope: {kind: subtree, escape_modifiers: [follow_symlinks]}
        target:
          kind: configured_path
          sources: [{slot: search_roots, projection: {kind: identity}}]
          only_when_sources_absent: true
          default_value: "."
          purpose: generic_operand
        catastrophic: {semantic_class: delete_path}

subcommands: null
extensions:
  caushell.profile/semantic_sources:
    - https://www.gnu.org/software/findutils/manual/html_node/find_html/find-Expressions.html
    - https://www.gnu.org/software/findutils/manual/html_node/find_html/Comparing-Timestamps.html
    - https://www.gnu.org/software/findutils/manual/html_node/find_html/Print-File-Name.html
    - https://www.gnu.org/software/findutils/manual/html_node/find_html/Print-File-Information.html
    - https://man.freebsd.org/cgi/man.cgi?query=find&sektion=1
    - https://docs.oracle.com/cd/E86824_01/html/E54763/find-1.html
  caushell.profile/known_limitations:
    - Outer option ownership is opt-in and exact; an undeclared outer option or unknown argv boundary requires approval rather than guessing its operand count. Child argv never supplies outer flags or search roots.
    - Common GNU/BSD filters and their operands are modeled, but expressions are not evaluated against the filesystem; possible actions are conservatively retained across boolean branches.
    - -files0-from (runtime-provided traversal roots) and BSD -f (mixed positional and flag-provided root sets, including attached forms) remain unresolved and require approval. They must not be declared as operand-free or mapped to incorrect traversal domains.
    - Confirmation-based -ok/-okdir children retain their possible execution effects. Tool confirmation does not certify the operation as authorized or safe.
    - Semicolon and plus terminators are recognized for dispatch, but batched execution cardinality and all platform-specific find behavior are not modeled exactly.
    - Symlink traversal and execution-directory context that cannot be established conservatively widen or leave the argument domain unknown.
    - Named file output actions disable the unconditional stdout path-record guarantee: file targets can alias descriptors and mix other data with -print0. This does not make the file output itself an external write when the shared I/O query proves a local file or a sink.
