dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: ip
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
option_scope: leading_options
option_matching: exact_names
forms:
- id: query_network_state
  selector:
    kind: all
    items:
    - {kind: not, item: {kind: has_modifier, modifier: information}}
    - {kind: not, item: {kind: has_modifier, modifier: batch_file}}
    - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(address|addr|a|route|r|link|l|neighbour|neighbor|neigh|tcp_metrics|tcpmetrics)$'}}
    - kind: any
      items:
      - {kind: not, item: {kind: has_positional_at, index: 1}}
      - {kind: has_positional_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^(show|list|lst)$'}}
  parameters: &query_parameters
  - {name: query_object, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
  - {name: query_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
  stream_contract: &query_stream {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent}
- id: query_route_lookup
  selector:
    kind: all
    items:
    - {kind: not, item: {kind: has_modifier, modifier: information}}
    - {kind: not, item: {kind: has_modifier, modifier: batch_file}}
    - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(route|r)$'}}
    - {kind: has_positional_at_matching, index: 1, matcher: {kind: literal, value: get}}
  parameters: *query_parameters
  stream_contract: *query_stream
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: batch_file
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: batch_file
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: batch_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: following_flag
      flag: "-batch"
      operand_mode: next_arg
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: batch_path
        semantic:
          kind: path
          role: read
          purpose: tool_config
  effects:
  - kind: read_path
    target:
      kind: slot
      name: batch_path
  - kind: execute_payload
    target:
      kind: slot
      name: batch_payload
modifiers:
- id: query_rendering
  matcher: {kind: any_flag, flags: ['-4', '-6', '-0', '-j', '-json', '-o', '-oneline', '-br', '-brief', '-s', '-stats', '-statistics', '-d', '-details', '-r', '-resolve', '-iec', '-human', '-h']}
- id: namespace_context
  matcher: {kind: any_flag, flags: ['-n', '-netns']}
  parameters: [{name: namespace_context, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-help"
    - "-V"
- id: batch_file
  matcher:
    kind: any_flag
    flags:
    - "-batch"
- id: force
  matcher:
    kind: any_flag
    flags:
    - "-force"
subcommands:
  roots:
  - name: netns
    children:
    - name: add
      forms:
      - id: create_namespace
        selector:
          kind: has_positional_at
          index: 0
        parameters:
        - name: namespace_name
          semantic:
            kind: plain_value
          binding:
            kind: next_positional
          cardinality: required_one
        effects:
        - kind: write_path
          target:
            kind: configured_path
            sources: []
            missing: unknown
    - name: delete
      forms:
      - id: delete_namespace
        selector:
          kind: has_positional_at
          index: 0
        parameters:
        - name: namespace_name
          semantic:
            kind: plain_value
          binding:
            kind: next_positional
          cardinality: required_one
        effects:
        - kind: write_path
          target:
            kind: configured_path
            sources: []
            missing: unknown
    - name: exec
      option_scope: leading_options
      forms:
      - id: namespace_exec_child_argv
        selector:
          kind: has_positional_at
          index: 1
        parameters:
        - name: namespace_name
          semantic:
            kind: plain_value
          binding:
            kind: positional_at
            index: 0
          cardinality: required_one
        - name: child_command
          semantic:
            kind: command_ref
            dispatch: wrapper_command
          binding:
            kind: next_positional
          cardinality: required_one
        - name: child_argv
          semantic:
            kind: plain_value
          binding:
            kind: remaining_args
          cardinality: optional_many
        effects:
        - kind: dispatch_command
          target:
            kind: dispatch
            command: child_command
            argv:
            - child_argv
            stdin_from_parent: true
            stdout_to_parent: true
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/ip (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://github.com/iproute2/iproute2/blob/main/ip/ipaddress.c
  - https://github.com/iproute2/iproute2/blob/main/ip/iproute.c
  - https://github.com/iproute2/iproute2/blob/main/ip/iplink.c
  - https://manpages.debian.org/trixie/iproute2/ip-neighbour.8.en.html
  - https://manpages.debian.org/trixie/iproute2/ip-tcp_metrics.8.en.html
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - The read file content is corrupted by error prints.
  - Network namespace operations mutate kernel namespace state, represented as an
    unknown write because no dedicated runtime namespace effect exists.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Read-only show/list and default-show forms are limited to declared network objects. Mutations, unknown operations and ambiguous command abbreviations (for example link s means set) remain unresolved; no global read-only assumption is made for ip.
