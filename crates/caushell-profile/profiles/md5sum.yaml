dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity:
  canonical_name: md5sum
  aliases:
    - md5sum.textutils

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: information_args, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: check_status
    selector: {kind: all, items: [{kind: has_modifier, modifier: check_file}, {kind: has_modifier, modifier: status}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters: &check_inputs
      - {name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - {name: checksum_files, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects: &check_effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: checksum_files}}
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: hash_inputs
    selector: {kind: all, items: [&hash {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: check_file}}, {kind: not, item: {kind: has_modifier, modifier: status}}, &running {kind: not, item: {kind: has_modifier, modifier: information}}]}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - {name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque
      stdout_dependency: inputs
    effects: &effects
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths
      - kind: transform_data
        target:
          kind: none

  - id: hash_inputs_stdin
    selector: {kind: all, items: [*hash, *stdin]}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

  - id: check_hash_file
    selector: {kind: all, items: [{kind: has_modifier, modifier: check_file}, {kind: not, item: {kind: has_modifier, modifier: status}}, *running]}
    parameters: *check_inputs
    effects: *check_effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: status, matcher: {kind: any_flag, flags: [--status]}}
  - {id: hash_format, matcher: {kind: any_flag, flags: [-b, --binary, -t, --text, --tag, -z, --zero]}}
  - {id: check_format, matcher: {kind: any_flag, flags: [--ignore-missing, --quiet, --strict, -w, --warn]}}
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: check_file
    matcher:
      kind: any_flag
      flags:
        - "-c"
        - "--check"

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
