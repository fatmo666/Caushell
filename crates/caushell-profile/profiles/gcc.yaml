dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: gcc
  aliases:
    - cc
    - c89
    - c99
    - g++

trust:
  tier: tier_a
  source: built_in

# GCC uses whole single-prefix option words, not POSIX short-option clusters.
option_matching: exact_names
option_scope: permuted_options
opaque_on_unresolved: true

argument_files:
  - {prefix: '@', possible_effects: [read_path, write_path]}

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: show_verbose_information
    selector: &verbose_information
      kind: all
      items:
        - {kind: has_modifier, modifier: verbose}
        - {kind: no_positional_args}
        - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: '-v'}}
        - {kind: not, item: {kind: has_argument_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^'}}}
    parameters: []
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: independent, stderr_dependency: independent}
  - id: show_version
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: version}
        - {kind: no_positional_args}
        - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: '--version'}}
        - {kind: not, item: {kind: has_argument_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '^'}}}
    parameters: []
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: independent, stderr_dependency: independent}
    # Retain modifier effects and residuals: a query must not hide a plugin,
    # response file, unknown option or sibling shell operation.
  - id: print_search_directories
    selector: {kind: has_modifier, modifier: print_search_dirs}
    parameters: []
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data}
    extensions: {caushell.form/suppress_modifier_effects: true}
  - id: shell_wrapper_stdin
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: wrapper_program}
        - kind: has_modifier_parameter_matching
          modifier: wrapper_program
          parameter: wrapper_command
          matcher: {kind: literal, value: '/bin/sh,-s'}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
    effects:
      - {kind: read_path, target: {kind: slot, name: input_paths}}
      - {kind: dispatch_command, target: {kind: dispatch, command_literal: /bin/sh, argv_suffix: ['-s'], stdin_from_parent: true, stdout_to_parent: true}}

  - id: preprocess_stdin_to_stdout
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: preprocess_only}
        - {kind: not, item: {kind: has_modifier, modifier: output_path}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
        - kind: any
          items:
            - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stdout_dependency: inputs, stderr_mode: opaque}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]

  - id: preprocess_to_stdout
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: preprocess_only}
        - {kind: not, item: {kind: has_modifier, modifier: output_path}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: required_many
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stdout_dependency: inputs, stderr_mode: opaque}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]

  - id: preprocess_stdin_to_file
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: preprocess_only}
        - {kind: has_modifier, modifier: output_path}
        - kind: has_modifier_parameter_matching
          modifier: output_path
          parameter: output_path
          matcher: {kind: regex_pattern, pattern: '^.+$'}
        - kind: not
          item: {kind: has_modifier_parameter_matching, modifier: output_path, parameter: output_path, matcher: {kind: literal, value: '-'}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
        - kind: any
          items:
            - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stdout_dependency: independent, stderr_mode: opaque}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]

  - id: preprocess_to_file
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: preprocess_only}
        - {kind: has_modifier, modifier: output_path}
        - kind: has_modifier_parameter_matching
          modifier: output_path
          parameter: output_path
          matcher: {kind: regex_pattern, pattern: '^.+$'}
        - kind: not
          item: {kind: has_modifier_parameter_matching, modifier: output_path, parameter: output_path, matcher: {kind: literal, value: '-'}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stdout_dependency: independent, stderr_mode: opaque}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]

  - id: response_file_arguments
    selector: {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@.+'}}
    parameters:
      - name: response_argument
        semantic: {kind: plain_value}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection:
          branches:
            - matcher: {kind: prefix, value: '@'}
              target: {name: response_file_path, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: response_file_path}}
    # Response files may contain additional options and alter inputs/outputs; do not infer stream or mutation effects from their contents.

  - id: compile_to_explicit_output
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: version}}
        - {kind: has_modifier, modifier: output_path}
        - {kind: not, item: {kind: has_modifier, modifier: preprocess_only}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
    parameters:
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    effects:
      - kind: read_path
        target:
          kind: slot
          name: input_paths

  - id: compile_to_default_output
    selector:
      kind: all
      items:
        - {kind: not, item: *verbose_information}
        - {kind: not, item: {kind: has_modifier, modifier: version}}
        - {kind: not, item: {kind: has_modifier, modifier: print_search_dirs}}
        - {kind: not, item: {kind: has_modifier, modifier: output_path}}
        - {kind: not, item: {kind: has_modifier, modifier: preprocess_only}}
        - {kind: not, item: {kind: has_modifier, modifier: wrapper_program}}
        - kind: not
          item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^@'}}
    parameters:
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    effects:
      - kind: read_path
        target:
          kind: slot
          name: input_paths
      - kind: write_path
        namespace_effect: regular_file_write
        target:
          kind: tool_convention_path
          path: a.out
          convention: gcc.default_output
          purpose: generic_operand

modifiers:
  - {id: version, matcher: {kind: any_flag, flags: ["--version"]}}
  - {id: verbose, matcher: {kind: any_flag, flags: [-v]}}
  - id: define_macro
    matcher: {kind: any_flag, flags: [-D]}
    parameters:
      - name: macro_definitions
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: word_attached_or_next_arg}
        cardinality: required_many
        value_constraints: [{kind: require_match, pattern: '[A-Za-z_][A-Za-z0-9_]*(?:\([^()\r\n]*\))?(?:=[^\r\n]*)?'}]
  - id: undefine_macro
    matcher: {kind: any_flag, flags: [-U]}
    parameters:
      - name: macro_undefinitions
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: word_attached_or_next_arg}
        cardinality: required_many
        value_constraints: [{kind: require_match, pattern: '[A-Za-z_][A-Za-z0-9_]*'}]
  # -Wl, is a complete option prefix whose own suffix is comma-separated
  # linker argv. Only closed mode words are covered; paths, response files,
  # plugins and other forwarded options retain an operation gap.
  - id: linker_modes
    matcher: {kind: any_flag, flags: ['-Wl,']}
    parameters:
      - name: linker_modes
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: word_attached}
        cardinality: required_many
        value_constraints:
          - kind: require_match
            pattern: '(?:-Bstatic|-Bdynamic|--as-needed|--no-as-needed|--whole-archive|--no-whole-archive|--start-group|--end-group|--push-state|--pop-state)(?:,(?:-Bstatic|-Bdynamic|--as-needed|--no-as-needed|--whole-archive|--no-whole-archive|--start-group|--end-group|--push-state|--pop-state))*'
  - id: link_library
    matcher: {kind: any_flag, flags: [-l]}
    parameters:
      - name: library_names
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: word_attached_or_next_arg}
        cardinality: required_many
        value_constraints: [{kind: require_match, pattern: ':?[A-Za-z0-9_+.-]+'}]
    # A library selector is not a host path. Native search may select an ld
    # script or LTO input; without resolved search/content evidence its control
    # input stays unknown, independently of lexical argv ownership.
    effects:
      - kind: load_config
        target: {kind: configured_path, sources: [], missing: unknown, purpose: tool_config}
      # A selected ld script can redirect outputs. Retain that possible write
      # until native library search and the selected content are established.
      - kind: write_path
        target: {kind: configured_path, sources: [], missing: unknown, purpose: generic_operand}
  # GCC 13.3 documented optimization modes are complete single-prefix words.
  # No operand or short-option cluster is owned by these flags; in particular,
  # bare -O leaves the next filename alone. Resource effects are unchanged.
  - id: optimization_level
    matcher: {kind: any_flag, flags: [-O, -O0, -O1, -O2, -O3, -Os, -Og, -Oz, -Ofast]}
  # GCC 13.3 C/C++ dialect names and documented aliases. Each occurrence is
  # validated; a later valid dialect cannot conceal an earlier unknown value.
  - {id: ansi_standard, matcher: {kind: any_flag, flags: [-ansi]}}
  - id: language_standard
    matcher: {kind: any_flag, flags: [-std]}
    parameters:
      - name: language_standard
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: inline_only}
        cardinality: required_many
        value_constraints:
          - kind: require_match
            pattern: '(?:c(?:89|90|99|9x|11|1x|17|18|2x)|gnu(?:89|90|99|9x|11|1x|17|18|2x)|iso9899:(?:1990|199409|1999|199x|2011|2017|2018)|(?:c|gnu)\+\+(?:98|03|11|0x|14|1y|17|1z|20|2a|23|2b))'
  # Exact diagnostic controls, not a -W* wildcard (which would also own -Wl,).
  - id: diagnostic_controls
    matcher: {kind: any_flag, flags: ["-Wall", "-Wextra", "-pedantic", "-Wpedantic", "-pedantic-errors", "-Werror", "-Wfatal-errors", "-w"]}
  # GCC Code-Gen-Options: tentative-definition placement in the normal object
  # output. Exact spellings do not cover plugins or additional output controls.
  - id: common_symbol_placement
    matcher: {kind: any_flag, flags: [-fcommon, -fno-common]}
  # Debug information stays in the normal output. Options producing additional
  # files (notably -gsplit-dwarf) are deliberately not covered by a -g* prefix.
  - id: debug_information
    matcher:
      kind: any_flag
      flags: [-g, -g0, -g1, -g2, -g3, -ggdb, -ggdb0, -ggdb1, -ggdb2, -ggdb3, -gdwarf, -gdwarf-2, -gdwarf-3, -gdwarf-4, -gdwarf-5, -gdwarf32, -gdwarf64]
  # Generated-code instrumentation controls. These are not safety certificates
  # or grants to execute the output. Validate every operand, not just the last.
  - id: sanitizers
    matcher: {kind: any_flag, flags: [-fsanitize]}
    parameters:
      - name: sanitizer_modes
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: inline_only}
        cardinality: required_many
        value_constraints:
          - kind: require_match
            pattern: '(?:address|hwaddress|kernel-address|kernel-hwaddress|pointer-compare|pointer-subtract|shadow-call-stack|thread|leak|undefined|shift|shift-exponent|shift-base|integer-divide-by-zero|unreachable|vla-bound|null|return|signed-integer-overflow|bounds|bounds-strict|alignment|object-size|float-divide-by-zero|float-cast-overflow|nonnull-attribute|returns-nonnull-attribute|bool|enum|vptr|pointer-overflow|builtin)(?:,(?:address|hwaddress|kernel-address|kernel-hwaddress|pointer-compare|pointer-subtract|shadow-call-stack|thread|leak|undefined|shift|shift-exponent|shift-base|integer-divide-by-zero|unreachable|vla-bound|null|return|signed-integer-overflow|bounds|bounds-strict|alignment|object-size|float-divide-by-zero|float-cast-overflow|nonnull-attribute|returns-nonnull-attribute|bool|enum|vptr|pointer-overflow|builtin))*'
  - id: disabled_sanitizers
    matcher: {kind: any_flag, flags: [-fno-sanitize]}
    parameters:
      - name: disabled_sanitizer_modes
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: inline_only}
        cardinality: required_many
        value_constraints:
          - kind: require_match
            pattern: '(?:all|address|hwaddress|kernel-address|kernel-hwaddress|pointer-compare|pointer-subtract|shadow-call-stack|thread|leak|undefined|shift|shift-exponent|shift-base|integer-divide-by-zero|unreachable|vla-bound|null|return|signed-integer-overflow|bounds|bounds-strict|alignment|object-size|float-divide-by-zero|float-cast-overflow|nonnull-attribute|returns-nonnull-attribute|bool|enum|vptr|pointer-overflow|builtin)(?:,(?:all|address|hwaddress|kernel-address|kernel-hwaddress|pointer-compare|pointer-subtract|shadow-call-stack|thread|leak|undefined|shift|shift-exponent|shift-base|integer-divide-by-zero|unreachable|vla-bound|null|return|signed-integer-overflow|bounds|bounds-strict|alignment|object-size|float-divide-by-zero|float-cast-overflow|nonnull-attribute|returns-nonnull-attribute|bool|enum|vptr|pointer-overflow|builtin))*'
  - {id: print_search_dirs, matcher: {kind: any_flag, flags: ["-print-search-dirs"]}}
  - id: preprocess_only
    matcher:
      kind: any_flag
      flags: ["-E"]

  - id: language
    matcher:
      kind: any_flag
      flags: ["-x"]
    parameters:
      - name: language_name
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: word_attached_or_next_arg}
        cardinality: required_many
        value_constraints: [{kind: require_match, pattern: '(?:c|c\+\+|cpp-output|c\+\+-cpp-output|objective-c|objective-c\+\+|objective-c-cpp-output|objective-c\+\+-cpp-output|assembler|assembler-with-cpp|none)'}]

  - id: output_path
    matcher:
      kind: any_flag
      flags:
        - "-o"
    parameters:
      - name: output_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: word_attached_or_next_arg
        cardinality: required_one
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects:
      - kind: write_path
        namespace_effect: regular_file_write
        target:
          kind: slot
          name: output_path

  - id: include_directory
    matcher:
      kind: any_flag
      flags:
        - "-I"
        - "-L"
    parameters:
      - name: search_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: word_attached_or_next_arg
        cardinality: required_many
        value_constraints:
          - {kind: require_match, pattern: '[^=$][^\x00\r\n]*'}
          - {kind: exclude_literal, value: '-'}
    effects:
      - kind: read_path
        target:
          kind: slot
          name: search_paths

  - id: include_file
    matcher:
      kind: any_flag
      flags:
        - "-include"
        - "-imacros"
    parameters:
      - name: include_files
        semantic:
          kind: path
          role: read
          purpose: in_process_code
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many
    effects:
      - kind: read_path
        target:
          kind: slot
          name: include_files

  - id: specs_file
    matcher:
      kind: any_flag
      flags:
        - "-specs"
    parameters:
      - name: specs_file
        semantic:
          kind: path
          role: config
          purpose: tool_config
        binding:
          kind: following_matched_flag
          operand_mode: inline_or_short_attached
        cardinality: optional_one
    effects:
      - kind: load_config
        target:
          kind: slot
          name: specs_file

  - id: plugin
    matcher:
      kind: any_flag
      flags:
        - "-fplugin"
    parameters:
      - name: plugin_path
        semantic:
          kind: in_process_code_load
          load_kind: library_path
        binding:
          kind: following_matched_flag
          operand_mode: inline_or_short_attached
        cardinality: optional_many
    effects:
      - kind: load_in_process_code
        target:
          kind: slot
          name: plugin_path

  - id: wrapper_program
    matcher:
      kind: any_flag
      flags:
        - "-wrapper"
    parameters:
      - name: wrapper_command
        semantic:
          kind: command_ref
          dispatch: command_name
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_one

  - id: compile_mode
    matcher:
      kind: any_flag
      flags:
        - "-c"
        - "-S"
        - "-E"
        - "-shared"
        - "-static"

subcommands: null
extensions:
  caushell.profile/source_research:
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Preprocessor-Options.html
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Overall-Options.html
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Directory-Options.html
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Link-Options.html
    - https://sourceware.org/binutils/docs-2.40/ld/Options.html
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Optimize-Options.html
    - https://github.com/gcc-mirror/gcc/blob/releases/gcc-13.3.0/gcc/opts.cc
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Instrumentation-Options.html
    - https://gcc.gnu.org/onlinedocs/gcc-13.3.0/gcc/Debugging-Options.html
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
  caushell.profile/known_limitations:
    - Attached native operands use declared whole-word grammars, never short clusters. Unknown languages, linker options and incomplete operands remain unresolved. Library selectors retain unknown native control-input paths until actual search/content evidence is available; option recognition does not authorize library loading or output execution.
    - The nine documented -O optimization modes are modeled as complete option words. Other numeric spellings or levels, unknown/partial words, individual -f optimizations, profile/LTO and extra-output controls remain unresolved. Optimization does not establish build success, generated-code safety or additional resource authority.
    - Sanitizer operands admit nonempty lists of documented GCC 13.3 mode names, in any order and with repetitions. Enabling all, unknown modes, missing/partial values and unmodeled sanitizer suboptions remain unresolved. This models command effects, not whether GCC accepts a target-specific combination or whether the build succeeds.
    - Ordinary -g levels, GDB and DWARF formats are modeled without granting write or execution authority. Split debug files and other undeclared debug controls remain unresolved.
    - Compiler response files carry arbitrary options; their contents are not expanded. The argument-file declaration retains the concrete response-file read and possible output-file writes; nested wrapper and plugin options are not reconstructed.
    - GTFOBins' /bin/sh,-s wrapper syntax is projected as the known shell and -s argument. Other -wrapper comma lists cannot currently be split into a concrete command and argv using the existing declarative projections and remain unresolved.
    - Attached output operands such as -oapp depend on projection support for short-option attached values in this profile.
