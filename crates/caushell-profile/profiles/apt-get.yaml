dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true
option_scope: leading_options

identity:
  canonical_name: apt-get
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - linux
  shell_families: []
  requires_features: []

configuration_files: {syntax: apt, modifier: configuration_file, operand: configuration_paths}
environment_inputs:
  - name: apt_configuration_environment
    environment: {name: APT_CONFIG, empty_is_unset: true}
    semantic: {kind: plain_value}
    unless_modifiers: [information]
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: information_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
modifiers:
  - id: information
    matcher: {kind: any_flag, flags: ['--version', '-v', '--help', '-h']}
  - &configuration_file
    id: configuration_file
    matcher: {kind: any_flag, flags: ['-c', '--config-file']}
    parameters: [{name: configuration_paths, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - &download_only
    id: download_only
    matcher: {kind: any_flag, flags: ['-d', '--download-only']}
    parameters: [{name: download_controls, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_only}, cardinality: optional_many}]
  - id: global_option
    matcher: {kind: any_flag, flags: ["-o", "--option"]}
    parameters:
      - name: global_option_values
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
        structured_projection:
          branches:
            - matcher: {kind: keyword_value, keyword: 'APT::Update::Pre-Invoke::'}
              target: {name: global_apt_update_pre_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
            - matcher: {kind: keyword_value, keyword: 'APT::Update::Post-Invoke::'}
              target: {name: global_apt_update_post_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
            - matcher: {kind: keyword_value, keyword: 'DPkg::Pre-Invoke::'}
              target: {name: global_dpkg_pre_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
            - matcher: {kind: keyword_value, keyword: 'DPkg::Post-Invoke::'}
              target: {name: global_dpkg_post_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
    # These effects belong to the option, not just one selected command form.
    # A subsequent harmless -o must not erase a hook declared in root scope.
    effects:
      - {kind: execute_payload, target: {kind: slot, name: global_apt_update_pre_hooks}}
      - {kind: execute_payload, target: {kind: slot, name: global_apt_update_post_hooks}}
      - {kind: execute_payload, target: {kind: slot, name: global_dpkg_pre_hooks}}
      - {kind: execute_payload, target: {kind: slot, name: global_dpkg_post_hooks}}
  - &assume_yes
    id: assume_yes
    matcher:
      kind: any_flag
      flags:
        - "-y"
        - "--yes"

subcommands:
  roots:
    - name: install
      aliases: []
      forms:
        - id: install_packages
          selector:
            kind: has_positional_at
            index: 0
          parameters:
            - name: package_specs
              semantic:
                kind: package_locator
                manager: apt
                locator_kinds:
                  - registry_ref
                  - unknown_dynamic
              binding:
                kind: remaining_positionals
              cardinality: required_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
            - &managed_write {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown, purpose: generic_operand}}
      modifiers:
        - *assume_yes
        - *configuration_file
        - *download_only
        - &local_configuration_option
          id: option
          matcher: {kind: any_flag, flags: ["-o", "--option"]}
          parameters:
            - name: option_values
              semantic: {kind: plain_value}
              binding: {kind: following_matched_flag, operand_mode: next_arg}
              cardinality: required_many
              structured_projection:
                branches:
                  - matcher: {kind: keyword_value, keyword: 'APT::Update::Pre-Invoke::'}
                    target: {name: apt_update_pre_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
                  - matcher: {kind: keyword_value, keyword: 'APT::Update::Post-Invoke::'}
                    target: {name: apt_update_post_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
                  - matcher: {kind: keyword_value, keyword: 'DPkg::Pre-Invoke::'}
                    target: {name: dpkg_pre_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
                  - matcher: {kind: keyword_value, keyword: 'DPkg::Post-Invoke::'}
                    target: {name: dpkg_post_hooks, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
          effects:
            - {kind: execute_payload, target: {kind: slot, name: apt_update_pre_hooks}}
            - {kind: execute_payload, target: {kind: slot, name: apt_update_post_hooks}}
            - {kind: execute_payload, target: {kind: slot, name: dpkg_pre_hooks}}
            - {kind: execute_payload, target: {kind: slot, name: dpkg_post_hooks}}
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: download
      aliases: []
      forms:
        - id: download_packages
          selector: {kind: has_positional_at, index: 0}
          parameters:
            - {name: package_specs, semantic: {kind: package_locator, manager: apt, locator_kinds: [registry_ref, unknown_dynamic]}, binding: {kind: remaining_positionals}, cardinality: required_many}
          effects:
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - *managed_write
      modifiers: [*assume_yes, *configuration_file, *download_only, *local_configuration_option]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: source
      aliases: []
      forms:
        - id: source_packages
          selector:
            kind: has_positional_at
            index: 0
          parameters:
            - name: package_specs
              semantic:
                kind: package_locator
                manager: apt
                locator_kinds:
                  - registry_ref
              binding:
                kind: remaining_positionals
              cardinality: required_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - *managed_write
      modifiers: [*assume_yes, *configuration_file, *download_only, *local_configuration_option]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: update
      aliases: []
      forms:
        - id: update_with_shell_hook
          selector:
            kind: has_modifier_parameter_matching
            modifier: option
            parameter: option_values
            matcher: {kind: regex_pattern, pattern: "^(APT::Update::Pre-Invoke::|APT::Update::Post-Invoke::|DPkg::Pre-Invoke::|DPkg::Post-Invoke::)="}
          effects:
            - &update_lists_write {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown, purpose: generic_operand}}
            - &list_cleanup {kind: delete_path, target: {kind: configured_path, sources: [], missing: unknown, purpose: generic_operand}}
        - id: update_metadata
          selector:
            kind: all
            items:
              - {kind: all, items: []}
              - kind: not
                item:
                  kind: has_modifier_parameter_matching
                  modifier: option
                  parameter: option_values
                  matcher: {kind: regex_pattern, pattern: "^(APT::Update::Pre-Invoke::|APT::Update::Post-Invoke::|DPkg::Pre-Invoke::|DPkg::Post-Invoke::)="}
          effects:
            - *update_lists_write
            - *list_cleanup
            - {kind: load_config, target: {kind: none}}
      modifiers:
        - *assume_yes
        - *configuration_file
        - *download_only
        - *local_configuration_option
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: changelog
      aliases: []
      forms:
        - id: changelog_pager
          selector: {kind: has_positional_at, index: 0}
          parameters:
            - {name: packages, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}
          effects:
            - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: pager, requires_tty: true, capabilities: [spawn_shell, run_command, launch_external_editor]}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data}
      modifiers: [*assume_yes, *configuration_file, *download_only, *local_configuration_option]
      children: []
      default_behavior: reject_unknown
      extensions: {}

extensions:
  caushell.profile/source_research:
    - https://manpages.debian.org/trixie/apt/apt-get.8.en.html
    - https://manpages.debian.org/trixie/apt/apt.conf.5.en.html
  caushell.profile/known_limitations:
    - Native APT configuration is bounded data; hooks, unknown directives, custom binaries and security controls remain incomplete.
    - Download-only suppresses package installation logic only after complete effective configuration proof. It never suppresses hooks or grants filesystem authority.
    - Download writes the current directory; update and download-only install use configured manager paths. Output families require independent namespace evidence.
    - Real installation and source extraction retain unknown filesystem effects. Unmodeled commands remain incomplete.
