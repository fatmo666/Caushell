dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true
identity: {canonical_name: runscript, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
forms:
  - id: run_script_file
    selector: {kind: has_positional_at, index: 0}
    parameters:
      - name: script_file
        semantic: {kind: plain_value}
        binding: {kind: positional_at, index: 0}
        cardinality: required_one
        structured_projection:
          branches: []
          fallback: {name: script_payload, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
    effects:
      - {kind: read_path, target: {kind: configured_path, sources: [{slot: script_file, projection: {kind: identity}}], missing: unknown, purpose: script_source}}
      - {kind: execute_payload, target: {kind: slot, name: script_payload}}
extensions:
  caushell.profile/source_research: [https://linux.die.net/man/1/runscript, https://github.com/Distrotech/minicom]
  caushell.profile/known_limitations: [runscript interprets minicom script language; the file is an opaque program and is not parsed as Bash.]
