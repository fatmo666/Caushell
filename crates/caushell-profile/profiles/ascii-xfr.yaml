dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: ascii-xfr, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: send_file
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: send}
        - {kind: not, item: {kind: has_modifier, modifier: receive}}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at, index: 1}}
        - {kind: not, item: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters: [{name: input_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_path}}, {kind: transform_data, target: {kind: none}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
modifiers:
  - {id: send, matcher: {kind: any_flag, flags: ['-s']}}
  - {id: receive, matcher: {kind: any_flag, flags: ['-r']}}
  - {id: no_translation, matcher: {kind: any_flag, flags: ['-n']}}
  - {id: eof_z, matcher: {kind: any_flag, flags: ['-e']}}
  - {id: eof_d, matcher: {kind: any_flag, flags: ['-d']}}
  - {id: verbose, matcher: {kind: any_flag, flags: ['-v']}}
subcommands: null
extensions:
  caushell.profile/source_research:
    - https://manpages.debian.org/testing/minicom/ascii-xfr.1.en.html
    - GTFOBins fixed snapshot ascii-xfr/file-read/0
  caushell.profile/known_limitations:
    - Only upload/send is a file-read form. Receive mode reads actual stdin and truncates/writes its filename, so it intentionally has no file-read profile form.
    - The source form uses -n and -s; line termination conversion and protocol framing are represented as a data transform.
    - Missing/extra file operands, receive mode, and unsupported flags stay unresolved.
