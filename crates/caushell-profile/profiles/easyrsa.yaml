dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: easyrsa
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information_subcommand
  selector:
    kind: any
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: help
    - kind: has_modifier
      modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: executable_configuration_config_vars
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: config_vars
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: configuration_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: following_flag
      flag: "--vars"
      operand_mode: next_arg
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: configuration_path
        semantic:
          kind: path
          role: read
          purpose: tool_config
  effects:
  - kind: read_path
    target:
      kind: slot
      name: configuration_path
  - kind: load_config
    target:
      kind: slot
      name: configuration_path
  - kind: execute_payload
    target:
      kind: slot
      name: configuration_payload
- id: executable_configuration_config_vars_attached
  selector:
    kind: all
    items:
    - kind: has_argument_at_matching
      index: 0
      matcher:
        kind: regex_pattern
        pattern: "^--vars="
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: configuration_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: args_with_prefix
      prefix: "--vars="
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: configuration_path
        semantic:
          kind: path
          role: read
          purpose: tool_config
  effects:
  - kind: read_path
    target:
      kind: slot
      name: configuration_path
  - kind: load_config
    target:
      kind: slot
      name: configuration_path
  - kind: execute_payload
    target:
      kind: slot
      name: configuration_payload
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
- id: config_vars
  matcher:
    kind: any_flag
    flags:
    - "--vars"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/easyrsa (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://github.com/OpenVPN/easy-rsa/blob/master/doc/EasyRSA-Advanced.md
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - This command might not be in the `PATH`, it could be found in, `/usr/share/easy-rsa/easyrsa`.
    The shell is spawn twice.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
