dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity: {canonical_name: cowsay, aliases: [cowthink]}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: help}
  - id: execute_cowfile
    selector: {kind: has_modifier_parameter_matching, modifier: cowfile, parameter: cowfile_payloads, matcher: {kind: regex_pattern, pattern: '/'}}
    parameters: [{name: message, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    effects: [{kind: read_path, target: {kind: configured_path, sources: [{slot: cowfile_payloads, projection: {kind: identity}}], missing: unknown, purpose: script_source}}]
  - id: execute_named_cowfile
    selector: {kind: all, items: [{kind: has_modifier, modifier: cowfile}, {kind: not, item: {kind: has_modifier_parameter_matching, modifier: cowfile, parameter: cowfile_payloads, matcher: {kind: regex_pattern, pattern: '/'}}}]}
    parameters: [{name: message, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
  - id: list_cowfiles
    selector: {kind: has_modifier, modifier: list}
    effects: [{kind: read_path, target: {kind: none}}]
  - id: render_message
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: cowfile}}, {kind: not, item: {kind: has_modifier, modifier: list}}, {kind: not, item: {kind: has_modifier, modifier: help}}]}
    parameters: [{name: message, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]

modifiers:
  - id: cowfile
    matcher: {kind: any_flag, flags: ['-f', '--file']}
    parameters:
      - name: cowfile_payloads
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
        structured_projection:
          branches: []
          fallback: {name: cowfile_code, semantic: {kind: payload, language: opaque, source: dynamic_reference, recursive: true}}
    effects:
      - {kind: execute_payload, target: {kind: slot, name: cowfile_code}}
  - {id: list, matcher: {kind: any_flag, flags: ['-l', '--list']}}
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}

extensions:
  caushell.profile/source_research:
    - https://github.com/schacon/cowsay/blob/master/cowsay.1
    - https://gtfobins.org/gtfobins/cowsay/
    - https://gtfobins.org/gtfobins/cowthink/
  caushell.profile/known_limitations:
    - cowthink is a native CLI alias of cowsay; both commands use this canonical profile and its Perl cowfile payload semantics.
    - The file is interpreted by cowsay's Perl cowfile mechanism. Its content is opaque non-Bash code and is never projected as a Bash program.
