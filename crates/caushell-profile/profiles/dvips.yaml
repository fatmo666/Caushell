dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true
identity:
  canonical_name: dvips
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
forms:
- id: translate_dvi
  selector:
    kind: all
    items:
    - &1
      kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: not
        item:
          kind: has_modifier
          modifier: unsafe_specials
    - kind: not
      item: &2
        kind: has_modifier_parameter_matching
        modifier: output
        parameter: output_path
        matcher:
          kind: literal
          value: "-"
  parameters:
  - name: dvi_path
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
    stdout_dependency: independent
  effects:
  - kind: read_path
    target:
      kind: slot
      name: dvi_path
  - kind: write_path
    target:
      kind: configured_path
      sources:
      - slot: output_path
        projection:
          kind: identity
      missing: unknown
      purpose: generic_operand
- id: translate_dvi_to_stdout
  selector:
    kind: all
    items:
    - *1
    - *2
  parameters:
  - name: dvi_path
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
    stdout_dependency: inputs
  effects:
  - kind: read_path
    target:
      kind: slot
      name: dvi_path
- id: unsafe_translate_dvi
  selector:
    kind: all
    items:
    - &3
      kind: all
      items:
      - kind: has_modifier
        modifier: unsafe_specials
      - kind: has_positional_at
        index: 0
    - kind: not
      item: &4
        kind: has_modifier_parameter_matching
        modifier: output
        parameter: output_path
        matcher:
          kind: literal
          value: "-"
  parameters:
  - name: dvi_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: dvi_path
        semantic:
          kind: path
          role: read
          purpose: script_source
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
    stdout_dependency: unknown
  effects:
  - kind: read_path
    target:
      kind: slot
      name: dvi_path
  - kind: execute_payload
    target:
      kind: slot
      name: dvi_payload
  - kind: write_path
    target:
      kind: configured_path
      sources:
      - slot: output_path
        projection:
          kind: identity
      missing: unknown
      purpose: generic_operand
- id: unsafe_translate_dvi_to_stdout
  selector:
    kind: all
    items:
    - *3
    - *4
  parameters:
  - name: dvi_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: dvi_path
        semantic:
          kind: path
          role: read
          purpose: script_source
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
    stdout_dependency: unknown
  effects:
  - kind: read_path
    target:
      kind: slot
      name: dvi_path
  - kind: execute_payload
    target:
      kind: slot
      name: dvi_payload
modifiers:
- id: unsafe_specials
  matcher:
    kind: any_flag
    flags:
    - "-R0"
- id: output
  matcher:
    kind: any_flag
    flags:
    - "-o"
  parameters:
  - name: output_path
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
extensions:
  caushell.profile/source_research:
  - https://tug.ctan.org/systems/doc/dvips/dvips.html
  caushell.profile/known_limitations:
  - "-R0 disables dvips safety checks. DVI specials and PostScript are opaque executable
    document content; the supplied offline texput.dvi is modeled as a read and opaque
    payload, with no fabricated command target."
  - Explicit -o FILE is a content write; -o - is stdout and not a local file. Defaults
    selected by DVI/config remain unknown writes. Included graphics, command-generated
    psfile contents and filter -f mode are not inferred.
