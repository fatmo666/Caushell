dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: bzcat, aliases: [xzcat, lzcat]}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: archive_stdout_files
    selector:
      kind: all
      items:
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      # Defaults can add input names or provide a list of names.
      - {kind: read_path, target: {kind: configured_path, sources: [], missing: unknown}}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs, stderr_dependency: inputs}
modifiers: []
extensions:
  caushell.profile/source_research:
    - https://sourceware.org/bzip2/manual/manual.html
    - https://gitlab.com/bzip2/bzip2/-/blob/bzip2-1.0.8/bzip2.c
    - https://tukaani.org/xz/man/xz.1.html
    - https://github.com/tukaani-project/xz/blob/master/src/xz/args.c
  caushell.profile/known_limitations:
    - These entry points select stdout rather than a per-file output. Environment defaults may change the operation and add input files or stdin.
    - The shared form models only named input operands. It does not prove decompression, output encoding, or behavior of additional CLI options.
