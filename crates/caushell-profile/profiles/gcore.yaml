dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: gcore, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_matching: exact_names
opaque_on_unresolved: true
forms:
  - id: dump_process_memory
    selector: {kind: has_positional_at, index: 0}
    parameters:
      - {name: process_ids, semantic: {kind: process_target, target_kind: unknown, broad_match: false}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects:
      - {kind: control_process, target: {kind: slot, name: process_ids}}
      - {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown, purpose: generic_operand}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: unknown}
modifiers:
  - id: output_prefix_option
    matcher: {kind: any_flag, flags: ['-o']}
    parameters: [{name: output_prefix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
  - id: directory
    matcher: {kind: any_flag, flags: ['-d']}
    parameters: [{name: gdb_data_directory, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
extensions:
  caushell.profile/source_research: [https://www.sourceware.org/gdb/download/onlinedocs/gdb.html/gcore-man.html]
  caushell.profile/known_limitations:
    - The positional values identify target PIDs; no process table or PID facts are probed. A core output is generated using a prefix plus a runtime PID suffix, so no concrete output filename is fabricated and a write with unknown path is recorded.
    - Process memory content, dumpability/ptrace permission, and GDB data-directory behavior are runtime dependent. The profile does not claim an exact destination from an output prefix.
