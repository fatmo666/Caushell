dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity:
  canonical_name: join
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: join_files
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: information}}
        - {kind: has_positional_at, index: 1}
        - {kind: not, item: {kind: has_positional_at, index: 2}}
    remaining_selector: {kind: no_positional_args}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: consume_stdin, target: {kind: slot, name: stdin_markers}}
      - {kind: transform_data, target: {kind: none}}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: join_field
    matcher: {kind: any_flag, flags: ['-1', '-2', '-j']}
    parameters: [{name: field_number, semantic: {kind: structured_value, context: numeric_quantity}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: unpaired
    matcher: {kind: any_flag, flags: ['-a', '-v']}
    parameters: [{name: file_number, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: replacement
    matcher: {kind: any_flag, flags: ['-e']}
    parameters: [{name: replacement, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: separator
    matcher: {kind: any_flag, flags: ['-t']}
    parameters: [{name: separator, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: output_format
    matcher: {kind: any_flag, flags: ['-o']}
    parameters: [{name: output_format, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - {id: comparison_controls, matcher: {kind: any_flag, flags: ['-i', --ignore-case, --check-order, --nocheck-order, --header, '-z', --zero-terminated]}}

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
