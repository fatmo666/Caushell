dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity:
  canonical_name: file
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: classify_files
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: {kind: has_modifier, modifier: files_from}}, {kind: has_positional_at, index: 0}]}
    remaining_selector: {kind: no_positional_args}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: consume_stdin, target: {kind: slot, name: stdin_markers}}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: no_file_operands
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: {kind: has_modifier, modifier: files_from}}, {kind: no_positional_args}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  # A file-selection list may itself name '-', so unknown list bytes cannot
  # prove stdin unused even when the list is read from a named file.
  - id: classify_from_list
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: has_modifier, modifier: files_from}]}
    remaining_selector: {kind: no_positional_args}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version, '-v']}}
  - id: files_from
    matcher: {kind: any_flag, flags: ['-f', --files-from]}
    parameters:
      - name: list_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_many
        structured_projection:
          branches: [{matcher: {kind: literal, value: '-'}, target: {name: list_stdin, semantic: {kind: plain_value}}}]
          fallback: {name: list_file, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: list_file}}
      - {kind: consume_stdin, target: {kind: slot, name: list_stdin}}
  - id: magic_file
    matcher: {kind: any_flag, flags: ['-m', --magic-file]}
    parameters: [{name: magic_file, semantic: {kind: path, role: config, purpose: tool_config}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
    effects:
      - {kind: load_config, target: {kind: slot, name: magic_file}}
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: magic_file}}
  - {id: output_mode, matcher: {kind: any_flag, flags: ['-b', --brief, '-i', '-I', --mime, --mime-type, --mime-encoding, '-L', --dereference, '-h', --no-dereference, '-z', --uncompress, '-Z', --uncompress-noreport, '-0', --print0, '-N', --no-pad, '-p', --preserve-date, '-s', --special-files, '-k', --keep-going, '-n', --no-buffer, '-E', --error, --extension, --apple]}}
  - id: separator
    matcher: {kind: any_flag, flags: ['-F', --separator]}
    parameters: [{name: separator, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: exclude_tests
    matcher: {kind: any_flag, flags: ['-e', --exclude, --exclude-quiet]}
    parameters: [{name: excluded_tests, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: parameter
    matcher: {kind: any_flag, flags: ['-P', --parameter]}
    parameters: [{name: parameter, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]

subcommands: null
extensions:
  caushell.profile/source_research:
    - https://github.com/apple-oss-distributions/file/blob/main/file/src/file.c
    - https://github.com/file/file/blob/master/src/file.c
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
