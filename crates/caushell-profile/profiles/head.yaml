dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: head
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: read_inputs
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: &effects
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths
  - id: read_inputs_stdin
    selector: {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, *stdin]}
    parameters: *inputs
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: *effects

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: bytes
    matcher:
      kind: any_flag
      flags:
        - "-c"
        - "--bytes"
    parameters:
      - name: byte_count
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: lines
    matcher:
      kind: any_flag
      flags:
        - "-n"
        - "--lines"
    parameters:
      - name: line_count
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: quiet
    matcher:
      kind: any_flag
      flags:
        - "-q"
        - "--quiet"
        - "--silent"

  - id: verbose
    matcher:
      kind: any_flag
      flags:
        - "-v"
        - "--verbose"

  - id: zero_terminated
    matcher:
      kind: any_flag
      flags:
        - "-z"
        - "--zero-terminated"

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/TODO_COVERAGE_CHECKLIST.md
    - command-frequency/cross-validation/analysis.md
