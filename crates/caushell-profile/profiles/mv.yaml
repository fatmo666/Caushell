dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: mv, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: information
    selector: &information {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: &streams {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: target_directory
    selector: {kind: all, items: [&running {kind: not, item: *information}, {kind: has_modifier, modifier: target_directory}, {kind: not, item: {kind: has_modifier, modifier: no_target_directory}}, {kind: has_positional_at, index: 0}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - {name: source_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects:
      - &source_move {kind: move_path, target: {kind: slot, name: source_paths}, host_risk: {semantic_class: move_source_path}}
    stream_contract: *streams
  - id: default_move
    selector: {kind: all, items: [*running, {kind: not, item: {kind: has_modifier, modifier: target_directory}}, {kind: has_positional_at, index: 1}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - {name: source_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals_before_last}, cardinality: required_many}
      - {name: destination_path, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: last_positional}, cardinality: required_one}
    effects:
      - *source_move
      - {kind: write_path, target: {kind: slot, name: destination_path}}
    stream_contract: *streams

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - {id: no_target_directory, matcher: {kind: any_flag, flags: [-T, --no-target-directory]}}
  - id: target_directory
    matcher: {kind: any_flag, flags: [-t, --target-directory]}
    parameters:
      - name: target_directory_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
        structured_projection:
          branches:
            - {matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, unless_modifier: information, target: {name: destination_directory, semantic: {kind: path, role: write, purpose: generic_operand}}}
    effects: [{kind: write_path, target: {kind: slot, name: destination_directory}}]
  - id: backup
    matcher: {kind: any_flag, flags: [--backup]}
    parameters: [{name: backup_control, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]
  - id: suffix
    matcher: {kind: any_flag, flags: [-S, --suffix]}
    parameters: [{name: backup_suffix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: update
    matcher: {kind: any_flag, flags: [--update]}
    parameters: [{name: update_control, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]
  - {id: ordinary_flags, matcher: {kind: any_flag, flags: [-b, -f, --force, -i, --interactive, -n, --no-clobber, -u, -v, --verbose, --strip-trailing-slashes, -Z, --no-copy]}}
  - id: selinux_context
    matcher: {kind: any_flag, flags: [--context]}
    parameters: [{name: context, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]

extensions:
  caushell.profile/sources: [https://github.com/coreutils/coreutils/blob/master/src/mv.c]
  caushell.profile/known_limitations:
    - Automatic backup names and their old-destination content origin need a separate output-specific transfer declaration. --exchange and unmodeled modes remain unresolved.
