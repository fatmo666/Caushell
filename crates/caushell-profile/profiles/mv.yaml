dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: mv, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: missing_operands
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: information}}
        - kind: any
          items:
            - kind: all
              items:
                - {kind: not, item: {kind: has_modifier, modifier: target_directory}}
                - {kind: any, items: [{kind: exact_positional_count, count: 0}, {kind: exact_positional_count, count: 1}]}
            - {kind: all, items: [{kind: has_modifier, modifier: target_directory}, {kind: exact_positional_count, count: 0}]}
    parameters: [{name: incomplete_operands, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
    extensions: {caushell.form/suppress_modifier_effects: true}

  - id: information
    selector: &information {kind: has_modifier, modifier: information}
    parameters: [{name: ignored, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: &streams {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: target_directory
    selector: {kind: all, items: [&running {kind: not, item: *information}, &no_backups {kind: not, item: &backups {kind: any, items: [{kind: has_modifier, modifier: backup}, {kind: has_modifier, modifier: suffix}, {kind: has_flag, flag: -b}]}}, {kind: has_modifier, modifier: target_directory}, {kind: not, item: {kind: has_modifier, modifier: no_target_directory}}, {kind: has_positional_at, index: 0}]}
    remaining_selector: {kind: no_positional_args}
    parameters: &directory_sources
      - {name: source_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}
    effects:
      - &source_move {kind: move_path, namespace_effect: entry_relocation, target: {kind: slot, name: source_paths}, host_risk: {semantic_class: move_source_path}}
    stream_contract: *streams
  - id: default_move
    selector:
      kind: all
      items:
        - *running
        - *no_backups
        - &implicit_target {kind: not, item: {kind: has_modifier, modifier: target_directory}}
        - &has_source_and_destination {kind: has_positional_at, index: 1}
        - kind: not
          item: &current_directory_placement
            kind: all
            items:
              - {kind: not, item: {kind: has_modifier, modifier: no_target_directory}}
              - {kind: last_positional_matches, matcher: {kind: regex_pattern, pattern: '^[.](?:/+[.])*/*$'}}
    remaining_selector: {kind: no_positional_args}
    parameters: &move_parameters
      - {name: source_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals_before_last}, cardinality: required_many}
      - {name: destination_path, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: last_positional}, cardinality: required_one}
    effects:
      - *source_move
      - &destination_write {kind: write_path, namespace_effect: entry_relocation, target: {kind: slot, name: destination_path}}
    stream_contract: *streams

  # An explicit spelling of the current directory selects a directory
  # operand. Each source basename determines a separate entry being written.
  - id: move_into_current_directory
    selector: {kind: all, items: [*running, *no_backups, *implicit_target, *has_source_and_destination, *current_directory_placement]}
    remaining_selector: {kind: no_positional_args}
    parameters: *move_parameters
    effects:
      - *source_move
      - kind: write_path
        target:
          kind: derived_path
          source: {kind: slot, name: source_paths}
          rule: {kind: basename}
          purpose: generic_operand
    stream_contract: *streams

  # A trailing slash requires directory placement. Both the source's
  # destination entry and the previous destination's numbered backup are
  # within that directory, including when the generated basename is shortened.
  - id: numbered_backup_into_directory
    selector: &numbered_directory
      kind: all
      items:
        - *running
        - *implicit_target
        - {kind: exact_positional_count, count: 2}
        - {kind: not, item: {kind: has_modifier, modifier: no_target_directory}}
        - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - {kind: not, item: {kind: has_flag, flag: -b}}
        - {kind: not, item: {kind: has_flag_at_least, flag: --backup, count: 2}}
        - {kind: has_modifier_parameter_matching, modifier: backup, parameter: backup_control, matcher: {kind: literal, value: numbered}}
        - {kind: last_positional_matches, matcher: {kind: regex_pattern, pattern: '^[^\x00]+/$'}}
    remaining_selector: {kind: no_positional_args}
    parameters: *move_parameters
    effects:
      - *source_move
      - {kind: write_path, namespace_effect: entry_relocation, path_scope: {kind: subtree}, target: {kind: slot, name: destination_path}}
    stream_contract: *streams

  # Other backup modes still have an unproved operation envelope.
  - id: backup_move
    operation_semantics_unresolved: true
    selector: {kind: all, items: [*running, *backups, {kind: not, item: *numbered_directory}, {kind: not, item: {kind: has_modifier, modifier: target_directory}}, {kind: has_positional_at, index: 1}]}
    remaining_selector: {kind: no_positional_args}
    parameters: *move_parameters
    effects:
      - *source_move
      - *destination_write
      - &backup_write {kind: write_path, target: {kind: none}}
    stream_contract: *streams
  - id: backup_target_directory
    operation_semantics_unresolved: true
    selector: {kind: all, items: [*running, *backups, {kind: has_modifier, modifier: target_directory}, {kind: not, item: {kind: has_modifier, modifier: no_target_directory}}, {kind: has_positional_at, index: 0}]}
    remaining_selector: {kind: no_positional_args}
    parameters: *directory_sources
    effects:
      - *source_move
      - *backup_write
    stream_contract: *streams

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - {id: no_target_directory, matcher: {kind: any_flag, flags: [-T, --no-target-directory]}}
  - id: target_directory
    matcher: {kind: any_flag, flags: [-t, --target-directory]}
    parameters:
      - name: target_directory_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
        structured_projection:
          branches:
            - {matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, unless_modifier: information, target: {name: destination_directory, semantic: {kind: path, role: write, purpose: generic_operand}}}
    effects: [{kind: write_path, namespace_effect: entry_relocation, target: {kind: slot, name: destination_directory}}]
  - id: backup
    matcher: {kind: any_flag, flags: [--backup]}
    parameters: [{name: backup_control, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]
  - id: suffix
    matcher: {kind: any_flag, flags: [-S, --suffix]}
    parameters: [{name: backup_suffix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: update
    matcher: {kind: any_flag, flags: [--update]}
    parameters: [{name: update_control, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]
  - {id: ordinary_flags, matcher: {kind: any_flag, flags: [-b, -f, --force, -i, --interactive, -n, --no-clobber, -u, -v, --verbose, --strip-trailing-slashes, -Z, --no-copy]}}
  - id: selinux_context
    matcher: {kind: any_flag, flags: [--context]}
    parameters: [{name: context, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_one}]

extensions:
  caushell.profile/sources: [https://github.com/coreutils/coreutils/blob/master/src/mv.c]
  caushell.profile/no_path_effects_without_file_operands: true
  caushell.profile/known_limitations:
    - Automatic backup names and their old-destination content origin need a separate output-specific transfer declaration. --exchange and unmodeled modes remain unresolved.
