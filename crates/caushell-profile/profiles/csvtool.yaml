---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: csvtool
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: trim_csv_to_stdout
  selector:
    kind: all
    items:
    - &1
      kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: trim
    - kind: not
      item:
        kind: has_modifier
        modifier: output
  parameters: &2
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  - name: trim_mode
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  - name: input_path
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - &3
    kind: read_path
    target:
      kind: slot
      name: input_path
  - &4
    kind: transform_data
    target:
      kind: none
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
    stdout_dependency: inputs
- id: trim_csv_to_file
  selector:
    kind: all
    items:
    - *1
    - kind: has_modifier
      modifier: output
  parameters: *2
  effects:
  - *3
  - *4
  - kind: write_path
    target:
      kind: configured_path
      sources:
      - slot: output_path
        projection:
          kind: identity
      missing: skip
      purpose: generic_operand
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: call_expression
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: literal
      value: call
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  - name: shell_command
    semantic:
      kind: payload
      language: sh
      source: inline_string
      recursive: true
    binding:
      kind: next_positional
    cardinality: required_one
  - name: input_path
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: input_path
  - kind: execute_payload
    target:
      kind: slot
      name: shell_command
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: help
  selector:
    kind: has_modifier
    modifier: information
extensions:
  caushell.profile/source_research:
  - https://gtfobins.org/gtfobins/csvtool/
  - https://ocaml.org/p/csvtool/latest/README.html
  - https://manpages.ubuntu.com/manpages/noble/man1/csvtool.1.html
  caushell.profile/known_limitations:
  - Only trim t and call are declared. Operation/mode words are data, not file paths.
    The call string uses the documented native system shell; row-derived argument
    quoting/content remains a runtime dependency, not invented literal paths. Dash-input/output
    and undeclared operations retain unresolved approval.
modifiers:
- id: output
  matcher:
    kind: any_flag
    flags:
    - "-o"
    - "--output"
  parameters:
  - name: output_path
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
  effects: []
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-help"
option_matching: exact_names
