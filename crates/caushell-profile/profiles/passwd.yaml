dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: passwd
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: password_change_from_stdin
  selector:
    kind: all
    items:
    - kind: no_positional_args
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  implicit_inputs:
  - source: stdin_data
    semantic:
      kind: plain_value
  effects:
  - kind: consume_stdin
    target:
      kind: implicit_input
      source: stdin_data
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      default_value: "/etc/shadow"
      missing: skip
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/passwd (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - This changes the root password to `x`, so it's now possible to log in using, for
    example, `su`.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
