dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true

identity:
  canonical_name: crontab
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: &information
      kind: any
      items:
        - {kind: has_modifier, modifier: help}
        - {kind: has_modifier, modifier: version}
    stream_contract: &no_input
      stdin_mode: ignored
      stdout_mode: opaque
      stderr_mode: opaque
      stdout_dependency: independent

  - id: list_crontab
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: list}
        - {kind: not, item: *information}
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_modifier, modifier: remove}
              - {kind: has_modifier, modifier: edit}
              - {kind: has_modifier, modifier: syntax_test}
    effects:
      - kind: read_path
        target: &task_store
          kind: configured_path
          sources: []
          missing: unknown
          purpose: tool_config
      - kind: load_config
        target: {kind: none}
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque
      stdout_dependency: inputs

  - id: remove_crontab
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: remove}
        - {kind: not, item: *information}
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_modifier, modifier: list}
              - {kind: has_modifier, modifier: edit}
              - {kind: has_modifier, modifier: syntax_test}
    effects:
      - kind: delete_path
        target: *task_store
    stream_contract: *no_input

  - id: edit_crontab
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: edit}
        - {kind: not, item: *information}
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_modifier, modifier: list}
              - {kind: has_modifier, modifier: remove}
              - {kind: has_modifier, modifier: syntax_test}
    effects:
      - kind: read_path
        target: *task_store
      - kind: write_path
        target: *task_store
      - kind: open_interactive_escape_surface
        target:
          kind: none
        surface:
          kind: editor
          requires_tty: true
          capabilities:
            - run_command
            - launch_external_editor
            - write_buffer_to_path
      - kind: execute_config_defined_task
        target: {kind: none}
    stream_contract: *no_input

  - id: install_crontab_file
    selector:
      kind: all
      items:
        - &install_mode
          kind: all
          items:
            - {kind: not, item: *information}
            - kind: not
              item:
                kind: any
                items:
                  - {kind: has_modifier, modifier: list}
                  - {kind: has_modifier, modifier: remove}
                  - {kind: has_modifier, modifier: edit}
                  - {kind: has_modifier, modifier: syntax_test}
        - &file_input
          kind: all
          items:
            - {kind: has_positional_at, index: 0}
            - kind: not
              item: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}
    parameters: &file_parameters
      - name: crontab_file
        semantic:
          kind: path
          role: config
          purpose: task_config
        binding:
          kind: next_positional
        cardinality: required_one
    effects:
      - &read_file
        kind: read_path
        target: {kind: slot, name: crontab_file}
      - kind: load_config
        target:
          kind: slot
          name: crontab_file
      - kind: execute_config_defined_task
        target:
          kind: slot
          name: crontab_file
      - &install_store
        kind: write_path
        target: *task_store
    stream_contract: *no_input

  - id: install_crontab_stdin
    selector:
      kind: all
      items:
        - *install_mode
        - &stdin_input
          kind: any
          items:
            - {kind: no_positional_args}
            - kind: all
              items:
                - {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}
                - {kind: not, item: {kind: has_positional_at, index: 1}}
    parameters: &stdin_parameters
      - name: stdin_marker
        semantic: {kind: plain_value}
        binding: {kind: next_positional}
        cardinality: optional_one
    implicit_inputs: &stdin_config
      - {source: stdin_data, semantic: {kind: plain_value}}
    effects:
      - &read_stdin
        kind: consume_stdin
        target: {kind: implicit_input, source: stdin_data}
      - kind: load_config
        target: {kind: implicit_input, source: stdin_data}
      - kind: execute_config_defined_task
        target: {kind: implicit_input, source: stdin_data}
      - *install_store
    stream_contract: &input_stream
      stdin_mode: data_required
      stdout_mode: opaque
      stderr_mode: opaque
      stdout_dependency: inputs

  - id: test_crontab_file
    selector:
      kind: all
      items:
        - &test_mode
          kind: all
          items:
            - {kind: has_modifier, modifier: syntax_test}
            - {kind: not, item: *information}
            - kind: not
              item:
                kind: any
                items:
                  - {kind: has_modifier, modifier: list}
                  - {kind: has_modifier, modifier: remove}
                  - {kind: has_modifier, modifier: edit}
        - *file_input
    parameters: *file_parameters
    effects: [*read_file]
    stream_contract: *no_input

  - id: test_crontab_stdin
    selector: {kind: all, items: [*test_mode, *stdin_input]}
    parameters: *stdin_parameters
    implicit_inputs: *stdin_config
    effects: [*read_stdin]
    stream_contract: *input_stream

modifiers:
  - {id: list, matcher: {kind: any_flag, flags: ['-l']}}
  - {id: remove, matcher: {kind: any_flag, flags: ['-r']}}
  - {id: edit, matcher: {kind: any_flag, flags: ['-e']}}
  - {id: syntax_test, matcher: {kind: any_flag, flags: ['-T']}}
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-V', '--version']}}
  - {id: confirmation, matcher: {kind: any_flag, flags: ['-i']}}
  - {id: selinux_context, matcher: {kind: any_flag, flags: ['-s']}}
  - id: user
    matcher:
      kind: any_flag
      flags:
        - "-u"
    parameters:
      - name: user_name
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
    - https://man7.org/linux/man-pages/man1/crontab.1.html
    - https://manpages.debian.org/trixie/cron/crontab.1.en.html
  caushell.profile/known_limitations:
    - Installation and editor completion replace the scheduler-managed task table; removal deletes that table. Its implementation/user-dependent storage path stays unknown, not inferred from the input file or cwd.
    - No-operand stdin installation is supported by Cronie but rejected by some other implementations. This form represents the possible write, not guaranteed command success or a runtime stdin/TTY probe.
    - The '-' input is stdin data, not a file named '-'. Task-table text is not recursively parsed as an immediately executed Bash program.
    - "'-T' is Cronie's read-only syntax test. '-n' is intentionally unresolved because Debian uses it for dry-run while Cronie uses it to change the cluster execution host."
    - Unrecognized implementation-specific options, extra operands and conflicting operation modes retain unresolved-operation approval; command failure is not simulated.
