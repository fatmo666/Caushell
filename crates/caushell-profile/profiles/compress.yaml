dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: compress, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: information
    selector: &info {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: &quiet {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: compress_stdout_files
    selector:
      kind: all
      items:
        - &active {kind: all, items: [{kind: not, item: *info}, {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}]}
        - &stdout {kind: has_modifier, modifier: stdout}
        - {kind: not, item: &decode {kind: has_modifier, modifier: decompress}}
        - &files {kind: has_positional_at, index: 0}
    parameters: &inputs [{name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    effects: &compress_stream [ &read {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}, &compress_transform {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}]
    stream_contract: &file_output {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: compress_stdout_stdin
    selector: {kind: all, items: [*active, {kind: not, item: *decode}, {kind: not, item: *files}]}
    parameters: *inputs
    effects: *compress_stream
    stream_contract: &stdin_output {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: decompress_stdout_files
    selector: {kind: all, items: [*active, *stdout, *decode, *files]}
    parameters: *inputs
    effects: &decode_stream [*read, &decode_transform {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}]
    stream_contract: *file_output
  - id: decompress_stdout_stdin
    selector: {kind: all, items: [*active, *decode, {kind: not, item: *files}]}
    parameters: *inputs
    effects: *decode_stream
    stream_contract: *stdin_output
  - id: compress_files
    selector:
      kind: all
      items:
        - &file_operation {kind: all, items: [*active, *files, {kind: not, item: *stdout}, {kind: not, item: &recursive {kind: has_modifier, modifier: recursive}}]}
        - {kind: not, item: *decode}
        - &not_keep {kind: not, item: &keep {kind: has_modifier, modifier: keep}}
    parameters: *inputs
    effects: [*read, &write_compressed {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: append_suffix, suffix: '.Z'}, purpose: generic_operand}}, &delete {kind: delete_path, target: {kind: slot, name: input_paths}}, *compress_transform]
    stream_contract: *quiet
  - id: compress_files_keep
    selector: {kind: all, items: [*file_operation, {kind: not, item: *decode}, *keep]}
    parameters: *inputs
    effects: [*read, *write_compressed, *compress_transform]
    stream_contract: *quiet
  - id: decompress_files
    selector: {kind: all, items: [*file_operation, *decode, *not_keep]}
    parameters: *inputs
    effects: [*read, &write_decoded {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: strip_suffix, suffix: '.Z'}, purpose: generic_operand}}, *delete, *decode_transform]
    stream_contract: *quiet
  - id: decompress_files_keep
    selector: {kind: all, items: [*file_operation, *decode, *keep]}
    parameters: *inputs
    effects: [*read, *write_decoded, *decode_transform]
    stream_contract: *quiet
  - id: recursive_file_mutation
    selector: {kind: all, items: [*active, *files, {kind: not, item: *stdout}, *recursive, *not_keep]}
    parameters: *inputs
    effects: [*read, &unknown_write {kind: write_path, target: {kind: none}}, {kind: delete_path, target: {kind: none}}]
    stream_contract: *quiet
  - id: recursive_file_mutation_keep
    selector: {kind: all, items: [*active, *files, {kind: not, item: *stdout}, *recursive, *keep]}
    parameters: *inputs
    effects: [*read, *unknown_write]
    stream_contract: *quiet
modifiers:
  - {id: stdout, matcher: {kind: any_flag, flags: ['-c']}}
  - {id: decompress, matcher: {kind: any_flag, flags: ['-d']}}
  - {id: keep, matcher: {kind: any_flag, flags: ['-k']}}
  - {id: force, matcher: {kind: any_flag, flags: ['-f', '-F']}}
  - {id: diagnostics, matcher: {kind: any_flag, flags: ['-v', '-q', '-s']}}
  - {id: recursive, matcher: {kind: any_flag, flags: ['-r', '-R']}}
  - {id: legacy_header, matcher: {kind: any_flag, flags: ['-n']}}
  - {id: help, matcher: {kind: any_flag, flags: ['-h']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-V']}}
  - id: bits
    matcher: {kind: any_flag, flags: ['-b']}
    parameters: [{name: maxbits, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
subcommands: null
extensions:
  caushell.profile/source_research: [https://github.com/vapier/ncompress/blob/main/compress.c]
  caushell.profile/known_limitations:
    - ncompress 5.x CLI; recursive mutations retain unknown output targets. Native success/permission and implicit decode .Z lookup are not probed.
    - Explicit dash operands are conservatively opaque; before -- native ncompress ignores a bare dash, while after -- it is a filename.
