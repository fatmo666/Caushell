dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: msfconsole
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: interactive_repl
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: no_arguments
      - kind: not
        item:
          kind: has_flag
          flag: "--help"
      - kind: not
        item:
          kind: has_flag
          flag: "--version"
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  implicit_inputs:
  - source: interactive_session
    semantic:
      kind: payload
      language: opaque
      source: interactive
      recursive: true
  effects:
  - kind: execute_payload
    target:
      kind: implicit_input
      source: interactive_session
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - run_command
      - spawn_shell
  stream_contract:
    stdin_mode: payload_optional
    stdout_mode: opaque
    stderr_mode: opaque
subcommands:
extensions:
  caushell.profile/source_research:
  - https://gtfobins.org/gtfobins/msfconsole/
  caushell.profile/known_limitations:
  - The pinned source opens msfconsole then enters its IRB console; subsequent input
    is Ruby-native UI data, not outer shell argv.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
