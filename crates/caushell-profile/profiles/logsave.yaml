dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity: {canonical_name: logsave, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}

forms:
  - id: log_command_output
    selector:
      kind: all
      items:
        - {kind: has_positional_at, index: 0}
        - {kind: has_positional_at, index: 1}
        - {kind: not, item: {kind: has_positional_at_matching, index: 1, matcher: {kind: literal, value: '-'}}}
    parameters:
      - {name: logfile, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    effects:
      - {kind: write_path, path_access: content_open, target: {kind: slot, name: logfile}}
      - kind: dispatch_command
        target: {kind: dispatch, command: child_command, argv: [child_argv], stdin_from_parent: true, stdout_to_parent: true}

modifiers:
  - {id: append, matcher: {kind: any_flag, flags: ['-a']}}
  - {id: skip_control_sequences, matcher: {kind: any_flag, flags: ['-s']}}
  - {id: verbose, matcher: {kind: any_flag, flags: ['-v']}}

subcommands: null
extensions:
  caushell.profile/sources:
    - https://manpages.debian.org/unstable/e2fsprogs/logsave.8.en.html
    - GTFOBins fixed snapshot logsave/shell/0
  caushell.profile/scope: Models a content-open write to the logfile and child argv execution; native logsave passes its input to the child and copies child output to both its own stdout and logfile. The special child command '-' (stdin-copy mode), exact output capture/ordering, append/truncate details, deferred writes, and logsave failures are not modeled. Child arguments including -i and -p remain child argv.
