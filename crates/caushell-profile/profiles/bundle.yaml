dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true
identity:
  canonical_name: bundle
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: exec_child
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at_matching
        index: 0
        matcher:
          kind: literal
          value: exec
      - kind: has_positional_at
        index: 1
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: child_command
    semantic:
      kind: command_ref
      dispatch: wrapper_command
    binding:
      kind: next_positional
    cardinality: required_one
  - name: child_argv
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: dispatch_command
    target:
      kind: dispatch
      command: child_command
      argv:
      - child_argv
      stdin_from_parent: true
      stdout_to_parent: true
- id: interactive_console
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: console
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  implicit_inputs:
  - source: interactive_session
    semantic:
      kind: payload
      language: opaque
      source: interactive
      recursive: true
  effects:
  - kind: execute_payload
    target:
      kind: implicit_input
      source: interactive_session
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - spawn_shell
      - run_command
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
- id: help_pager
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: help
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  implicit_inputs:
  - source: interactive_session
    semantic:
      kind: payload
      language: opaque
      source: interactive
      recursive: true
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - run_command
      - spawn_shell
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
- id: install_gemfile
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: install
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  effects:
  - kind: read_path
    target:
      kind: tool_convention_path
      path: Gemfile
      convention: bundler.project_definition
      purpose: tool_config
  - kind: execute_imported_package_logic
    target:
      kind: tool_convention_path
      path: Gemfile
      convention: bundler.project_definition
      purpose: tool_config
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
subcommands:
extensions:
  caushell.profile/source_research:
  - https://bundler.io/man/bundle-exec.1.html
  - https://bundler.io/man/bundle-console.1.html
  - https://gtfobins.org/gtfobins/bundle/
  caushell.profile/known_limitations:
  - The exec form passes explicit child argv; console input is an interactive Ruby
    session. Gemfile evaluation and install hooks are configuration-driven and not
    expanded.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
