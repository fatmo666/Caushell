dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true
identity: {canonical_name: tasksh, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
forms:
  - id: interactive_tasksh
    selector: {kind: no_positional_args}
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects: [{kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}]
extensions:
  caushell.profile/source_research: [https://taskwarrior.org/docs/tasksh/]
  caushell.profile/known_limitations: [The GTFOBins !/bin/sh line is an interactive tasksh input event, not a standalone Bash command or argv child; the session contents remain opaque.]
