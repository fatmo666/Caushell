dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options

identity:
  canonical_name: sshpass
  aliases: []
trust:
  tier: tier_a
  source: built_in
  review_notes: "sshpass 1.10: own options stop before command; -e optionally accepts an attached environment-variable name."
platform:
  os_families: [posix, linux, macos]

forms:
  - id: dispatch_with_password_source
    selector:
      kind: all
      items:
        - kind: has_positional_at
          index: 0
        - kind: not
          item: &information
            kind: any
            items:
              - {kind: has_flag, flag: "-h"}
              - {kind: has_flag, flag: "-V"}
        - kind: any
          items:
            - {kind: has_modifier, modifier: password_argument}
            - {kind: has_modifier, modifier: password_file}
            - {kind: has_modifier, modifier: password_fd}
            - {kind: has_modifier, modifier: password_environment}
    parameters: &child_parameters
      - name: wrapped_command
        semantic: {kind: command_ref, dispatch: wrapper_command}
        binding: {kind: next_positional}
        cardinality: required_one
      - name: wrapped_args
        semantic: {kind: plain_value}
        binding: {kind: remaining_args}
        cardinality: optional_many
    remaining_selector: {kind: no_positional_args}
    effects:
      - kind: dispatch_command
        target:
          kind: dispatch
          command: wrapped_command
          argv: [wrapped_args]
          environment: []

  - id: dispatch_with_stdin_password
    selector:
      kind: all
      items:
        - kind: has_positional_at
          index: 0
        - kind: not
          item: *information
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_flag, flag: "-p"}
              - {kind: has_flag, flag: "-f"}
              - {kind: has_flag, flag: "-d"}
              - {kind: has_flag, flag: "-e"}
    parameters: *child_parameters
    remaining_selector: {kind: no_positional_args}
    implicit_inputs:
      - source: stdin_data
        semantic: {kind: plain_value}
    effects:
      - kind: consume_stdin
        target: {kind: implicit_input, source: stdin_data}
      - kind: dispatch_command
        target:
          kind: dispatch
          command: wrapped_command
          argv: [wrapped_args]
          environment: []

  - id: show_help
    selector: {kind: has_flag, flag: "-h"}
  - id: show_version
    selector:
      kind: all
      items:
        - {kind: has_flag, flag: "-V"}
        - kind: not
          item: {kind: has_flag, flag: "-h"}

modifiers:
  - id: password_argument
    matcher: {kind: any_flag, flags: ["-p"]}
    constraints:
      - {kind: mutually_exclusive_with, modifier: password_file}
      - {kind: mutually_exclusive_with, modifier: password_fd}
      - {kind: mutually_exclusive_with, modifier: password_environment}
    parameters:
      - name: password
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
  - id: password_file
    matcher: {kind: any_flag, flags: ["-f"]}
    constraints:
      - {kind: mutually_exclusive_with, modifier: password_argument}
      - {kind: mutually_exclusive_with, modifier: password_fd}
      - {kind: mutually_exclusive_with, modifier: password_environment}
    parameters:
      - name: password_file
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
    effects:
      - kind: read_path
        target: {kind: slot, name: password_file}
  - id: password_fd
    matcher: {kind: any_flag, flags: ["-d"]}
    constraints:
      - {kind: mutually_exclusive_with, modifier: password_argument}
      - {kind: mutually_exclusive_with, modifier: password_file}
      - {kind: mutually_exclusive_with, modifier: password_environment}
    parameters:
      - name: password_fd
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
  - id: password_environment
    matcher: {kind: any_flag, flags: ["-e"]}
    constraints:
      - {kind: mutually_exclusive_with, modifier: password_argument}
      - {kind: mutually_exclusive_with, modifier: password_file}
      - {kind: mutually_exclusive_with, modifier: password_fd}
    parameters:
      - name: password_environment_name
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: inline_or_short_attached}
        cardinality: optional_one
  - id: prompt
    matcher: {kind: any_flag, flags: ["-P"]}
    parameters:
      - name: password_prompt
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
  - id: verbose
    matcher: {kind: any_flag, flags: ["-v"]}
  - id: help
    matcher: {kind: any_flag, flags: ["-h"]}
  - id: version
    matcher: {kind: any_flag, flags: ["-V"]}

extensions:
  caushell.profile/source: "https://manpages.debian.org/trixie/sshpass/sshpass.1.en.html"
  caushell.profile/known_limitations:
    - "The inherited FD and environment password values are not resolved; no new runtime facts are requested."
    - "Dedicated TTY password delivery is not represented as a separate cross-process data channel."
    - "Unknown options and invalid password-source combinations remain explicit selection gaps."
