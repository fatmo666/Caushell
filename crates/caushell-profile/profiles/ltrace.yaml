---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: ltrace
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
option_scope: leading_options
opaque_on_unresolved: true
forms:
- id: trace_child_with_config
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_modifier
        modifier: config_file
      - kind: has_positional_at
        index: 0
      - kind: not
        item:
          kind: has_modifier
          modifier: attach_pid
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: child_command
    semantic:
      kind: command_ref
      dispatch: command_name
    binding:
      kind: next_positional
    cardinality: required_one
  - name: child_args
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: dispatch_command
    target:
      kind: dispatch
      command: child_command
      argv:
      - child_args
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: trace_child
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_positional_at
        index: 0
      - kind: not
        item:
          kind: has_modifier
          modifier: config_file
      - kind: not
        item:
          kind: has_modifier
          modifier: attach_pid
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: child_command
    semantic:
      kind: command_ref
      dispatch: command_name
    binding:
      kind: next_positional
    cardinality: required_one
  - name: child_args
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: dispatch_command
    target:
      kind: dispatch
      command: child_command
      argv:
      - child_args
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: attach_to_existing_process
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_modifier
        modifier: attach_pid
      - kind: no_positional_args
      - kind: not
        item:
          kind: has_modifier
          modifier: config_file
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters: []
  effects: []
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: information
  selector:
    kind: has_modifier
    modifier: information
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers:
- id: config_file
  matcher:
    kind: any_flag
    flags:
    - "-F"
  parameters:
  - name: config_files
    semantic:
      kind: path
      role: read
      purpose: tool_config
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
  effects:
  - kind: read_path
    target:
      kind: slot
      name: config_files
- id: output
  matcher:
    kind: any_flag
    flags:
    - "-o"
    - "--output"
  parameters:
  - name: output_file
    semantic:
      kind: path
      role: write
      purpose: generic_operand
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
  effects:
  - kind: write_path
    target:
      kind: slot
      name: output_file
- id: attach_pid
  matcher:
    kind: any_flag
    flags:
    - "-p"
  parameters:
  - name: process_id
    semantic:
      kind: process_target
      target_kind: pid
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_many
- id: string_limit
  matcher:
    kind: any_flag
    flags:
    - "-s"
  parameters:
  - name: limit
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
- id: no_signals
  matcher:
    kind: any_flag
    flags:
    - "-b"
- id: no_library_calls
  matcher:
    kind: any_flag
    flags:
    - "-L"
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-h"
    - "--help"
    - "-V"
    - "--version"
  parameters: []
  effects: []
extensions:
  caushell.profile/source_research:
  - https://man7.org/linux/man-pages/man1/ltrace.1.html
  - 'GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/ltrace file-read,
    file-write and shell'
  caushell.profile/known_limitations:
  - "-F accepts colon-separated prototype-config paths; the supplied paths are reads
    and the native child command remains a separate argv dispatch."
  - "-o is a real local trace-file write; without -o, trace output goes to stderr."
  - "-p attaches to an existing process and does not dispatch a new command."
  - Trace string escaping and truncation are not expanded into further file effects.
