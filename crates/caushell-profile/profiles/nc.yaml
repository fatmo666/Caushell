dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: nc, aliases: [netcat]}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: show_help
    selector: &information {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}

  - id: dialect_dependent
    operation_semantics_unresolved: true
    selector: {kind: all, items: [{kind: not, item: *information}, {kind: any, items: [{kind: has_modifier, modifier: ambiguous_exec}, {kind: has_modifier, modifier: ambiguous_tls}, {kind: all, items: [{kind: has_modifier, modifier: unix_socket}, {kind: has_modifier, modifier: udp}]}]}]}
    parameters: [{name: operands, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
  - id: network_session
    selector: {kind: all, items: [{kind: all, items: [{kind: not, item: *information}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}, {kind: not, item: {kind: has_modifier, modifier: unix_socket}}, {kind: not, item: {kind: has_modifier, modifier: listen}}, {kind: not, item: {kind: has_modifier, modifier: scan}}, {kind: has_positional_at, index: 0}]}, {kind: not, item: {kind: has_modifier, modifier: detach}}]}
    remaining_selector: {kind: no_positional_args}
    parameters: &connect
      - {name: remote_endpoint, semantic: {kind: endpoint, endpoint_kind: host_port, usage: generic_endpoint}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_many}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: scan
    selector: {kind: all, items: [{kind: not, item: *information}, {kind: has_modifier, modifier: scan}, {kind: not, item: {kind: has_modifier, modifier: listen}}, {kind: not, item: {kind: has_modifier, modifier: unix_socket}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}, {kind: has_positional_at, index: 0}]}
    remaining_selector: {kind: no_positional_args}
    parameters: *connect
    effects: [{kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: false}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}

  - id: listen_host
    selector: {kind: all, items: [{kind: all, items: [&listening {kind: all, items: [{kind: not, item: *information}, {kind: has_modifier, modifier: listen}, {kind: not, item: {kind: has_modifier, modifier: unix_socket}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}]}, {kind: has_positional_at, index: 1}]}, {kind: not, item: {kind: has_modifier, modifier: detach}}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: remote_endpoint
        semantic: {kind: endpoint, endpoint_kind: host_port, usage: generic_endpoint}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection: {branches: [{matcher: {kind: regex_capture, pattern: '^.*$', group: 0}, target: {name: bind_host, semantic: {kind: plain_value}}}]}
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: listen_network, target: {kind: network_listener, host: {slot: bind_host, default_value: '0.0.0.0'}, port: {slot: port}}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: listen_default
    selector: {kind: all, items: [{kind: all, items: [*listening, {kind: not, item: {kind: has_positional_at, index: 1}}]}, {kind: not, item: {kind: has_modifier, modifier: detach}}]}
    parameters:
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: optional_one}
      - {name: bind_host, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: optional_one}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: listen_network, target: {kind: network_listener, host: {slot: bind_host, default_value: '0.0.0.0'}, port: {slot: port}}}

  - id: unix_connect
    selector: {kind: all, items: [{kind: all, items: [&unix {kind: all, items: [{kind: not, item: *information}, {kind: has_modifier, modifier: unix_socket}, {kind: not, item: {kind: has_modifier, modifier: udp}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}]}, {kind: not, item: {kind: has_modifier, modifier: listen}}, {kind: has_positional_at, index: 0}]}, {kind: not, item: {kind: has_modifier, modifier: detach}}]}
    remaining_selector: {kind: no_positional_args}
    parameters: [{name: remote_endpoint, semantic: {kind: endpoint, endpoint_kind: socket_path, usage: generic_endpoint}, binding: {kind: next_positional}, cardinality: required_one}]
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: unix_listen
    selector: {kind: all, items: [{kind: all, items: [*unix, {kind: has_modifier, modifier: listen}, {kind: has_positional_at, index: 0}]}, {kind: not, item: {kind: has_modifier, modifier: detach}}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: remote_endpoint
        semantic: {kind: endpoint, endpoint_kind: socket_path, usage: generic_endpoint}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection: {branches: [{matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, target: {name: socket_path, semantic: {kind: path, role: write, purpose: generic_operand}}}]}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: listen_network, target: {kind: network_listener, host: {slot: bind_host}, unix_socket: {slot: socket_path}}}
      - {kind: write_path, target: {kind: slot, name: socket_path}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: network_session_detached
    selector: {kind: all, items: [{kind: all, items: [{kind: not, item: *information}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}, {kind: not, item: {kind: has_modifier, modifier: unix_socket}}, {kind: not, item: {kind: has_modifier, modifier: listen}}, {kind: not, item: {kind: has_modifier, modifier: scan}}, {kind: has_positional_at, index: 0}]}, {kind: has_modifier, modifier: detach}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - {name: remote_endpoint, semantic: {kind: endpoint, endpoint_kind: host_port, usage: generic_endpoint}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_many}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects:
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: listen_host_detached
    selector: {kind: all, items: [{kind: all, items: [{kind: all, items: [{kind: not, item: *information}, {kind: has_modifier, modifier: listen}, {kind: not, item: {kind: has_modifier, modifier: unix_socket}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}]}, {kind: has_positional_at, index: 1}]}, {kind: has_modifier, modifier: detach}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: remote_endpoint
        semantic: {kind: endpoint, endpoint_kind: host_port, usage: generic_endpoint}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection: {branches: [{matcher: {kind: regex_capture, pattern: '^.*$', group: 0}, target: {name: bind_host, semantic: {kind: plain_value}}}]}
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects:
      - {kind: listen_network, target: {kind: network_listener, host: {slot: bind_host, default_value: '0.0.0.0'}, port: {slot: port}}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}
  - id: listen_default_detached
    selector: {kind: all, items: [{kind: all, items: [*listening, {kind: not, item: {kind: has_positional_at, index: 1}}]}, {kind: has_modifier, modifier: detach}]}
    parameters:
      - {name: port, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: optional_one}
      - {name: bind_host, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: optional_one}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: [{kind: listen_network, target: {kind: network_listener, host: {slot: bind_host, default_value: '0.0.0.0'}, port: {slot: port}}}]

  - id: unix_connect_detached
    selector: {kind: all, items: [{kind: all, items: [{kind: all, items: [{kind: not, item: *information}, {kind: has_modifier, modifier: unix_socket}, {kind: not, item: {kind: has_modifier, modifier: udp}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_exec}}, {kind: not, item: {kind: has_modifier, modifier: ambiguous_tls}}]}, {kind: not, item: {kind: has_modifier, modifier: listen}}, {kind: has_positional_at, index: 0}]}, {kind: has_modifier, modifier: detach}]}
    remaining_selector: {kind: no_positional_args}
    parameters: [{name: remote_endpoint, semantic: {kind: endpoint, endpoint_kind: socket_path, usage: generic_endpoint}, binding: {kind: next_positional}, cardinality: required_one}]
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: [{kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}]
  - id: unix_listen_detached
    selector: {kind: all, items: [{kind: all, items: [*unix, {kind: has_modifier, modifier: listen}, {kind: has_positional_at, index: 0}]}, {kind: has_modifier, modifier: detach}]}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - name: remote_endpoint
        semantic: {kind: endpoint, endpoint_kind: socket_path, usage: generic_endpoint}
        binding: {kind: next_positional}
        cardinality: required_one
        structured_projection: {branches: [{matcher: {kind: regex_capture, pattern: '^.+$', group: 0}, target: {name: socket_path, semantic: {kind: path, role: write, purpose: generic_operand}}}]}
    stream_contract: {stdin_mode: declared_effects, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects:
      - {kind: listen_network, target: {kind: network_listener, host: {slot: bind_host}, unix_socket: {slot: socket_path}}}
      - {kind: write_path, target: {kind: slot, name: socket_path}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_endpoint}, input_scope: {slots: [remote_endpoint], stdin: true}}

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [-h, --help, --version]}, ends_option_scope: true}
  - {id: listen, matcher: {kind: any_flag, flags: [-l, --listen]}}
  - {id: unix_socket, matcher: {kind: any_flag, flags: [-U]}}
  - {id: udp, matcher: {kind: any_flag, flags: [-u]}}
  - {id: scan, matcher: {kind: any_flag, flags: [-z]}}
  - {id: detach, matcher: {kind: any_flag, flags: [-d]}}
  - id: ambiguous_exec
    matcher: {kind: any_flag, flags: [-e, --exec, --sh-exec]}
    parameters: [{name: wrapped_command, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: ambiguous_tls, matcher: {kind: any_flag, flags: [-c]}}
  - id: values
    matcher: {kind: any_flag, flags: [-w, --wait, -q, -i, -p, -s, -I, -O, -W, -M, -m, -T, -V, -X, -x, -P]}
    parameters: [{name: option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - {id: ordinary, matcher: {kind: any_flag, flags: ['-4', '-6', -b, -D, -k, -N, -n, -r, -S, -t, -v]}}
extensions:
  caushell.profile/sources: [https://man.openbsd.org/nc.1]
  caushell.profile/known_limitations:
    - nc/netcat execution and TLS switches vary across implementations; ambiguous -e/-c surfaces require approval rather than being treated as Ncat shell strings.
    - UNIX datagram temporary sockets and undeclared dialect-specific forms remain unresolved.
