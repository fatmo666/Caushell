dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: dig
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: dns_query
    selector:
      kind: all
      items: []
    parameters:
      - name: query_file
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: following_flag
          flag: "-f"
          operand_mode: next_arg
        cardinality: optional_one
      - name: port
        semantic:
          kind: structured_value
          context: numeric_quantity
        binding:
          kind: following_flag
          flag: "-p"
          operand_mode: next_arg
        cardinality: optional_one
      - name: query_target
        semantic:
          kind: endpoint
          endpoint_kind: host_port
          usage: upload_target
        binding:
          kind: args_with_prefix
          prefix: "@"
        cardinality: optional_one
      - name: dig_options
        semantic:
          kind: plain_value
        binding:
          kind: args_with_prefix
          prefix: "+"
        cardinality: optional_many
      - name: query_names
        semantic:
          kind: plain_value
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: query_file
      - kind: network_endpoint
        target:
          kind: slot
          name: query_target
      - kind: transform_data
        target:
          kind: none

modifiers: []
subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
  caushell.profile/known_limitations:
    - When no explicit @server argument is present, the system resolver is not materialized as a NetworkEndpoint.
    - Arguments consumed by other options that take values, such as -k or -y, may remain classified as query_names.
