dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: asterisk, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: remote_cli
    selector: {kind: any, items: [{kind: has_flag, flag: -r}, {kind: has_flag, flag: -R}]}
    parameters: []
    effects: [{kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: line_editor, requires_tty: true, capabilities: [spawn_shell, run_command]}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: version
    selector: {kind: has_flag, flag: -V}
    parameters: []
    effects: []
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
  - id: other_asterisk_mode
    selector: {kind: all, items: [{kind: not, item: {kind: has_flag, flag: -r}}, {kind: not, item: {kind: has_flag, flag: -R}}, {kind: not, item: {kind: has_flag, flag: -V}}]}
    parameters: []
    effects: []
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - id: remote_console
    matcher: {kind: any_flag, flags: [-r, -R]}
    parameters: []
  - id: version
    matcher: {kind: any_flag, flags: [-V]}
    parameters: []
subcommands: null
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/asterisk (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://docs.asterisk.org/Operation/Running-Asterisk/", "https://docs.asterisk.org/Deployment/Troubleshooting/Unable-to-connect-to-remote-Asterisk/"]
  caushell.profile/known_limitations: ["The source -r attaches to an already-running server; the CLI socket must exist and be accessible. Starting the daemon is not part of this form.", "The native Asterisk CLI input !/bin/sh is outside shell argv and is represented as an escape surface only. Server command effects and CLI input are opaque."]
