{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "swapon",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "linux"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "show_swap",
      "selector": {
        "kind": "any",
        "items": [
          {
            "kind": "no_positional_args"
          },
          {
            "kind": "has_modifier",
            "modifier": "show"
          },
          {
            "kind": "has_modifier",
            "modifier": "summary"
          },
          {
            "kind": "has_modifier",
            "modifier": "information"
          }
        ]
      },
      "remaining_selector": {
        "kind": "no_positional_args"
      },
      "parameters": [],
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "show",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "--show"
        ]
      }
    },
    {
      "id": "summary",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-s",
          "--summary"
        ]
      }
    },
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "--output-all",
          "--noheadings",
          "--raw",
          "--bytes"
        ]
      }
    },
    {
      "id": "information",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-h",
          "--help",
          "-V",
          "--version"
        ]
      }
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/source_research": [
      "https://github.com/util-linux/util-linux/blob/v2.40/sys-utils/swapon.c"
    ],
    "caushell.profile/review_scope": "Finite audited query modes only. No all-argv effect envelope, invented output shape, or exemption for unknown controls. Unreviewed modes remain unresolved."
  }
}
