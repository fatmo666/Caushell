dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: yarn
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: show_help
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
  - id: exec_child
    selector: {kind: all, items: [{kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: exec}}, {kind: has_positional_at, index: 1}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
    parameters:
      - {name: operation, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: child_argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    effects: [{kind: dispatch_command, target: {kind: dispatch, command: child_command, argv: [child_argv], stdout_to_parent: true}}]
  - id: package_script_or_install
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: information}}
        - {kind: not, item: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: exec}}}
    parameters:
      - name: arguments
        semantic:
          kind: plain_value
        binding:
          kind: remaining_args
        cardinality: optional_many
    effects:
      - kind: load_config
        target:
          kind: tool_convention_path
          path: package.json
          convention: node.package_manifest
          purpose: task_config
      - kind: execute_config_defined_task
        target:
          kind: none

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [-h, --help, -v, --version]}}
  - {id: ignore_install_scripts, matcher: {kind: any_flag, flags: [--ignore-scripts]}}
  - {id: install_flag, matcher: {kind: any_flag, flags: [--frozen-lockfile, --immutable, --non-interactive, --offline, --ignore-engines, --ignore-optional, --production]}}
  - id: task_shell
    matcher: {kind: any_flag, flags: [--script-shell]}
    parameters:
      - {name: task_shell, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
  - id: cwd
    matcher:
      kind: any_flag
      flags:
        - "--cwd"
    parameters:
      - name: working_directory
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_one
    effects:
      - {kind: set_execution_working_directory, target: {kind: configured_path, sources: [{slot: working_directory, projection: {kind: identity}}], missing: unknown}}

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
  caushell.profile/known_limitations:
    - Explicit exec argv is dispatched without parsing child flags as Yarn flags. Other subcommands retain package-defined task semantics.
