dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: links
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
- id: display_file_in_tui
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 0
        matcher:
          kind: regex_pattern
          pattern: "^[A-Za-z][A-Za-z0-9+.-]*:"
  parameters:
  - name: input_paths
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
    value_constraints:
    - kind: exclude_literal
      value: "-"
  effects:
  - kind: read_path
    target:
      kind: slot
      name: input_paths
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers: []
subcommands:
extensions:
  caushell.profile/source_research:
  - https://links.twibright.com/user_en.html
  - 'GTFOBins fixed snapshot acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/links
    file-read'
  caushell.profile/known_limitations:
  - Models file operands as reads; TUI interaction
  - URL handling
  - and terminal output are opaque.
  - Declared local-file forms accept one path. URI-shaped operands and additional
    resources remain unsupported instead of becoming fabricated workspace paths.
