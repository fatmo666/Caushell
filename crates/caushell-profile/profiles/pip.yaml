dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: pip
  module_entrypoints: [{runtime: python, name: pip}]
  aliases:
    - pip3

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms: []
modifiers: []

subcommands:
  roots:
    - name: install
      option_scope: permuted_options
      aliases: []
      forms:
        - id: show_help
          selector: {kind: has_modifier, modifier: information}
          parameters: [{name: help_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
        - id: preview_install
          selector: {kind: all, items: [{kind: has_modifier, modifier: preview}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
          parameters: &package_parameters
            - name: package_specs
              semantic: {kind: package_locator, manager: pip, locator_kinds: [registry_ref, local_path, direct_url, vcs_url, unknown_dynamic]}
              binding: {kind: remaining_positionals}
              cardinality: optional_many
          effects:
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: package_specs}}
        - id: install_packages
          selector:
            kind: all
            items:
              - {kind: not, item: {kind: has_modifier, modifier: information}}
              - {kind: not, item: {kind: has_modifier, modifier: preview}}
              - kind: any
                items:
                  - {kind: has_positional_at, index: 0}
                  - {kind: has_modifier, modifier: requirement_file}
                  - {kind: has_modifier, modifier: editable_package}
          parameters: *package_parameters
          effects:
            - kind: write_path
              target:
                kind: configured_path
                sources:
                  - {slot: target_directory, projection: {kind: identity}}
                  - {slot: root_directory, projection: {kind: identity}}
                  - {slot: prefix_directory, projection: {kind: identity}}
                environment: {name: PIP_TARGET, empty_is_unset: true}
                missing: unknown
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
      modifiers:
        - id: report
          matcher: {kind: any_flag, flags: [--report]}
          parameters:
            - {name: report_operand, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: literal, value: '-'}, target: null}], fallback: {name: report_path, semantic: {kind: path, role: write, purpose: generic_operand}}}}
          effects: [{kind: write_path, target: {kind: slot, name: report_path}}]
        - {id: information, matcher: {kind: any_flag, flags: [-h, --help]}}
        - {id: preview, matcher: {kind: any_flag, flags: [--dry-run]}}
        - {id: install_flags, matcher: {kind: any_flag, flags: [--break-system-packages, --user, --no-user, --no-deps, --upgrade, -U, --force-reinstall, --ignore-installed, --no-build-isolation, --no-compile, --compile, --require-hashes, --no-cache-dir, --quiet, -q, --verbose, -v, --no-index, --disable-pip-version-check]}}
        - id: install_values
          matcher: {kind: any_flag, flags: [--index-url, -i, --extra-index-url, --find-links, -f, --constraint, -c, --config-settings, -C, --only-binary, --no-binary, --cache-dir, --python, --platform, --python-version]}
          parameters: [{name: install_option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: prefix_directory
          matcher: {kind: any_flag, flags: [--prefix]}
          parameters: [{name: prefix_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: root_directory
          matcher: {kind: any_flag, flags: [--root]}
          parameters: [{name: root_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: requirement_file
          matcher:
            kind: any_flag
            flags:
              - "-r"
              - "--requirement"
          parameters:
            - name: requirement_files
              semantic:
                kind: package_locator
                manager: pip
                locator_kinds:
                  - requirement_file
                  - direct_url
                  - unknown_dynamic
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: requirement_files
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: requirement_files
          effects_when: {unless_modifiers: [information]}

        - id: editable_package
          matcher:
            kind: any_flag
            flags:
              - "-e"
              - "--editable"
          parameters:
            - name: editable_specs
              semantic:
                kind: package_locator
                manager: pip
                locator_kinds:
                  - local_path
                  - vcs_url
                  - direct_url
                  - unknown_dynamic
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: optional_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: editable_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: editable_specs
          effects_when: {unless_modifiers: [information]}

        - id: target_directory
          matcher:
            kind: any_flag
            flags:
              - "--target"
              - "-t"
          parameters:
            - name: target_directory
              semantic:
                kind: plain_value
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: config
      aliases: []
      forms: []
      modifiers:
        - id: editor
          matcher: {kind: any_flag, flags: [--editor]}
          parameters:
            - {name: editor_command, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}
      children:
        - name: edit
          aliases: []
          forms:
            - id: edit_configuration
              selector: {kind: all, items: []}
              effects:
                - {kind: write_path, target: {kind: none}}
                # pip invokes the editor string using shell=True. The config
                # filename is runtime-selected; do not invent a local path.
                - {kind: dispatch_command, target: {kind: dispatch, command_string: {slot: editor_command, syntax: posix_shell}}}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
      default_behavior: reject_unknown
      extensions: {}

extensions:
  caushell.profile/known_limitations:
    - This first slice models `pip install <package_specs...>`, `pip install -r/--requirement <file>`, editable installs, and explicit --target writes.
    - Explicit target/root/prefix bounds are modeled; default interpreter installation discovery remains unknown. --break-system-packages is permission to bypass an environment check, not proof of a system destination. No interpreter or environment is probed.
