dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: pip
  module_entrypoints: [{runtime: python, name: pip}]
  aliases:
    - pip3

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: global_information}
    parameters: [{name: information_tail, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
modifiers:
  - {id: global_information, matcher: {kind: any_flag, flags: [--help, -h, --version, -V]}}
  - {id: global_read_switches, matcher: {kind: any_flag, flags: [--isolated, --no-color, --no-input, --quiet, -q, --verbose, -v]}}
  - {id: disable_version_check, matcher: {kind: any_flag, flags: [--disable-pip-version-check]}}
  - id: log_path
    matcher: {kind: any_flag, flags: [--log]}
    parameters: [{name: log_path, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
    effects: [{kind: write_path, target: {kind: slot, name: log_path}}]

subcommands:
  roots:
    - name: list
      option_scope: permuted_options
      forms:
        - id: inspect_installed_environment
          selector: {kind: not, item: {kind: has_modifier, modifier: disable_version_check}}
          parameters: []
          # Without native config evidence, update checks retain unknown network/cache effects.
          effects:
            - {kind: network_endpoint, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
        - id: inspect_without_update_check
          selector: {kind: has_modifier, modifier: disable_version_check}
          parameters: []
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
      modifiers:
        - {id: reporting, matcher: {kind: any_flag, flags: [--local, --user, --editable, --exclude-editable, --include-editable, --not-required, --all, --files, -f, --verbose, -v, --quiet, -q]}}
        - id: output_format
          matcher: {kind: any_flag, flags: [--format, --exclude]}
          parameters: [{name: output_setting, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: installed_path
          matcher: {kind: any_flag, flags: [--path]}
          parameters: [{name: installed_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: installed_path}}]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: show
      option_scope: permuted_options
      forms:
        - id: inspect_installed_environment
          selector: {kind: not, item: {kind: has_modifier, modifier: disable_version_check}}
          parameters: [{name: packages, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
          # Without native config evidence, update checks retain unknown network/cache effects.
          effects:
            - {kind: network_endpoint, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
        - id: inspect_without_update_check
          selector: {kind: has_modifier, modifier: disable_version_check}
          parameters: [{name: packages, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
      modifiers:
        - {id: reporting, matcher: {kind: any_flag, flags: [--local, --user, --editable, --exclude-editable, --include-editable, --not-required, --all, --files, -f, --verbose, -v, --quiet, -q]}}
        - id: output_format
          matcher: {kind: any_flag, flags: [--format, --exclude]}
          parameters: [{name: output_setting, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: installed_path
          matcher: {kind: any_flag, flags: [--path]}
          parameters: [{name: installed_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: installed_path}}]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: freeze
      option_scope: permuted_options
      forms:
        - id: inspect_installed_environment
          selector: {kind: not, item: {kind: has_modifier, modifier: disable_version_check}}
          parameters: []
          # Without native config evidence, update checks retain unknown network/cache effects.
          effects:
            - {kind: network_endpoint, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
        - id: inspect_without_update_check
          selector: {kind: has_modifier, modifier: disable_version_check}
          parameters: []
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
      modifiers:
        - {id: reporting, matcher: {kind: any_flag, flags: [--local, --user, --editable, --exclude-editable, --include-editable, --not-required, --all, --files, -f, --verbose, -v, --quiet, -q]}}
        - id: output_format
          matcher: {kind: any_flag, flags: [--format, --exclude]}
          parameters: [{name: output_setting, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: installed_path
          matcher: {kind: any_flag, flags: [--path]}
          parameters: [{name: installed_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: installed_path}}]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: check
      option_scope: permuted_options
      forms:
        - id: inspect_installed_environment
          selector: {kind: not, item: {kind: has_modifier, modifier: disable_version_check}}
          parameters: []
          # Without native config evidence, update checks retain unknown network/cache effects.
          effects:
            - {kind: network_endpoint, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
        - id: inspect_without_update_check
          selector: {kind: has_modifier, modifier: disable_version_check}
          parameters: []
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
      modifiers:
        - {id: reporting, matcher: {kind: any_flag, flags: [--local, --user, --editable, --exclude-editable, --include-editable, --not-required, --all, --files, -f, --verbose, -v, --quiet, -q]}}
        - id: output_format
          matcher: {kind: any_flag, flags: [--format, --exclude]}
          parameters: [{name: output_setting, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: installed_path
          matcher: {kind: any_flag, flags: [--path]}
          parameters: [{name: installed_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: installed_path}}]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: inspect
      option_scope: permuted_options
      forms:
        - id: inspect_installed_environment
          selector: {kind: not, item: {kind: has_modifier, modifier: disable_version_check}}
          parameters: []
          # Without native config evidence, update checks retain unknown network/cache effects.
          effects:
            - {kind: network_endpoint, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
        - id: inspect_without_update_check
          selector: {kind: has_modifier, modifier: disable_version_check}
          parameters: []
          stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
      modifiers:
        - {id: reporting, matcher: {kind: any_flag, flags: [--local, --user, --editable, --exclude-editable, --include-editable, --not-required, --all, --files, -f, --verbose, -v, --quiet, -q]}}
        - id: output_format
          matcher: {kind: any_flag, flags: [--format, --exclude]}
          parameters: [{name: output_setting, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: installed_path
          matcher: {kind: any_flag, flags: [--path]}
          parameters: [{name: installed_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: installed_path}}]
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: install
      option_scope: permuted_options
      aliases: []
      forms:
        - id: show_help
          selector: {kind: has_modifier, modifier: information}
          parameters: [{name: help_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
        - id: preview_install
          selector: {kind: all, items: [{kind: has_modifier, modifier: preview}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
          parameters: &package_parameters
            - name: package_specs
              semantic: {kind: package_locator, manager: pip, locator_kinds: [registry_ref, local_path, direct_url, vcs_url, unknown_dynamic]}
              binding: {kind: remaining_positionals}
              cardinality: optional_many
          effects:
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: package_specs}}
        - id: install_packages
          selector:
            kind: all
            items:
              - {kind: not, item: {kind: has_modifier, modifier: information}}
              - {kind: not, item: {kind: has_modifier, modifier: preview}}
              - kind: any
                items:
                  - {kind: has_positional_at, index: 0}
                  - {kind: has_modifier, modifier: requirement_file}
                  - {kind: has_modifier, modifier: editable_package}
          parameters: *package_parameters
          effects:
            - kind: write_path
              target:
                kind: configured_path
                sources:
                  - {slot: target_directory, projection: {kind: identity}}
                  - {slot: root_directory, projection: {kind: identity}}
                  - {slot: prefix_directory, projection: {kind: identity}}
                environment: {name: PIP_TARGET, empty_is_unset: true}
                missing: unknown
            - kind: import_package
              target:
                kind: slot
                name: package_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: package_specs
      modifiers:
        - id: report
          matcher: {kind: any_flag, flags: [--report]}
          parameters:
            - {name: report_operand, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: literal, value: '-'}, target: null}], fallback: {name: report_path, semantic: {kind: path, role: write, purpose: generic_operand}}}}
          effects: [{kind: write_path, target: {kind: slot, name: report_path}}]
        - {id: information, matcher: {kind: any_flag, flags: [-h, --help]}}
        - {id: preview, matcher: {kind: any_flag, flags: [--dry-run]}}
        - {id: install_flags, matcher: {kind: any_flag, flags: [--break-system-packages, --user, --no-user, --no-deps, --upgrade, -U, --force-reinstall, --ignore-installed, --no-build-isolation, --no-compile, --compile, --require-hashes, --no-cache-dir, --quiet, -q, --verbose, -v, --no-index]}}
        - id: install_values
          matcher: {kind: any_flag, flags: [--index-url, -i, --extra-index-url, --find-links, -f, --constraint, -c, --config-settings, -C, --only-binary, --no-binary, --cache-dir, --python, --platform, --python-version]}
          parameters: [{name: install_option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: prefix_directory
          matcher: {kind: any_flag, flags: [--prefix]}
          parameters: [{name: prefix_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: root_directory
          matcher: {kind: any_flag, flags: [--root]}
          parameters: [{name: root_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: requirement_file
          matcher:
            kind: any_flag
            flags:
              - "-r"
              - "--requirement"
          parameters:
            - name: requirement_files
              semantic:
                kind: package_locator
                manager: pip
                locator_kinds:
                  - requirement_file
                  - direct_url
                  - unknown_dynamic
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: requirement_files
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: requirement_files
          effects_when: {unless_modifiers: [information]}

        - id: editable_package
          matcher:
            kind: any_flag
            flags:
              - "-e"
              - "--editable"
          parameters:
            - name: editable_specs
              semantic:
                kind: package_locator
                manager: pip
                locator_kinds:
                  - local_path
                  - vcs_url
                  - direct_url
                  - unknown_dynamic
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: optional_many
          effects:
            - kind: import_package
              target:
                kind: slot
                name: editable_specs
            - kind: execute_imported_package_logic
              target:
                kind: slot
                name: editable_specs
          effects_when: {unless_modifiers: [information]}

        - id: target_directory
          matcher:
            kind: any_flag
            flags:
              - "--target"
              - "-t"
          parameters:
            - name: target_directory
              semantic:
                kind: plain_value
              binding:
                kind: following_matched_flag
                operand_mode: next_arg
              cardinality: required_many
      children: []
      default_behavior: reject_unknown
      extensions: {}


    - name: download
      option_scope: permuted_options
      forms:
        - id: show_help
          selector: {kind: has_modifier, modifier: information}
          parameters: [{name: information_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
        - id: collect_distributions
          operation_semantics_unresolved: true
          selector: {kind: not, item: {kind: has_modifier, modifier: information}}
          parameters: *package_parameters
          effects:
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: package_specs}}
            - kind: write_path
              target:
                kind: configured_path
                sources: [{slot: output_directory, projection: {kind: identity}}]
                environment: {name: PIP_DEST, empty_is_unset: true}
                missing: unknown
            # Metadata/backend execution and native config/cache effects are
            # independent of the requested output directory. Never infer that
            # a download avoids code execution or that --no-deps disables it.
            - {kind: load_config, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
      modifiers:
        - id: output_directory
          matcher: {kind: any_flag, flags: [-d, --dest]}
          parameters: [{name: output_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]

        - {id: information, matcher: {kind: any_flag, flags: [-h, --help]}}
        - {id: package_flags, matcher: {kind: any_flag, flags: [--no-deps, --pre, --prefer-binary, --require-hashes, --no-require-hashes, --no-build-isolation, --check-build-dependencies, --ignore-requires-python, --no-clean, --no-cache-dir, --no-index, --quiet, -q, --verbose, -v, --no-input, --disable-pip-version-check]}}
        - id: package_options
          matcher: {kind: any_flag, flags: [--index-url, -i, --extra-index-url, --find-links, -f, --only-binary, --no-binary, --config-settings, -C, --platform, --python-version, --implementation, --abi, --progress-bar, --src, --cache-dir, --trusted-host, --timeout, --retries, --cert, --client-cert, --proxy]}
          parameters: [{name: package_option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: requirement_files
          matcher: {kind: any_flag, flags: [-r, --requirement, -c, --constraint, --build-constraint]}
          parameters: [{name: requirement_files, semantic: {kind: package_locator, manager: pip, locator_kinds: [requirement_file, direct_url, unknown_dynamic]}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects:
            - {kind: import_package, target: {kind: slot, name: requirement_files}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: requirement_files}}
          effects_when: {unless_modifiers: [information]}
        - id: editable_packages
          matcher: {kind: any_flag, flags: [-e, --editable]}
          parameters: [{name: editable_specs, semantic: {kind: package_locator, manager: pip, locator_kinds: [local_path, vcs_url, direct_url, unknown_dynamic]}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects:
            - {kind: import_package, target: {kind: slot, name: editable_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: editable_specs}}
          effects_when: {unless_modifiers: [information]}
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: wheel
      option_scope: permuted_options
      forms:
        - id: show_help
          selector: {kind: has_modifier, modifier: information}
          parameters: [{name: information_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
        - id: build_wheels
          operation_semantics_unresolved: true
          selector: {kind: not, item: {kind: has_modifier, modifier: information}}
          parameters: *package_parameters
          effects:
            - {kind: import_package, target: {kind: slot, name: package_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: package_specs}}
            - kind: write_path
              target:
                kind: configured_path
                sources: [{slot: output_directory, projection: {kind: identity}}]
                environment: {name: PIP_WHEEL_DIR, empty_is_unset: true}
                missing: unknown
            # Metadata/backend execution and native config/cache effects are
            # independent of the requested output directory. Never infer that
            # a download avoids code execution or that --no-deps disables it.
            - {kind: load_config, target: {kind: none}}
            - {kind: write_path, target: {kind: none}}
      modifiers:
        - id: output_directory
          matcher: {kind: any_flag, flags: [-w, --wheel-dir]}
          parameters: [{name: output_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]

        - {id: information, matcher: {kind: any_flag, flags: [-h, --help]}}
        - {id: package_flags, matcher: {kind: any_flag, flags: [--no-deps, --pre, --prefer-binary, --require-hashes, --no-require-hashes, --no-build-isolation, --check-build-dependencies, --ignore-requires-python, --no-clean, --no-cache-dir, --no-index, --quiet, -q, --verbose, -v, --no-input, --disable-pip-version-check]}}
        - id: package_options
          matcher: {kind: any_flag, flags: [--index-url, -i, --extra-index-url, --find-links, -f, --only-binary, --no-binary, --config-settings, -C, --platform, --python-version, --implementation, --abi, --progress-bar, --src, --cache-dir, --trusted-host, --timeout, --retries, --cert, --client-cert, --proxy]}
          parameters: [{name: package_option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
        - id: requirement_files
          matcher: {kind: any_flag, flags: [-r, --requirement, -c, --constraint, --build-constraint]}
          parameters: [{name: requirement_files, semantic: {kind: package_locator, manager: pip, locator_kinds: [requirement_file, direct_url, unknown_dynamic]}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects:
            - {kind: import_package, target: {kind: slot, name: requirement_files}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: requirement_files}}
          effects_when: {unless_modifiers: [information]}
        - id: editable_packages
          matcher: {kind: any_flag, flags: [-e, --editable]}
          parameters: [{name: editable_specs, semantic: {kind: package_locator, manager: pip, locator_kinds: [local_path, vcs_url, direct_url, unknown_dynamic]}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
          effects:
            - {kind: import_package, target: {kind: slot, name: editable_specs}}
            - {kind: execute_imported_package_logic, target: {kind: slot, name: editable_specs}}
          effects_when: {unless_modifiers: [information]}
      children: []
      default_behavior: reject_unknown
      extensions: {}

    - name: config
      option_scope: permuted_options
      aliases: []
      forms: []
      modifiers:
        - {id: file_scope, matcher: {kind: any_flag, flags: [--user, --global, --site]}}
        - id: editor
          matcher: {kind: any_flag, flags: [--editor]}
          parameters:
            - {name: editor_command, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}
      children:
        - name: list
          forms:
            - id: inspect_configuration
              selector: {kind: all, items: []}
              parameters: [{name: configuration_keys, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
              stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
        - name: debug
          forms:
            - id: inspect_configuration
              selector: {kind: all, items: []}
              parameters: [{name: configuration_keys, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
              stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
        - name: get
          forms:
            - id: inspect_configuration
              selector: {kind: all, items: []}
              parameters: [{name: configuration_keys, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
              stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
        - name: set
          option_scope: permuted_options
          forms:
            - id: rewrite_configuration
              operation_semantics_unresolved: true
              selector: {kind: exact_positional_count, count: 2}
              parameters: [{name: configuration_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}]
              # Selection depends on native user/global/site configuration and
              # virtualenv file existence. PIP_CONFIG_FILE is not a write path.
              effects:
                - {kind: load_config, target: {kind: none}}
                - {kind: write_path, target: {kind: none}}
          modifiers:
            - {id: file_scope, matcher: {kind: any_flag, flags: [--user, --global, --site]}}
          children: []
          default_behavior: reject_unknown
          extensions: {}
        - name: unset
          option_scope: permuted_options
          forms:
            - id: rewrite_configuration
              operation_semantics_unresolved: true
              selector: {kind: exact_positional_count, count: 1}
              parameters: [{name: configuration_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}]
              # Selection depends on native user/global/site configuration and
              # virtualenv file existence. PIP_CONFIG_FILE is not a write path.
              effects:
                - {kind: load_config, target: {kind: none}}
                - {kind: write_path, target: {kind: none}}
          modifiers:
            - {id: file_scope, matcher: {kind: any_flag, flags: [--user, --global, --site]}}
          children: []
          default_behavior: reject_unknown
          extensions: {}
        - name: edit
          aliases: []
          forms:
            - id: edit_configuration
              selector: {kind: all, items: []}
              effects:
                - {kind: write_path, target: {kind: none}}
                # pip invokes the editor string using shell=True. The config
                # filename is runtime-selected; do not invent a local path.
                - {kind: dispatch_command, target: {kind: dispatch, command_string: {slot: editor_command, syntax: posix_shell}}}
          modifiers: []
          children: []
          default_behavior: reject_unknown
          extensions: {}
      default_behavior: reject_unknown
      extensions: {}

extensions:
  caushell.profile/known_limitations:
    - Install, download, wheel and configuration mutation forms retain native package/backend and unknown config/cache effects. Download is not a guarantee of no build execution; --no-deps is not a backend-execution disable switch.
    - Config set/unset select native files; --user/--global/--site and PIP_CONFIG_FILE do not prove a filesystem destination. Unsupported controls retain partial effects and approval.
    - Explicit target/root/prefix bounds are modeled; default interpreter installation discovery remains unknown. --break-system-packages is permission to bypass an environment check, not proof of a system destination. No interpreter or environment is probed.
