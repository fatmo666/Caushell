dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: gcloud, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos, windows], shell_families: [], requires_features: []}
option_scope: leading_options
opaque_on_unresolved: true
forms:
  - id: help_search_with_pager
    selector: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: help}}
    parameters: [{name: help_terms, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    effects: [{kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: pager, requires_tty: true, capabilities: [spawn_shell, run_command, launch_external_editor]}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: information
    selector: {kind: has_modifier, modifier: information}
modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, -h, --version, -v]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/gcloud (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://docs.cloud.google.com/sdk/gcloud/reference/help", "https://docs.cloud.google.com/sdk/gcloud/reference/topic/command-conventions"]
  caushell.profile/known_limitations:
    - The documented gcloud help display uses the environment's default pager when one is configured; the profile records a possible native pager surface and does not invent an executed pager command or shell argv.
    - Cloud credentials, configuration, network actions, command-specific effects, and pager choice are environment dependent and are not inferred.
