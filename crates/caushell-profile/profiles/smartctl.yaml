dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: smartctl, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true

forms:
  - id: report_device_health
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: report}
        - {kind: exact_positional_count, count: 1}
        - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^/dev/(?:[^/]+/)*[^/]+$'}}
    remaining_selector: {kind: no_positional_args}
    parameters:
      - {name: device, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}
    # Opening a device can probe its transport. The selected protocol and
    # optional drive database paths depend on the runtime and build.
    operation_semantics_unresolved: true
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: device}}
      - {kind: load_config, target: {kind: configured_path, sources: [], missing: unknown, purpose: tool_config}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: report, matcher: {kind: any_flag, flags: [-a, --all]}}

extensions:
  caushell.profile/source_research:
    - https://github.com/smartmontools/smartmontools/blob/RELEASE_7_3/smartmontools/smartctl.cpp
    - https://github.com/smartmontools/smartmontools/blob/RELEASE_7_3/smartmontools/smartctl.8.in
  caushell.profile/known_limitations:
    - Modeled argv is limited to the SMART report with one explicit Linux device path. Device type detection, power effects, drive database paths, simulated stdin input, and other modes remain unresolved.
