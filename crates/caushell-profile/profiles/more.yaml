dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: more
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

# Some systems ship less under this command name. Its input-file hooks may
# run before output is copied to a pipe. Model them as native control data
# without substituting the filename or reconstructing the command template.
environment_inputs:
  - name: input_preprocessor
    environment: {name: LESSOPEN, empty_is_unset: true}
    require_observation: true
    semantic: &input_hook {kind: payload, language: opaque, source: dynamic_reference, recursive: true}
  - name: input_postprocessor
    environment: {name: LESSCLOSE, empty_is_unset: true}
    require_observation: true
    semantic: *input_hook

forms:
  - id: interactive_read
    selector:
      kind: all
      items: []
    parameters:
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: opaque
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: input_paths
      - kind: open_interactive_escape_surface
        target:
          kind: none
        surface:
          kind: pager
          requires_tty: true
          capabilities:
            - spawn_shell

modifiers: []
subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/D4-security-bash/analysis.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
    - https://github.com/apple-oss-distributions/less/blob/main/less/main.c
    - https://github.com/apple-oss-distributions/less/blob/main/less/filename.c
    - https://kernel.googlesource.com/pub/scm/utils/util-linux/util-linux/+/refs/tags/v2.41.3/text-utils/more.c
  caushell.profile/known_limitations:
    - FILE value "-" is treated as a non-path stdin sentinel, but the profile does not yet materialize mixed stdin-plus-file input as an explicit implicit input fact.
    - The profile does not determine whether more is standalone or less-compatible, resolve lesskey files, or prove that input preprocessing was disabled or used. LESSCLOSE is conservatively retained when present.
