dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: xz, aliases: []}
trust: {tier: tier_a, source: built_in}
platform:
  os_families: [posix, linux, macos]
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: compress_stdout_files
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: stdout}
        - {kind: not, item: {kind: has_modifier, modifier: decompress}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: decompress_stdout_stdin
    selector: {kind: all, items: [{kind: has_modifier, modifier: decompress}, {kind: no_positional_args}]}
    parameters: []
    effects:
      - {kind: consume_stdin, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: compress_stdout_stdin
    selector: {kind: all, items: [{kind: has_modifier, modifier: stdout}, {kind: not, item: {kind: has_modifier, modifier: decompress}}, {kind: no_positional_args}]}
    parameters: []
    effects:
      - {kind: consume_stdin, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: compress_stdout_dash
    selector: {kind: all, items: [{kind: has_modifier, modifier: stdout}, {kind: not, item: {kind: has_modifier, modifier: decompress}}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}
    parameters: [{name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: required_one}]
    effects:
      - {kind: consume_stdin, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: decompress_stdout_files
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: stdout}
        - {kind: has_modifier, modifier: decompress}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: compress_file_default
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: stdout}}
        - {kind: not, item: {kind: has_modifier, modifier: decompress}}
        - {kind: not, item: {kind: has_modifier, modifier: keep}}
        - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - {kind: not, item: {kind: has_modifier, modifier: recursive}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: append_suffix, suffix: '.xz'}, purpose: generic_operand}}
      - {kind: delete_path, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: compress_file_keep
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: stdout}}
        - {kind: not, item: {kind: has_modifier, modifier: decompress}}
        - {kind: has_modifier, modifier: keep}
        - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - {kind: not, item: {kind: has_modifier, modifier: recursive}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: append_suffix, suffix: '.xz'}, purpose: generic_operand}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: compress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: decompress_file_xz_suffix
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: decompress}
        - {kind: not, item: {kind: has_modifier, modifier: stdout}}
        - {kind: not, item: {kind: has_modifier, modifier: keep}}
        - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - {kind: not, item: {kind: has_modifier, modifier: recursive}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '\.xz$'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: strip_suffix, suffix: '.xz'}, purpose: generic_operand}}
      - {kind: delete_path, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: decompress_file_keep_xz_suffix
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: decompress}
        - {kind: not, item: {kind: has_modifier, modifier: stdout}}
        - {kind: has_modifier, modifier: keep}
        - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - {kind: not, item: {kind: has_modifier, modifier: recursive}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '\.xz$'}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: strip_suffix, suffix: '.xz'}, purpose: generic_operand}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: decompress_file_other_suffix_unresolved
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: decompress}
        - {kind: not, item: {kind: has_modifier, modifier: stdout}}
        - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '\.xz$'}}}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: write_path, target: {kind: none}}
      - {kind: delete_path, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
modifiers:
  - {id: stdout, matcher: {kind: any_flag, flags: ['-c', '--stdout', '--to-stdout']}}
  - {id: decompress, matcher: {kind: any_flag, flags: ['-d', '--decompress', '--uncompress']}}
  - {id: keep, matcher: {kind: any_flag, flags: ['-k', '--keep']}}
  - {id: recursive, matcher: {kind: any_flag, flags: ['-r', '--recursive']}}
  - id: suffix
    matcher: {kind: any_flag, flags: ['-S', '--suffix']}
    parameters: [{name: output_suffix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
subcommands: null
extensions:
  caushell.profile/source: https://manpages.debian.org/bookworm/xz-utils/xz.1.en.html
  caushell.profile/known_limitations:
    - Default compression suffix and decompression target are modeled only for standard .xz output; custom -S, --files, --files0, recursive, --format, and multi-format names need unresolved output coverage.
