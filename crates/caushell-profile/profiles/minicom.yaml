dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: minicom, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: serial_terminal_with_script
    selector: {kind: any, items: [{kind: has_flag, flag: -S}, {kind: has_flag, flag: --script}]}
    parameters: []
    effects:
      - {kind: read_path, target: {kind: slot, name: script_read_path}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}
      - {kind: execute_payload, target: {kind: slot, name: script_path}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: serial_terminal
    selector: {kind: all, items: [{kind: not, item: {kind: has_flag, flag: -S}}, {kind: not, item: {kind: has_flag, flag: --script}}]}
    parameters: []
    effects: [{kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - id: device
    matcher: {kind: any_flag, flags: [-D]}
    parameters: [{name: device_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
  - id: setup
    matcher: {kind: any_flag, flags: [-s, --setup]}
    parameters: []
  - id: startup_script
    matcher: {kind: any_flag, flags: [-S, --script]}
    parameters:
      - name: script_path
        semantic: {kind: payload, language: opaque, source: script_file_ref, recursive: true}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: optional_one
        structured_projection:
          branches: []
          fallback: {name: script_read_path, semantic: {kind: path, role: read, purpose: generic_operand}}
subcommands: null
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/minicom (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://manpages.debian.org/testing/minicom/minicom.1.en.html", "https://manpages.debian.org/trixie/minicom/runscript.1.en.html"]
  caushell.profile/known_limitations: ["The source's first escape is entered through Minicom's native Ctrl-A menus; startup argv is minicom -D /dev/null. The second source writes a runscript-language file with shell echo redirection before starting minicom -S; these are distinct shell setup and application steps.", "The runscript file contains native ! exec /bin/sh ... input, not Bash syntax. -S executes it through Minicom's script interpreter; the file write is produced by the source shell command and the interpreter grammar is opaque here.", "Device/configuration defaults, Ctrl-A versus Meta-Z escape-key variation and TTY-dependent interactions are not modeled."]
