dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true

identity:
  canonical_name: awk
  aliases:
    - gawk
    - nawk

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: execute_program_stdin
    selector: &program_stdin {kind: has_modifier_parameter_matching, modifier: program_file, parameter: program_files, matcher: {kind: literal, value: '-'}}
    parameters:
      - &stdin_markers {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - &input_assignments {name: input_assignments, semantic: {kind: structured_value, context: env_assignment}, binding: {kind: positionals_matching, matcher: {kind: regex_pattern, pattern: '^[A-Za-z_][A-Za-z_0-9]*='}}, cardinality: optional_many}
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    implicit_inputs:
      - {source: stdin_payload, semantic: {kind: payload, language: opaque, source: stdin, recursive: true}}
    stream_contract: {stdin_mode: payload_required, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}
      - {kind: execute_payload, target: {kind: implicit_input, source: stdin_payload}}
  - id: explicit_program_transform
    selector:
      kind: all
      items:
        - {kind: not, item: *program_stdin}
        - {kind: has_modifier, modifier: inline_program}
    parameters:
      - *stdin_markers
      - *input_assignments
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    payload_projections: &explicit_awk_projection
      - &awk_projection
        format: awk_program
        source: {kind: slot, name: programs}
        reads: program_reads
        writes: program_writes
        deletes: program_deletes
        executions: program_executions
        stdout_emissions: program_stdout
        max_bytes: 65536
        max_operations: 4096
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: data
      stderr_mode: opaque
    effects:
      - &awk_reads {kind: read_path, path_access: content_open, target: {kind: slot, name: program_reads}}
      - &awk_writes {kind: write_path, path_access: content_open, target: {kind: slot, name: program_writes}, catastrophic: {semantic_class: raw_write_target}}
      - &awk_deletes {kind: delete_path, target: {kind: slot, name: program_deletes}}
      - &awk_executions {kind: execute_payload, target: {kind: slot, name: program_executions}}
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths

  - id: external_program_transform
    selector: {kind: all, items: [{kind: not, item: *program_stdin}, {kind: has_modifier, modifier: program_file}, {kind: not, item: {kind: has_modifier, modifier: inline_program}}]}
    parameters:
      - *stdin_markers
      - *input_assignments
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}]

  - id: positional_program_transform
    selector:
      kind: all
      items:
        - kind: not
          item:
            kind: any
            items:
              - kind: has_modifier
                modifier: inline_program
              - kind: has_modifier
                modifier: program_file
        - kind: has_positional_at
          index: 0
    parameters:
      - name: program
        semantic: {kind: plain_value}
        binding:
          kind: next_positional
        cardinality: required_one
      - *stdin_markers
      - *input_assignments
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    payload_projections:
      - format: awk_program
        source: {kind: slot, name: program}
        reads: program_reads
        writes: program_writes
        deletes: program_deletes
        executions: program_executions
        stdout_emissions: program_stdout
        max_bytes: 65536
        max_operations: 4096
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: data
      stderr_mode: opaque
    effects:
      - *awk_reads
      - *awk_writes
      - *awk_deletes
      - *awk_executions
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths

modifiers:
  - id: inline_program
    matcher:
      kind: any_flag
      flags:
        - "-e"
        - "--source"
    parameters:
      - name: programs
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many

  - id: program_file
    matcher:
      kind: any_flag
      flags:
        - "-f"
        - "--file"
    parameters:
      - name: program_files
        semantic:
          kind: payload
          language: opaque
          source: script_file_ref
          recursive: true
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_many
        structured_projection:
          branches: [{matcher: {kind: literal, value: '-'}, target: null}]
          fallback: {name: program_file_paths, semantic: {kind: path, role: read, purpose: script_source}}
    effects:
      - kind: read_path
        target:
          kind: slot
          name: program_file_paths
      - {kind: execute_payload, target: {kind: slot, name: program_files}}

  - id: assign_variable
    matcher:
      kind: any_flag
      flags:
        - "-v"
        - "--assign"
    parameters:
      - name: assignments
        semantic:
          kind: structured_value
          context: env_assignment
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: optional_many

  - id: field_separator
    matcher:
      kind: any_flag
      flags:
        - "-F"
        - "--field-separator"
    parameters:
      - name: field_separator
        semantic:
          kind: structured_value
          context: regex
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

subcommands: null
extensions:
  caushell.profile/known_limitations:
    - Inline programs use the bounded AWK effect decoder. External -f program contents, unsupported extensions and command execution remain unresolved executable boundaries; AWK is never parsed as Bash.
    - Named input files do not prove stdin is unused by arbitrary programs containing getline or command pipes.
