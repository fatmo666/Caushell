dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: nginx
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: executable_configuration_config_c
  selector:
    kind: all
    items:
    - kind: has_modifier
      modifier: config_c
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: configuration_payload
    semantic:
      kind: payload
      language: opaque
      source: script_file_ref
      recursive: true
    binding:
      kind: following_flag
      flag: "-c"
      operand_mode: next_arg
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: configuration_path
        semantic:
          kind: path
          role: read
          purpose: tool_config
  effects:
  - kind: read_path
    target:
      kind: slot
      name: configuration_path
  - kind: load_config
    target:
      kind: slot
      name: configuration_path
  - kind: execute_payload
    target:
      kind: slot
      name: configuration_payload
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-h"
    - "-v"
    - "-V"
- id: config_c
  matcher:
    kind: any_flag
    flags:
    - "-c"
- id: test_config
  matcher:
    kind: any_flag
    flags:
    - "-t"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/nginx (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://nginx.org/en/docs/ngx_core_module.html
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Alternatively, the `ssl_engine` directive can be used.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
