dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: zgrep, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
forms:
  - id: search_explicit_files
    selector: {kind: has_positional_at, index: 1}
    parameters:
      - {name: pattern, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: [{kind: read_path, target: {kind: slot, name: input_paths}}]
  - id: search_stdin
    selector: {kind: all, items: [{kind: has_positional_at, index: 0}, {kind: not, item: {kind: has_positional_at, index: 1}}]}
    parameters:
      - {name: pattern, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
extensions:
  caushell.profile/source_research:
    - https://www.gnu.org/software/grep/manual/grep.html
  caushell.profile/known_limitations:
    - The pinned GTFOBins example text says grep, not zgrep. The source materialization proposal preserves that original text and separately supplies a zgrep prototype. This profile models zgrep invocations only; it does not claim that running the original grep text exercises zgrep.
    - zgrep decompresses supported compressed inputs before grep-style matching. Filename suffix dispatch, decompressor behavior, recursive directories, and option-dependent output are not inferred. Only explicit file operands are modeled.
