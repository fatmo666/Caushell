# Ncat semantics are separate from implementation-dependent nc/netcat.
# Reused anchors share transport, stream and effect declarations across IO modes.
dsl_version: "caushell.profile/v1alpha1"
kind: "command_profile"
option_scope: "permuted_options"
opaque_on_unresolved: true
identity: {"canonical_name":"ncat","aliases":[]}
trust: {"tier":"tier_a","source":"built_in"}
platform: {"os_families":["posix","linux","macos"],"shell_families":[],"requires_features":[]}
forms:
  - id: "show_help"
    selector: {"kind":"has_modifier","modifier":"information"}
    parameters: [{"name":"ignored_arguments","semantic":{"kind":"plain_value"},"binding":{"kind":"remaining_args"},"cardinality":"optional_many"}]
    stream_contract: {"stdin_mode":"ignored","stdout_mode":"data","stderr_mode":"opaque","stdout_dependency":"independent","stderr_dependency":"independent"}
  - id: "unix_datagram"
    selector: {"kind":"all","items":[{"kind":"not","item":{"kind":"has_modifier","modifier":"information"}},{"kind":"has_modifier","modifier":"unix_socket"},{"kind":"has_modifier","modifier":"udp"}]}
    operation_semantics_unresolved: true
    parameters: [{"name":"operands","semantic":{"kind":"plain_value"},"binding":{"kind":"remaining_positionals"},"cardinality":"optional_many"}]
  - id: "connect_session"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - &connect_transport {"kind":"all","items":[{"kind":"not","item":{"kind":"has_modifier","modifier":"listen"}},{"kind":"not","item":{"kind":"has_modifier","modifier":"unix_socket"}},{"kind":"has_positional_at","index":0}]}
        - &session_mode
          kind: "all"
          items:
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"direct_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"shell_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"lua_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"receive_only"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"send_only"}}
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &connect_parameters
      - {"name":"remote_endpoint","semantic":{"kind":"endpoint","endpoint_kind":"host_port","usage":"generic_endpoint"},"binding":{"kind":"next_positional"},"cardinality":"required_one"}
      - &optional_port {"name":"port","semantic":{"kind":"plain_value"},"binding":{"kind":"next_positional"},"cardinality":"optional_one"}
    stream_contract: &duplex_stream {"stdin_mode":"data_optional","stdout_mode":"data","stderr_mode":"opaque","stdout_dependency":"inputs"}
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: &sending_effects
      - &sending_endpoint {"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"},"input_scope":{"slots":["remote_endpoint","request_values"],"stdin":true}}
      - &consume_stdin {"kind":"consume_stdin","target":{"kind":"implicit_input","source":"stdin_data"}}
  - id: "connect_send"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *connect_transport
        - &send_only_mode
          kind: "all"
          items:
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"direct_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"shell_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"lua_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"receive_only"}}
            - {"kind":"has_modifier","modifier":"send_only"}
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *connect_parameters
    stream_contract: &send_only_stream {"stdin_mode":"data_optional","stdout_mode":"opaque","stderr_mode":"opaque","stdout_dependency":"independent"}
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *sending_effects
  - id: "connect_receive"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *connect_transport
        - &receive_only_mode
          kind: "all"
          items:
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"direct_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"shell_exec"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"lua_exec"}}
            - {"kind":"has_modifier","modifier":"receive_only"}
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *connect_parameters
    stream_contract: &receive_only_stream {"stdin_mode":"ignored","stdout_mode":"data","stderr_mode":"opaque","stdout_dependency":"inputs"}
    effects: &receiving_effects [{"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"},"input_scope":{"slots":["remote_endpoint","request_values"],"stdin":false}}]
  - id: "connect_execute"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *connect_transport
        - &exec_mode
          kind: "all"
          items:
            - {"kind":"any","items":[{"kind":"has_modifier","modifier":"direct_exec"},{"kind":"has_modifier","modifier":"shell_exec"}]}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"lua_exec"}}
            - {"kind":"not","item":{"kind":"all","items":[{"kind":"has_modifier","modifier":"direct_exec"},{"kind":"has_modifier","modifier":"shell_exec"}]}}
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &exec_connect_parameters
      - {"name":"remote_endpoint","semantic":{"kind":"endpoint","endpoint_kind":"host_port","usage":"upload_target"},"binding":{"kind":"next_positional"},"cardinality":"required_one"}
      - *optional_port
    stream_contract: &exec_stream {"stdin_mode":"ignored","stdout_mode":"opaque","stderr_mode":"opaque","stdout_dependency":"independent"}
    effects: [{"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"}}]
  - id: "connect_lua"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *connect_transport
        - &lua_mode
          kind: "all"
          items: [{"kind":"has_modifier","modifier":"lua_exec"},{"kind":"not","item":{"kind":"has_modifier","modifier":"direct_exec"}},{"kind":"not","item":{"kind":"has_modifier","modifier":"shell_exec"}}]
    remaining_selector: {"kind":"no_positional_args"}
    operation_semantics_unresolved: true
    parameters: *exec_connect_parameters
    stream_contract: *exec_stream
    effects: [{"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"}}]
  - id: "listen_host_session"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - &explicit_listener_transport
          kind: "all"
          items:
            - {"kind":"has_modifier","modifier":"listen"}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"unix_socket"}}
            - {"kind":"has_positional_at","index":0}
            -
              kind: "any"
              items:
                - {"kind":"has_positional_at","index":1}
                - {"kind":"has_modifier","modifier":"source_port"}
                - {"kind":"not","item":{"kind":"has_positional_at_matching","index":0,"matcher":{"kind":"regex_pattern","pattern":"^[0-9]{0,5}$"}}}
        - *session_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &listener_parameters
      -
        name: "remote_endpoint"
        semantic: {"kind":"endpoint","endpoint_kind":"host_port","usage":"generic_endpoint"}
        binding: {"kind":"next_positional"}
        cardinality: "required_one"
        structured_projection: &bind_host_projection {"branches":[{"matcher":{"kind":"regex_capture","pattern":"^.*$","group":0},"target":{"name":"bind_host","semantic":{"kind":"plain_value"}}}]}
      - *optional_port
    stream_contract: *duplex_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: &listener_sending_effects
      - *sending_endpoint
      - *consume_stdin
      - &positional_port_listener {"kind":"listen_network","target":{"kind":"network_listener","host":{"slot":"bind_host","default_value":"0.0.0.0"},"port":{"slot":"port","default_value":"31337"}}}
  - id: "listen_host_session_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *session_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *listener_parameters
    stream_contract: *duplex_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: &source_port_listener_sending_effects
      - *sending_endpoint
      - *consume_stdin
      - &source_port_listener {"kind":"listen_network","target":{"kind":"network_listener","host":{"slot":"bind_host","default_value":"0.0.0.0"},"port":{"slot":"source_port","default_value":"31337"}}}
  - id: "listen_host_send"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *send_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *listener_parameters
    stream_contract: *send_only_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *listener_sending_effects
  - id: "listen_host_send_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *send_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *listener_parameters
    stream_contract: *send_only_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *source_port_listener_sending_effects
  - id: "listen_host_receive"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *receive_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *listener_parameters
    stream_contract: *receive_only_stream
    effects:
      - &receiving_endpoint {"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"},"input_scope":{"slots":["remote_endpoint","request_values"],"stdin":false}}
      - *positional_port_listener
  - id: "listen_host_receive_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *receive_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *listener_parameters
    stream_contract: *receive_only_stream
    effects:
      - *receiving_endpoint
      - *source_port_listener
  - id: "listen_host_execute"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *exec_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &exec_listener_parameters
      -
        name: "remote_endpoint"
        semantic: {"kind":"endpoint","endpoint_kind":"host_port","usage":"upload_target"}
        binding: {"kind":"next_positional"}
        cardinality: "required_one"
        structured_projection: *bind_host_projection
      - *optional_port
    stream_contract: *exec_stream
    effects: &exec_listener_effects
      - {"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"}}
      - *positional_port_listener
  - id: "listen_host_execute_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *exec_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *exec_listener_parameters
    stream_contract: *exec_stream
    effects: &exec_source_port_listener_effects
      - {"kind":"network_endpoint","target":{"kind":"slot","name":"remote_endpoint"}}
      - *source_port_listener
  - id: "listen_host_lua"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *lua_mode
    remaining_selector: {"kind":"no_positional_args"}
    operation_semantics_unresolved: true
    parameters: *exec_listener_parameters
    stream_contract: *exec_stream
    effects: *exec_listener_effects
  - id: "listen_host_lua_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *explicit_listener_transport
        - *lua_mode
    remaining_selector: {"kind":"no_positional_args"}
    operation_semantics_unresolved: true
    parameters: *exec_listener_parameters
    stream_contract: *exec_stream
    effects: *exec_source_port_listener_effects
  - id: "listen_default_session"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - &default_listener_transport
          kind: "all"
          items:
            - {"kind":"has_modifier","modifier":"listen"}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"unix_socket"}}
            -
              kind: "any"
              items:
                - {"kind":"no_positional_args"}
                -
                  kind: "all"
                  items:
                    - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
                    - {"kind":"not","item":{"kind":"has_positional_at","index":1}}
                    - {"kind":"has_positional_at_matching","index":0,"matcher":{"kind":"regex_pattern","pattern":"^[0-9]{0,5}$"}}
        - *session_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &default_listener_parameters
      - *optional_port
      - {"name":"bind_host","semantic":{"kind":"plain_value"},"binding":{"kind":"next_positional"},"cardinality":"optional_one"}
    stream_contract: *duplex_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: &default_listener_effects
      - *consume_stdin
      - *positional_port_listener
  - id: "listen_default_session_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *session_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *duplex_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: &default_source_port_listener_effects
      - *consume_stdin
      - *source_port_listener
  - id: "listen_default_send"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *send_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *send_only_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *default_listener_effects
  - id: "listen_default_send_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *send_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *send_only_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *default_source_port_listener_effects
  - id: "listen_default_receive"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *receive_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *receive_only_stream
    effects: &default_listener_receive_effects [{"kind":"listen_network","target":{"kind":"network_listener","host":{"slot":"bind_host","default_value":"0.0.0.0"},"port":{"slot":"port","default_value":"31337"}}}]
  - id: "listen_default_receive_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *receive_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *receive_only_stream
    effects: &default_source_port_listener_receive_effects [{"kind":"listen_network","target":{"kind":"network_listener","host":{"slot":"bind_host","default_value":"0.0.0.0"},"port":{"slot":"source_port","default_value":"31337"}}}]
  - id: "listen_default_execute"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *exec_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *exec_stream
    effects: *default_listener_receive_effects
  - id: "listen_default_execute_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *exec_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *default_listener_parameters
    stream_contract: *exec_stream
    effects: *default_source_port_listener_receive_effects
  - id: "listen_default_lua"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"source_port"}}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *lua_mode
    remaining_selector: {"kind":"no_positional_args"}
    operation_semantics_unresolved: true
    parameters: *default_listener_parameters
    stream_contract: *exec_stream
    effects: *default_listener_receive_effects
  - id: "listen_default_lua_source_port"
    selector:
      kind: "all"
      items:
        - {"kind":"has_modifier","modifier":"source_port"}
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *default_listener_transport
        - *lua_mode
    remaining_selector: {"kind":"no_positional_args"}
    operation_semantics_unresolved: true
    parameters: *default_listener_parameters
    stream_contract: *exec_stream
    effects: *default_source_port_listener_receive_effects
  - id: "unix_connect_session"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - &unix_connect_transport
          kind: "all"
          items:
            - {"kind":"has_modifier","modifier":"unix_socket"}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"udp"}}
            - {"kind":"not","item":{"kind":"has_modifier","modifier":"listen"}}
            - {"kind":"has_positional_at","index":0}
        - *session_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: &unix_connect_parameters [{"name":"remote_endpoint","semantic":{"kind":"endpoint","endpoint_kind":"socket_path","usage":"generic_endpoint"},"binding":{"kind":"next_positional"},"cardinality":"required_one"}]
    stream_contract: *duplex_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *sending_effects
  - id: "unix_connect_send"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *unix_connect_transport
        - *send_only_mode
    remaining_selector: {"kind":"no_positional_args"}
    parameters: *unix_connect_parameters
    stream_contract: *send_only_stream
    implicit_inputs: [{"source":"stdin_data","semantic":{"kind":"plain_value"}}]
    effects: *sending_effects
  - id: "unix_connect_receive"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - *unix_connect_transport
