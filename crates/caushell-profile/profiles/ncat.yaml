      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - &unix_listener_transport
          kind: "all"
          items: [{"kind":"has_modifier","modifier":"unix_socket"},{"kind":"not","item":{"kind":"has_modifier","modifier":"udp"}},{"kind":"has_modifier","modifier":"listen"},{"kind":"has_positional_at","index":0}]
