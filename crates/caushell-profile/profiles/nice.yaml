dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
option_operand_matcher:
  kind: regex_pattern
  pattern: '^-[0-9]+$'

identity:
  canonical_name: nice
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: current_niceness_query
    selector:
      kind: all
      items:
        - kind: no_positional_args
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_flag, flag: "--help"}
              - {kind: has_flag, flag: "--version"}
    parameters: []
    stream_contract:
      stdin_mode: ignored
      stdout_mode: data
      stderr_mode: opaque

  - id: wrapped_command
    selector:
      kind: all
      items:
        - kind: has_positional_at
          index: 0
        - kind: not
          item:
            kind: any
            items:
              - kind: has_flag
                flag: "--help"
              - kind: has_flag
                flag: "--version"
    remaining_selector:
      kind: no_positional_args
    parameters:
      - name: legacy_adjustment
        semantic:
          kind: plain_value
        binding:
          kind: leading_positionals_while
          matcher:
            kind: regex_pattern
            pattern: '^-[0-9]+$'
        cardinality: optional_one
      - name: wrapped_command
        semantic:
          kind: command_ref
          dispatch: wrapper_command
        binding:
          kind: next_positional
        cardinality: required_one
      - name: wrapped_args
        semantic:
          kind: plain_value
        binding:
          kind: remaining_args
        cardinality: optional_many
    effects:
      - kind: dispatch_command
        target:
          kind: dispatch
          command: wrapped_command
          stdin_from_parent: true
          stdout_to_parent: true
          argv:
            - wrapped_args
          environment: []

modifiers:
  - id: adjustment
    matcher:
      kind: any_flag
      flags:
        - "-n"
        - "--adjustment"
    parameters:
      - name: adjustment_value
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: help
    matcher:
      kind: any_flag
      flags:
        - "--help"

  - id: version
    matcher:
      kind: any_flag
      flags:
        - "--version"

subcommands: null
extensions: {}
