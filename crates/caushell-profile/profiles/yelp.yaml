dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: yelp
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
forms:
- id: display_man_uri
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: regex_pattern
      pattern: "^man:/"
  parameters:
  - name: document_uri
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
    structured_projection:
      branches:
      - matcher:
          kind: prefix
          value: 'man:'
        target:
          name: input_paths
          semantic:
            kind: path
            role: read
            purpose: generic_operand
  effects:
  - kind: read_path
    target:
      kind: slot
      name: input_paths
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
modifiers: []
subcommands:
extensions:
  caushell.profile/source_research:
  - https://gitlab.gnome.org/GNOME/yelp/-/blob/master/src/yelp-application.c
  - https://gitlab.gnome.org/GNOME/yelp/-/blob/master/src/yelp-uri.c
  - 'GTFOBins fixed snapshot acd524623f9c406acedd2754ebd9c2431f3675ad: _gtfobins/yelp
    file-read'
  caushell.profile/known_limitations:
  - Only explicit man:/absolute/file URIs project to local files. man:topic is a manual
    identifier, not a workspace filename, and remains unsupported. Rendering and graphical
    presentation are opaque.
