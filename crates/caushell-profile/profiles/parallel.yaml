dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true
option_scope: leading_options

identity:
  canonical_name: parallel
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: dry_run
    selector:
      kind: has_modifier
      modifier: dry_run
    parameters:
      - name: dry_run_arguments
        semantic: {kind: plain_value}
        binding: {kind: remaining_args}
        cardinality: optional_many
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: arg_file}}

  - id: show_help
    selector:
      kind: has_flag
      flag: "--help"

  - id: show_version
    selector:
      kind: all
      items:
        - kind: has_flag
          flag: "--version"
        - kind: not
          item:
            kind: has_flag
            flag: "--help"

  - id: native_jobs
    selector:
      kind: all
      items:
        - &executing_jobs {kind: not, item: {kind: any, items: [{kind: has_modifier, modifier: dry_run}, {kind: has_flag, flag: '--help'}, {kind: has_flag, flag: '--version'}]}}
        - {kind: not, item: &explicit_source {kind: any, items: [{kind: has_modifier, modifier: arg_file}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^:::+$'}}]}}
    parameters: &job_parameters
      - {name: job_template, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    stream_contract: &job_stream {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: arg_file}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - &native_dispatch {kind: dispatch_command, target: {kind: dispatch, command_string: {slot: job_template, syntax: gnu_parallel}, stdin_from_tool: true, stdout_to_parent: true}}

  - id: native_jobs_explicit_source
    selector: {kind: all, items: [*executing_jobs, *explicit_source]}
    parameters: *job_parameters
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: arg_file}}
      - *native_dispatch

modifiers:
  - {id: context_grouping, matcher: {kind: any_flag, flags: ['-X']}}
  - {id: null_delimited, matcher: {kind: any_flag, flags: ['-0', '--null']}}
  - {id: quote_template, matcher: {kind: any_flag, flags: ['-q', '--quote']}}
  - id: jobs
    matcher:
      kind: any_flag
      flags:
        - "-j"
        - "--jobs"
    parameters:
      - name: jobs_value
        semantic:
          kind: plain_value
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one

  - id: arg_file
    matcher:
      kind: any_flag
      flags:
        - "-a"
        - "--arg-file"
    parameters:
      - name: arg_file
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
    effects:
      - kind: read_path
        target:
          kind: slot
          name: arg_file

  - id: dry_run
    matcher:
      kind: any_flag
      flags:
        - "--dry-run"

subcommands: null
extensions:
  caushell.profile/known_limitations:
    - Native jobs use shell templates, not literal wrapper argv. The bounded native projector supports one stdin, -a or ::: source, ordinary replacement forms, and -q. Dry-run never declares job execution.
    - Multiple input products, :::: sources, custom replacements, explicit environment overrides and ambiguous quoting retain opaque execution instead of invented jobs. Single-source -X context jobs conservatively cover contiguous input groups within the expansion budget. Unknown input is represented by typed runtime operands when its replacements belong to fixed command arguments; command-position and unsupported shell-frame substitutions remain unresolved. Ambient config contents are not dynamically read.
