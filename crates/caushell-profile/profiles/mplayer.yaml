dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: mplayer, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true

forms:
  - id: play_media
    selector: {kind: all, items: [{kind: no_dash_dash}, {kind: has_positional_at, index: 0}]}
    parameters:
      - name: local_media
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding:
          kind: positionals_matching
          matcher: {kind: regex_pattern, pattern: '^[A-Za-z0-9_./][^:\r\n]*$'}
        cardinality: optional_many
      - name: unclassified_media
        semantic: {kind: plain_value}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
    operation_semantics_unresolved: true
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: local_media}}
      # Startup may load system, user and per-file settings. Some builds
      # also create the user configuration directory and initial file.
      - {kind: load_config, target: {kind: configured_path, sources: [], missing: unknown, purpose: tool_config}}
      - {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown}}

extensions:
  caushell.profile/source_research:
    - https://manpages.debian.org/bookworm/mplayer/mplayer.1.en.html
    - https://raw.githubusercontent.com/pigoz/mplayer-svn/master/mplayer.c
  caushell.profile/known_limitations:
    - The local read slot excludes protocol syntax, standard input markers and unclassified operands.
    - Configuration-controlled input sources, output drivers, control channels and stream semantics remain unresolved.
    - Options, explicit playlist mode and argument separators are outside the proven playback shape.
