dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: service
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: linux_list_all_status
  selector:
    kind: has_flag
    flag: --status-all
  parameters:
  - {name: ignored_list_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: inspect}
    target: {kind: none}
- id: freebsd_list_enabled_services
  selector:
    kind: has_flag
    flag: -e
  parameters:
  - {name: ignored_list_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: inspect}
    target: {kind: none}
- id: service_status
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: has_positional_at_matching
      index: 1
      matcher: {kind: regex_pattern, pattern: "^(status|show)$"}
    - kind: not
      item: {kind: has_modifier, modifier: information}
  parameters:
  - {name: service_name, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
  - {name: action, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 1}, cardinality: required_one}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: inspect}
    target: {kind: none}
- id: service_control
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: has_positional_at_matching
      index: 1
      matcher: {kind: regex_pattern, pattern: "^(start|stop|restart|reload|force-reload)$"}
    - kind: not
      item: {kind: has_modifier, modifier: information}
  parameters:
  - {name: service_name, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
  - {name: action, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 1}, cardinality: required_one}
  - {name: service_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: control}
    target: {kind: none}
- id: service_name_path_execution
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_modifier
        modifier: information
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 1
        matcher: {kind: regex_pattern, pattern: "^(status|show|start|stop|restart|reload|force-reload)$"}
  parameters:
  - name: service_operand
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: service_operand
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/service (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
