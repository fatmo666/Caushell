dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
identity:
  canonical_name: service
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: all
    items:
    - {kind: has_modifier, modifier: information}
    - &without_service_list
      kind: not
      item:
        kind: any
        items:
        - {kind: has_modifier, modifier: list_all_status}
        - {kind: has_modifier, modifier: list_enabled_services}
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: linux_list_all_status
  selector:
    kind: all
    items:
    - {kind: has_modifier, modifier: list_all_status}
    - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: --status-all}}
    # Unknown positional text must not be mistaken for a missing argument.
    - {kind: exact_positional_count, count: 0}
    - {kind: not, item: {kind: has_argument_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '(?s)\A.*\z'}}}
  # Local service scripts can have their own effects when invoked with
  # status. This argv does not identify the scripts or their behavior.
  operation_semantics_unresolved: true
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: opaque}
    target: {kind: none}
  - kind: execute_payload
    target: {kind: none}
- id: freebsd_list_enabled_services
  selector:
    kind: all
    items:
    - {kind: has_modifier, modifier: list_enabled_services}
    - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: -e}}
    - {kind: exact_positional_count, count: 0}
    - {kind: not, item: {kind: has_argument_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '(?s)\A.*\z'}}}
  # FreeBSD evaluates selected rc.d declarations and loads system
  # configuration while enumerating enabled services.
  operation_semantics_unresolved: true
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: opaque}
    target: {kind: none}
  - kind: execute_payload
    target: {kind: none}
- id: service_status
  selector:
    kind: all
    items:
    - *without_service_list
    - kind: has_positional_at
      index: 0
    - kind: has_positional_at_matching
      index: 1
      matcher: {kind: regex_pattern, pattern: "^(status|show)$"}
    - kind: not
      item: {kind: has_modifier, modifier: information}
  parameters:
  - {name: service_name, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
  - {name: action, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: inspect}
    target: {kind: none}
- id: service_control
  selector:
    kind: all
    items:
    - *without_service_list
    - kind: has_positional_at
      index: 0
    - kind: has_positional_at_matching
      index: 1
      matcher: {kind: regex_pattern, pattern: "^(start|stop|restart|reload|force-reload)$"}
    - kind: not
      item: {kind: has_modifier, modifier: information}
  parameters:
  - {name: service_name, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
  - {name: action, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
  - {name: service_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
  effects:
  - kind: state_operation
    state_operation: {domain: service_manager, operation: control}
    target: {kind: none}
- id: service_name_path_execution
  selector:
    kind: all
    items:
    - *without_service_list
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_modifier
        modifier: information
    - kind: not
      item:
        kind: has_positional_at_matching
        index: 1
        matcher: {kind: regex_pattern, pattern: "^(status|show|start|stop|restart|reload|force-reload)$"}
  parameters:
  - name: service_operand
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: execute_payload
    target:
      kind: slot
      name: service_operand
modifiers:
- id: list_all_status
  matcher: {kind: any_flag, flags: [--status-all]}
- id: list_enabled_services
  matcher: {kind: any_flag, flags: [-e]}
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
subcommands:
extensions:
  caushell.profile/source_research:
  - https://manpages.debian.org/bookworm/init-system-helpers/service.8.en.html
  - https://salsa.debian.org/debian/init-system-helpers/-/blob/7103eb79b2bdd33645bd20a79258eb226dfc57f5/script/service
  - https://raw.githubusercontent.com/freebsd/freebsd-src/releng/14.3/usr.sbin/service/service.sh
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/service (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Standalone --status-all and -e retain unresolved native execution. Other argv does not inherit either form.
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
