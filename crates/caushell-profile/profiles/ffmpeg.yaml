dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: all_arguments
option_matching: exact_names
opaque_on_unresolved: true
identity:
  canonical_name: ffmpeg
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: lavfi_ladspa_load
  selector:
    kind: all
    items:
    - kind: all
      items:
      - kind: has_modifier_parameter_matching
        modifier: input_format
        parameter: input_format
        matcher:
          kind: literal
          value: lavfi
      - kind: has_modifier
        modifier: audio_filter
      - kind: has_modifier
        modifier: media_input
      - kind: has_modifier_parameter_matching
        modifier: audio_filter
        parameter: filter
        matcher:
          kind: regex_pattern
          pattern: "^ladspa="
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: output_path
    semantic:
      kind: path
      role: write
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: load_in_process_code
    target:
      kind: slot
      name: filter
  - kind: write_path
    target:
      kind: slot
      name: output_path
modifiers:
- id: input_format
  matcher:
    kind: any_flag
    flags:
    - "-f"
  parameters:
  - name: input_format
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
- id: media_input
  matcher:
    kind: any_flag
    flags:
    - "-i"
  parameters:
  - name: input_source
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
- id: audio_filter
  matcher:
    kind: any_flag
    flags:
    - "-af"
  parameters:
  - name: filter
    semantic:
      kind: payload
      language: opaque
      source: inline_string
      recursive: true
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-h"
    - "-help"
    - "-version"
subcommands:
extensions:
  caushell.profile/source_research:
  - https://gtfobins.org/gtfobins/ffmpeg/
  caushell.profile/known_limitations:
  - The pinned recipe loads a LADSPA shared library through an opaque filter expression.
    The exact shared-library path inside that expression is not extracted.
  - Exact plugin argument grammar and output behavior are version dependent; reset^J
    is terminal input, not an inferred child process.
  - Unknown options and configuration-driven behavior remain unresolved; the profile
    records only the demonstrated mechanism.
