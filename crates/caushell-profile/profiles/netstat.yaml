{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "netstat",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "linux",
      "macos"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query_system_information",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ],
      "stdout_growth": {
        "kind": "continuous",
        "records": "lines",
        "required_modifier": "repeat"
      }
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-r",
          "--route",
          "-i",
          "--interfaces",
          "-g",
          "--groups",
          "-s",
          "--statistics",
          "-n",
          "--numeric",
          "--numeric-hosts",
          "--numeric-ports",
          "--numeric-users",
          "-a",
          "--all",
          "-l",
          "--listening",
          "-t",
          "--tcp",
          "-u",
          "--udp",
          "-w",
          "--raw",
          "-x",
          "--unix",
          "-e",
          "--extend",
          "-o",
          "--timers",
          "-p",
          "--program",
          "-v",
          "--verbose",
          "-W",
          "--wide",
          "-4",
          "--inet",
          "-6",
          "--inet6",
          "-h",
          "--help",
          "-V",
          "--version"
        ]
      }
    },
    {
      "id": "repeat",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-c",
          "--continuous"
        ]
      }
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/source_research": [
      "https://man7.org/linux/man-pages/man8/netstat.8.html"
    ],
    "caushell.profile/review_scope": "Explicit query modes only; unsupported modes remain unresolved. No all-argv effect envelope or stdout key/number proof."
  }
}
