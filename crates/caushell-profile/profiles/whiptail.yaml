dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: whiptail, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: display_textbox_file
    selector: {kind: has_modifier, modifier: textbox}
    parameters:
      - {name: text_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: height, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: width, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: text_file}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
modifiers:
  - id: textbox
    matcher: {kind: any_flag, flags: ['--textbox']}
    parameters: []
    effects: []
  - {id: scrolltext, matcher: {kind: any_flag, flags: ['--scrolltext']}}
  - id: output_fd
    matcher: {kind: any_flag, flags: ['--output-fd']}
    parameters: [{name: output_descriptor, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
subcommands: null
extensions:
  caushell.profile/source: https://manpages.debian.org/trixie/whiptail/whiptail.1.en.html
  caushell.profile/known_limitations:
    - FILE HEIGHT WIDTH are positional operands of --textbox; HEIGHT and WIDTH are data values, not paths. Other widgets remain unresolved.
    - Text is rendered in the terminal UI; this profile does not claim stdout/stderr content.
