dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: composer
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: list_scripts
  selector: {kind: all, items: [{kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(run-script|run)$'}}, {kind: has_modifier, modifier: list_scripts}, {kind: not, item: {kind: has_modifier, modifier: information}}]}
  parameters:
  - {name: operation, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
  - {name: arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
- id: validate_file
  selector:
    kind: all
    items:
    - {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: validate}}
    - {kind: not, item: {kind: has_modifier, modifier: information}}
  parameters:
  - {name: operation, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
  - {name: config_files, semantic: {kind: path, role: read, purpose: tool_config}, binding: {kind: next_positional}, cardinality: optional_many}
  effects:
  - {kind: read_path, path_access: content_open, target: {kind: slot, name: config_files}}
  stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data}
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: run_script
  selector:
    kind: all
    items:
    - {kind: has_positional_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^(run-script|run)$'}}
    - {kind: not, item: {kind: has_modifier, modifier: list_scripts}}
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: script_name
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  - name: script_args
    semantic: {kind: plain_value}
    binding: {kind: remaining_args}
    cardinality: optional_many
  effects:
  - kind: load_config
    target:
      kind: tool_convention_path
      path: composer.json
      convention: composer.script_definition
      purpose: task_config
  - kind: execute_config_defined_task
    target:
      kind: tool_convention_path
      path: composer.json
      convention: composer.script_definition
      purpose: task_config
subcommands:
extensions:
  caushell.profile/source_research:
  - https://getcomposer.org/doc/articles/scripts.md
  - https://gtfobins.org/gtfobins/composer/
  caushell.profile/known_limitations:
  - Script definitions are decoded from statically observed composer.json content. PHP callbacks retain an unresolved executable-language boundary.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "-h"
    - "--version"
    - "-V"
  ends_option_scope: true
- {id: list_scripts, matcher: {kind: any_flag, flags: [--list, -l]}}
- {id: execution_flag, matcher: {kind: any_flag, flags: [--dev, --no-dev, --no-interaction, -n, --no-plugins, --no-scripts, --quiet, -q, --verbose, -v, --ansi, --no-ansi]}}
- id: timeout
  matcher: {kind: any_flag, flags: [--timeout]}
  parameters: [{name: timeout, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
- id: working_directory
  matcher: {kind: any_flag, flags: [--working-dir, -d]}
  parameters: [{name: working_directory, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  effects: [{kind: set_execution_working_directory, target: {kind: configured_path, sources: [{slot: working_directory, projection: {kind: identity}}], missing: unknown}}]
