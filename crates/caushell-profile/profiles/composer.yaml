dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity:
  canonical_name: composer
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
forms:
- id: show_help
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_tail
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: run_script
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: run-script
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 0
    cardinality: required_one
  - name: script_name
    semantic:
      kind: plain_value
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: tool_convention_path
      path: composer.json
      convention: composer.script_definition
      purpose: tool_config
  - kind: execute_config_defined_task
    target:
      kind: tool_convention_path
      path: composer.json
      convention: composer.script_definition
      purpose: tool_config
subcommands:
extensions:
  caushell.profile/source_research:
  - https://getcomposer.org/doc/articles/scripts.md
  - https://gtfobins.org/gtfobins/composer/
  caushell.profile/known_limitations:
  - The JSON script definition is read and may invoke commands. Script-name resolution,
    shell selection and exact child argv depend on the file contents and remain unresolved.
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
  ends_option_scope: true
