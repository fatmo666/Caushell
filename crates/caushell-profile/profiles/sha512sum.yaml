dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true

identity:
  canonical_name: sha512sum
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: hash_inputs
    selector: {kind: all, items: [&running {kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    remaining_selector: {kind: no_positional_args}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: &effects
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: hash_inputs_stdin
    selector: {kind: all, items: [*running, *stdin]}
    remaining_selector: {kind: no_positional_args}
    parameters: *inputs
    effects: *effects
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: hash_format, matcher: {kind: any_flag, flags: ['-b', '--binary', '-t', '--text', '--tag', '-z', '--zero']}}
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
