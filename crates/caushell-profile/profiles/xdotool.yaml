dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: leading_options
opaque_on_unresolved: true
identity: {canonical_name: xdotool, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
subcommands:
  roots:
    - name: exec
      option_scope: leading_options
      forms:
        - id: exec_program
          selector: {kind: has_positional_at, index: 0}
          parameters:
            - {name: child_command, semantic: {kind: command_ref, dispatch: wrapper_command}, binding: {kind: next_positional}, cardinality: required_one}
            - {name: child_argv, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}
          effects: [{kind: dispatch_command, target: {kind: dispatch, command: child_command, argv: [child_argv], stdin_from_parent: true, stdout_to_parent: true}}]
      modifiers:
        - {id: sync, matcher: {kind: any_flag, flags: ['--sync']}}
extensions:
  caushell.profile/source_research: [https://man.archlinux.org/man/xdotool.1]
  caushell.profile/known_limitations: [The exec subcommand starts the explicit program through the X session; --sync changes waiting behavior, not the child argv grammar. Requires a running X server.]
