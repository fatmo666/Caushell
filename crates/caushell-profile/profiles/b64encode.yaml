dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: b64encode, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [macos], shell_families: [], requires_features: []}
option_scope: leading_options
option_matching: exact_names
opaque_on_unresolved: true

forms:
  - id: encode_raw_stdin
    selector:
      kind: all
      items:
        - &raw {kind: has_modifier, modifier: raw}
        - {kind: exact_positional_count, count: 1}
    parameters:
      - {name: header_name, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
    effects:
      - &encode {kind: transform_data, target: {kind: none}, extensions: {transform.kind: encode}}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: encode_raw_file
    selector:
      kind: all
      items:
        - *raw
        - {kind: exact_positional_count, count: 2}
    parameters:
      - {name: input_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}
      - {name: header_name, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_file}}
      - *encode
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}

modifiers:
  - {id: raw, matcher: {kind: any_flag, flags: [-r]}}

extensions:
  caushell.profile/source_research:
    - https://github.com/apple-oss-distributions/text_cmds/blob/main/bintrans/uuencode.c
  caushell.profile/known_limitations:
    - The final operand is required but ignored in raw mode. With two operands the first is opened as a file, including a literal "-".
    - Only raw stdout encoding is modeled. File output and headered encoding remain unresolved.
