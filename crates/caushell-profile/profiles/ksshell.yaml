dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: ksshell, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_matching: exact_names
opaque_on_unresolved: true
forms:
  - id: load_kickstart_input
    selector: {kind: has_modifier, modifier: input_file}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_file}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
modifiers:
  - id: input_file
    matcher: {kind: any_flag, flags: ['-i', '--input']}
    parameters: [{name: input_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: output_file
    matcher: {kind: any_flag, flags: ['-o', '--output']}
    parameters: [{name: output_file, semantic: {kind: path, role: write, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
    effects: [{kind: write_path, path_access: content_open, target: {kind: slot, name: output_file}}]
  - {id: version, matcher: {kind: any_flag, flags: ['-v', '--version']}}
extensions:
  caushell.profile/source_research:
    - https://gtfobins.org/gtfobins/ksshell/
    - https://man.freebsd.org/cgi/man.cgi?manpath=CentOS+7.1&query=ksshell&sektion=1
  caushell.profile/known_limitations:
    - ksshell parses a Kickstart file as Kickstart syntax and emits/extends that representation; it is not a Bash interpreter.
    - Kickstart documents can contain %pre/%post script sections, but this utility does not itself run an installation or those scripts. Their syntax/content is not interpreted here.
    - Interactive commands, output destination semantics, version-specific parsers, and any effects of later installation remain outside this form.
