dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: cpio
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

option_scope: permuted_options
opaque_on_unresolved: true

forms:
  - id: remote_archive
    selector: &remote_archive_selector
      kind: all
      items:
        - {kind: not, item: {kind: has_modifier, modifier: force_local}}
        - kind: any
          items:
            - {kind: has_modifier_parameter_matching, modifier: archive_file, parameter: archive_operand, matcher: {kind: regex_pattern, pattern: '^.*:.*$'}}
            - {kind: has_modifier_parameter_matching, modifier: list_archive_file, parameter: list_archive_operand, matcher: {kind: regex_pattern, pattern: '^.*:.*$'}}
            - {kind: has_modifier_parameter_matching, modifier: create_archive_file, parameter: create_archive_operand, matcher: {kind: regex_pattern, pattern: '^.*:.*$'}}
            - {kind: has_modifier_parameter_matching, modifier: input_archive_file, parameter: input_archive_operand, matcher: {kind: regex_pattern, pattern: '^.*:.*$'}}
            - {kind: has_modifier_parameter_matching, modifier: output_archive_file, parameter: output_archive_operand, matcher: {kind: regex_pattern, pattern: '^.*:.*$'}}
    parameters: [{name: remote_members, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    effects:
      - {kind: network_endpoint, target: {kind: slot, name: remote_archive_read}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_archive_list}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_archive_create}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_archive_input}}
      - {kind: network_endpoint, target: {kind: slot, name: remote_archive_output}}
      - {kind: execute_remote_command, target: {kind: none}}
      - {kind: state_operation, state_operation: {domain: remote_access, operation: opaque}, target: {kind: none}}
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: list_archive
    remaining_selector: &local_archive {kind: not, item: *remote_archive_selector}
    selector: {kind: has_modifier, modifier: list_mode}
    parameters: &member_patterns
      - name: member_patterns
        semantic: {kind: plain_value}
        binding: {kind: remaining_positionals}
        cardinality: optional_many
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: path_list, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: archive_path}}
      - {kind: read_path, target: {kind: slot, name: input_archive_path}}
      - {kind: read_path, target: {kind: slot, name: list_archive_path}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}

  - id: extract_to_stdout
    remaining_selector: *local_archive
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: extract_mode}
        - {kind: has_modifier, modifier: to_stdout}
        - {kind: not, item: {kind: has_modifier, modifier: list_mode}}
    parameters: *member_patterns
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: archive_path}}
      - {kind: read_path, target: {kind: slot, name: input_archive_path}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}

  - id: verify_archive_only
    remaining_selector: *local_archive
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: extract_mode}
        - {kind: has_modifier, modifier: verify_only}
        - {kind: not, item: {kind: has_modifier, modifier: list_mode}}
    parameters: *member_patterns
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: archive_path}}
      - {kind: read_path, target: {kind: slot, name: input_archive_path}}
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}

  - id: extract_archive_from_stdin
    remaining_selector: *local_archive
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: extract_mode}
        - {kind: not, item: {kind: has_modifier, modifier: archive_file}}
        - {kind: not, item: {kind: has_modifier, modifier: input_archive_file}}
        - {kind: not, item: {kind: has_modifier, modifier: list_mode}}
        - {kind: not, item: {kind: has_modifier, modifier: to_stdout}}
        - {kind: not, item: {kind: has_modifier, modifier: verify_only}}
    parameters: *member_patterns
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_data}}
      - {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown}}

  - id: extract_archive
    remaining_selector: *local_archive
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: extract_mode}
        - kind: any
          items:
            - {kind: has_modifier, modifier: archive_file}
            - {kind: has_modifier, modifier: input_archive_file}
        - {kind: not, item: {kind: has_modifier, modifier: list_mode}}
        - {kind: not, item: {kind: has_modifier, modifier: to_stdout}}
        - {kind: not, item: {kind: has_modifier, modifier: verify_only}}
    parameters: *member_patterns
    implicit_inputs:
      - {source: stdin_data, semantic: {kind: plain_value}}
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: opaque
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: archive_path
      - kind: read_path
        target:
          kind: slot
          name: input_archive_path
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: archive_path}, rule: {kind: archive_members}, purpose: generic_operand}}
      - {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_archive_path}, rule: {kind: archive_members}, purpose: generic_operand}}

  - id: create_archive
    remaining_selector: *local_archive
    selector:
      kind: has_modifier
      modifier: create_mode
    parameters:
      - name: source_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
    implicit_inputs:
      - {source: stdin_data, semantic: {kind: plain_value}}
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: data
      stderr_mode: opaque
    effects:
      - kind: read_path
        target:
          kind: slot
          name: source_paths
      - kind: write_path
        target:
          kind: slot
          name: create_archive_path
      - kind: write_path
        target:
          kind: slot
          name: output_archive_path

  - id: pass_through_archive
    remaining_selector: *local_archive
    selector:
      kind: all
      items:
        - kind: has_modifier
          modifier: pass_through_mode
        - kind: has_positional_at
          index: 0
    parameters:
      - name: destination_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: required_one
    implicit_inputs:
      - {source: stdin_data, semantic: {kind: plain_value}}
    # Copy-pass takes its source name list from stdin, not argv. Its one
    # destination is independently known even if that list cannot be decoded.
    stream_contract:
      stdin_mode: data_optional
      stdout_mode: opaque
      stderr_mode: opaque
    effects:
      - kind: read_path
        target: {kind: implicit_input, source: stdin_data}
      - kind: write_path
        target:
          kind: slot
          name: destination_path

modifiers:
  - {id: force_local, matcher: {kind: any_flag, flags: [--force-local]}}
  - id: remote_transport_program
    matcher: {kind: any_flag, flags: [--rsh-command]}
    parameters: [{name: remote_transport_program, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: extract_mode
    matcher:
      kind: any_flag
      flags:
        - "-i"
        - "--extract"

  - id: list_mode
    matcher: {kind: any_flag, flags: ["-t", "--list"]}

  - id: to_stdout
    matcher: {kind: any_flag, flags: [--to-stdout]}

  - id: verify_only
    matcher: {kind: any_flag, flags: [--only-verify-crc]}

  - id: create_mode
    matcher:
      kind: any_flag
      flags:
        - "-o"
        - "--create"

  - id: pass_through_mode
    matcher:
      kind: any_flag
      flags:
        - "-p"
        - "--pass-through"

  # Declare operand-free flags so the shared option grammar decodes every
  # member of -pdm, -dump, -pdv0, etc. No command-specific binder logic.
  - id: copy_behavior
    matcher:
      kind: any_flag
      flags: ["-d", "--make-directories", "-m", "--preserve-modification-time", "-u", "--unconditional", "-l", "--link", "-L", "--dereference", "--no-preserve-owner", "--sparse"]

  - id: name_list_format
    matcher: {kind: any_flag, flags: ["-0", "--null"]}

  - id: output_owner
    matcher: {kind: any_flag, flags: ["-R", "--owner"]}
    parameters:
      - name: output_owner
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
    # Ownership applies to copied/extracted output files (already modeled as
    # writes), or to archive headers in create mode; it is not a source write.

  - id: reset_source_access_time
    matcher: {kind: any_flag, flags: ["-a", "--reset-access-time"]}
    # This changes source metadata, whose path list is runtime stdin. Do not
    # certify those writes just because the destination is in the workspace.
    effects:
      - kind: metadata_mutation
        target: {kind: implicit_input, source: stdin_data}
        path_list: {separator: newline, nul_modifier: name_list_format}
    effects_when:
      unless_forms: [remote_archive, list_archive, extract_to_stdout, verify_archive_only, extract_archive_from_stdin, extract_archive]

  - id: output_options
    matcher: {kind: any_flag, flags: ["-v", "--verbose", "-V", "--dot", "--quiet"]}

  - id: archive_options
    matcher: {kind: any_flag, flags: ["-B", "-b", "--swap", "-s", "--swap-bytes", "-S", "--swap-halfwords", "-c", "-k", "-n", "--numeric-uid-gid", "-f", "--nonmatching", "--no-absolute-filenames", "--absolute-filenames"]}

  - id: archive_format
    matcher: {kind: any_flag, flags: ["-H", "--format"]}
    parameters:
      - name: archive_format
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one

  - id: archive_file
    matcher:
      kind: any_flag
      flags:
        - "-F"
        - "--file"
    constraints:
      - kind: requires_modifier
        modifier: extract_mode
      - kind: mutually_exclusive_with
        modifier: list_mode
    parameters:
      - name: archive_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches:
            - {matcher: &remote_match {kind: regex_capture, pattern: '^.*:.*$', group: 0}, unless_modifier: force_local, target: {name: remote_archive_read, semantic: &remote_endpoint {kind: endpoint, endpoint_kind: remote_spec, usage: generic_endpoint}}}
          fallback: {name: archive_path, semantic: {kind: path, role: read, purpose: generic_operand}}

  - id: list_archive_file
    matcher: {kind: any_flag, flags: ["-F", "--file"]}
    constraints: [{kind: requires_modifier, modifier: list_mode}]
    parameters:
      - name: list_archive_operand
        semantic: {kind: plain_value}
        binding: {kind: following_matched_flag, operand_mode: next_arg}
        cardinality: required_one
        structured_projection:
          branches: [{matcher: *remote_match, unless_modifier: force_local, target: {name: remote_archive_list, semantic: *remote_endpoint}}]
          fallback: {name: list_archive_path, semantic: {kind: path, role: read, purpose: generic_operand}}
    effects: [{kind: read_path, target: {kind: slot, name: list_archive_path}}]

  - id: create_archive_file
    matcher:
      kind: any_flag
      flags:
        - "--file"
        - "-F"
    constraints:
      - kind: requires_modifier
        modifier: create_mode
    parameters:
      - name: create_archive_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches: [{matcher: *remote_match, unless_modifier: force_local, target: {name: remote_archive_create, semantic: *remote_endpoint}}]
          fallback: {name: create_archive_path, semantic: {kind: path, role: write, purpose: generic_operand}}

  - id: input_archive_file
    matcher:
      kind: any_flag
      flags:
        - "-I"
    parameters:
      - name: input_archive_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches: [{matcher: *remote_match, unless_modifier: force_local, target: {name: remote_archive_input, semantic: *remote_endpoint}}]
          fallback: {name: input_archive_path, semantic: {kind: path, role: read, purpose: generic_operand}}

  - id: output_archive_file
    matcher:
      kind: any_flag
      flags:
        - "-O"
    parameters:
      - name: output_archive_operand
        semantic: {kind: plain_value}
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
        structured_projection:
          branches: [{matcher: *remote_match, unless_modifier: force_local, target: {name: remote_archive_output, semantic: *remote_endpoint}}]
          fallback: {name: output_archive_path, semantic: {kind: path, role: write, purpose: generic_operand}}

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
  caushell.profile/known_limitations:
    - GNU colon archive operands are remote unless --force-local. rmt transport and custom --rsh-command execution remain explicitly opaque and require approval, without inventing local archive or helper shell effects.
    - Cpio mode-specific archive file surfaces are split, but extraction outputs into the working tree and stdin-provided file lists remain implicit.
    - Reset-access-time keeps an unresolved source metadata target until the stdin name-list format and path domain are modeled; a local destination alone cannot certify source mutations.
