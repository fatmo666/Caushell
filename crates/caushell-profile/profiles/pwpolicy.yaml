dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: pwpolicy, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [macos], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true

forms:
  - id: inspect_global_account_policies
    selector:
      kind: all
      items:
        - {kind: no_dash_dash}
        - {kind: has_argument_at_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^-?getaccountpolicies$'}}
        - {kind: not, item: {kind: has_argument_at_matching, index: 1, matcher: {kind: regex_pattern, pattern: '[\s\S]*'}}}
    parameters:
      - {name: operation, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_one}
    remaining_selector: {kind: no_positional_args}
    effects:
      - kind: state_operation
        state_operation: {domain: host_identity, operation: inspect}
        target: {kind: none}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stdout_dependency: unknown, stderr_mode: opaque}

modifiers:
  - {id: legacy_query_spelling, matcher: {kind: any_flag, flags: [-getaccountpolicies]}}

extensions:
  caushell.profile/source_research:
    - macOS pwpolicy(8) and installed pwpolicy -h
  caushell.profile/known_limitations:
    - Covers only a single global query with no options. Per-user, authenticated, explicit directory node and policy mutation modes remain unresolved.
    - Global policy contents, directory back end and downstream output shape are not certified.
