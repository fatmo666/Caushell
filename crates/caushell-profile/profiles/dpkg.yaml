dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: dpkg
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: package_metadata_query
  selector:
    kind: any
    items:
    - kind: has_flag
      flag: "--print-architecture"
    - kind: has_flag
      flag: "--print-foreign-architectures"
  parameters:
  - name: arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
- id: package_listing
  selector:
    kind: has_flag
    flag: "-l"
  parameters:
  - name: arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: pager
      requires_tty: true
      capabilities:
      - spawn_shell
      - run_command
      - launch_external_editor
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
- id: install_local_packages
  selector:
    kind: has_flag
    flag: "-i"
  parameters:
  - name: package_files
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: remaining_positionals
    cardinality: required_many
  effects:
  - kind: import_package
    target:
      kind: slot
      name: package_files
  - kind: execute_imported_package_logic
    target:
      kind: slot
      name: package_files
  - kind: read_path
    target:
      kind: slot
      name: package_files
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
      purpose: generic_operand
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: data
modifiers:
- id: list
  matcher:
    kind: any_flag
    flags:
    - "-l"
- id: invoke_hook
  matcher:
    kind: any_flag
    flags:
    - "--pre-invoke"
    - "--post-invoke"
  parameters:
  - name: hook_commands
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: inline_only
    cardinality: required_many
  effects: []
- id: verbose
  matcher:
    kind: any_flag
    flags:
    - "-v"
- id: progress
  matcher:
    kind: any_flag
    flags:
    - "-h"
- id: install
  matcher:
    kind: any_flag
    flags:
    - "-i"
    - "--install"
extensions:
  caushell.profile/source_research: GTFOBins dpkg shell mechanism imports a local
    Debian package; dpkg invoke hooks execute through sh -c.
  caushell.profile/known_limitations:
  - Package operands are modeled as local package files only when dpkg's install mode
    supplies them; package suffixes alone are not treated as path evidence.
  - Native pre/post-invoke settings are bound as data. The local read-only dpkg -l
    control does not execute them; conditional hook execution on transactions is not
    expanded. Package import/script execution remains modeled independently.
  - Installation mutates files selected by package contents and native package configuration.
    The static target remains genuinely unknown, never fabricated as a root-directory
    file write.
