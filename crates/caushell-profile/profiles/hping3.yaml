dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: hping3, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
  - id: interactive_tcl_repl
    selector: {kind: all, items: [{kind: no_positional_args}, {kind: not, item: {kind: any, items: [{kind: has_modifier, modifier: information}, {kind: has_modifier, modifier: listen_signature}, {kind: has_modifier, modifier: file_data}, {kind: has_modifier, modifier: dump_packets}]}}]}
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects:
      - {kind: execute_payload, target: {kind: implicit_input, source: interactive_session}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [spawn_shell, run_command]}}
    stream_contract: {stdin_mode: payload_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: transmit_file_to_endpoint
    selector: {kind: all, items: [{kind: has_modifier, modifier: file_data}, {kind: has_positional_at, index: 0}]}
    parameters:
      - {name: target, semantic: {kind: endpoint, endpoint_kind: host_port, usage: upload_target}, binding: {kind: positional_at, index: 0}, cardinality: required_one}
    effects:
      - {kind: read_path, target: {kind: slot, name: file_data}}
      - {kind: network_endpoint, target: {kind: slot, name: target}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: receive_and_dump_packets
    selector: {kind: all, items: [{kind: has_modifier, modifier: listen_signature}, {kind: has_modifier, modifier: dump_packets}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque}
modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, -h, --version]}}
  - id: file_data
    matcher: {kind: any_flag, flags: [-E, --file]}
    parameters: [{name: file_data, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: listen_signature
    matcher: {kind: any_flag, flags: [--listen, "-9"]}
    parameters: [{name: signature, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
  - {id: dump_packets, matcher: {kind: any_flag, flags: [--dump, -j]}}
  - {id: safe_transfer, matcher: {kind: any_flag, flags: [--safe]}}
  - {id: end_transfer, matcher: {kind: any_flag, flags: [--end]}}
  - {id: icmp, matcher: {kind: any_flag, flags: [--icmp]}}
  - {id: data_size, matcher: {kind: any_flag, flags: [--data, -d]}, parameters: [{name: data_size, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]}
  - {id: signature_data, matcher: {kind: any_flag, flags: [--sign, -e]}, parameters: [{name: signature_data, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]}
subcommands: null
extensions:
  caushell.profile/source_research:
    - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/hping3 (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)
    - https://www.hping.org/wiki-sub/94/
    - https://manpages.debian.org/unstable/hping3/hping3.8.en.html
  caushell.profile/known_limitations:
    - The no-argument interactive input language is Tcl, not Bash; it is opaque and never parsed as shell argv.
    - --file reads a file and transmits its contents to the explicit target endpoint. Receiver output is packet data; it is not modeled as a file write or stdin upload.
    - Whether ordinary packet-send mode consumes caller stdin remains unresolved; no stdin-to-upload behavior is asserted.
    - Packet transport details, privilege requirements, and remote receipt are runtime-dependent.
