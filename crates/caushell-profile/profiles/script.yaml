dsl_version: caushell.profile/v1alpha1
kind: command_profile
opaque_on_unresolved: true
option_scope: leading_options

identity:
  canonical_name: script
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: information
    selector: &information
      kind: any
      items:
        - {kind: has_modifier, modifier: help}
        - {kind: has_modifier, modifier: version}
    parameters:
      - name: arguments
        semantic: {kind: plain_value}
        binding: {kind: remaining_args}
        cardinality: optional_many
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data}
    extensions: {caushell.form/suppress_modifier_semantics: true}

  - id: command_string_default_record
    selector:
      kind: all
      items:
        - kind: has_modifier
          modifier: command
        - kind: no_positional_args
        - {kind: not, item: *information}
    effects:
      - kind: write_path
        target: {kind: configured_path, sources: [], default_value: typescript}
      - kind: open_interactive_escape_surface
        target: {kind: none}
        surface:
          kind: terminal_ui
          requires_tty: true
          capabilities: [run_command]

  - id: command_string
    selector:
      kind: all
      items:
        - {kind: has_modifier, modifier: command}
        - {kind: not, item: *information}
    parameters:
      - name: output_path
        semantic: {kind: path, role: write, purpose: generic_operand}
        binding: {kind: next_positional}
        cardinality: optional_one
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: output_path}
      - kind: open_interactive_escape_surface
        target:
          kind: none
        surface:
          kind: terminal_ui
          requires_tty: true
          capabilities:
            - run_command

  - id: record_shell_default_record
    selector:
      kind: all
      items:
        - kind: not
          item: {kind: has_modifier, modifier: command}
        - kind: no_positional_args
        - kind: not
          item:
            kind: any
            items:
              - {kind: has_modifier, modifier: help}
              - {kind: has_modifier, modifier: version}
    effects:
      - kind: write_path
        target: {kind: configured_path, sources: [], default_value: typescript}
      - kind: open_interactive_escape_surface
        target: {kind: none}
        surface:
          kind: terminal_ui
          requires_tty: true
          capabilities: [spawn_shell, run_command]

  # BSD script may exec a positional command following the recording file.
  # Retain terminal approval and only project the direct argv interpretation.
  - id: record_positional_command
    selector:
      kind: all
      items:
        - &no_command_string {kind: not, item: {kind: has_modifier, modifier: command}}
        - {kind: not, item: *information}
        - &positional_command
          kind: has_positional_at_matching
          index: 1
          matcher: {kind: regex_pattern, pattern: '^[^-]'}
    parameters:
      - name: output_path
        semantic: &recording_path {kind: path, role: write, purpose: generic_operand}
        binding: {kind: next_positional}
        cardinality: required_one
      - name: child_command
        semantic: {kind: command_ref, dispatch: wrapper_command}
        binding: {kind: next_positional}
        cardinality: required_one
      - name: child_arguments
        semantic: {kind: plain_value}
        binding: {kind: remaining_args}
        cardinality: optional_many
    effects:
      - &write_recording
        kind: write_path
        path_access: content_open
        target: {kind: slot, name: output_path}
      - kind: open_interactive_escape_surface
        target: {kind: none}
        surface:
          kind: terminal_ui
          requires_tty: true
          capabilities: [run_command]
      - kind: dispatch_command
        target:
          kind: dispatch
          command: child_command
          lookup_domain: external
          argv: [child_arguments]
          unknown_environment_names: [SCRIPT]

  - id: record_shell
    selector:
      kind: all
      items:
        - *no_command_string
        - {kind: not, item: *information}
        - {kind: not, item: *positional_command}
    parameters:
      - name: output_path
        semantic: *recording_path
        binding: {kind: next_positional}
        cardinality: optional_one
    effects:
      - *write_recording
      - kind: open_interactive_escape_surface
        target: {kind: none}
        surface:
          kind: terminal_ui
          requires_tty: true
          capabilities: [spawn_shell, run_command]

modifiers:
  - id: command
    matcher:
      kind: any_flag
      flags:
        - "-c"
        - "--command"
    parameters:
      - name: command_string
        semantic:
          kind: payload
          language: sh
          source: inline_string
          recursive: true
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
    effects:
      - kind: execute_payload
        target:
          kind: slot
          name: command_string

  - id: append
    matcher:
      kind: any_flag
      flags:
        - "-a"
        - "--append"

  - id: return_exit_code
    matcher:
      kind: any_flag
      flags:
        - "-e"
        - "--return"

  - id: flush
    matcher:
      kind: any_flag
      flags:
        - "-f"
        - "--flush"

  - id: quiet
    matcher:
      kind: any_flag
      flags:
        - "-q"
        - "--quiet"

  - id: timing
    matcher:
      kind: any_flag
      flags:
        - "-t"
        - "--timing"
    parameters:
      - name: timing_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: optional_inline_only
        cardinality: optional_one
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: timing_path}

  - id: log_in
    matcher:
      kind: any_flag
      flags:
        - "-I"
        - "--log-in"
    parameters:
      - name: log_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: log_path}

  - id: log_out
    matcher:
      kind: any_flag
      flags:
        - "-O"
        - "--log-out"
    parameters:
      - name: log_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: log_path}

  - id: log_io
    matcher:
      kind: any_flag
      flags:
        - "-B"
        - "--log-io"
    parameters:
      - name: log_path
        semantic:
          kind: path
          role: write
          purpose: generic_operand
        binding:
          kind: following_matched_flag
          operand_mode: next_arg
        cardinality: required_one
    effects:
      - kind: write_path
        path_access: content_open
        target: {kind: slot, name: log_path}

  - id: help
    matcher:
      kind: any_flag
      flags:
        - "-h"
        - "--help"

  - id: version
    matcher:
      kind: any_flag
      flags:
        - "-V"
        - "--version"

subcommands: null
extensions: {}
