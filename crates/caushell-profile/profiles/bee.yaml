dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: bee, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
option_scope: leading_options
opaque_on_unresolved: true
forms:
  - id: information
    selector: {kind: has_modifier, modifier: information}
modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [-h, --help, --version]}}
  - id: framework_root
    matcher: {kind: any_flag, flags: [--root]}
    parameters: [{name: framework_root, semantic: {kind: path, role: read, purpose: tool_config}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]
    effects: [{kind: read_path, target: {kind: slot, name: framework_root}}]
subcommands:
  roots:
    - name: eval
      forms:
        - id: eval_php
          selector: {kind: has_positional_at, index: 0}
          parameters: [{name: code, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: next_positional}, cardinality: required_one}]
          effects: [{kind: execute_payload, target: {kind: slot, name: code}}]
          stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
      children: []
      default_behavior: reject_unknown
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/bee (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://github.com/backdrop-contrib/bee/wiki/Usage", "https://backdropcms.org/project/bee"]
  caushell.profile/known_limitations:
    - bee eval executes PHP after Backdrop bootstrap; PHP remains opaque and is never parsed as Bash or emitted as a child command.
    - The explicit --root operand is modeled as the framework root lookup and kept separate from PHP code. An implicit root from the current directory is not inferred.
    - The Backdrop installation, database, modules, and PHP runtime effects are not expanded.
