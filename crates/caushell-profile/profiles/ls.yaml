dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
identity: {canonical_name: ls, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}

forms:
  - id: show_help
    selector: &information {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_args}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  - id: list_paths
    selector: {kind: not, item: *information}
    remaining_selector: {kind: no_positional_args}
    parameters: [{name: path_targets, semantic: {kind: path, role: target, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: path_list, stderr_mode: opaque, stdout_dependency: inputs}
    effects: [{kind: target_path, target: {kind: slot, name: path_targets}}]

modifiers:
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}, ends_option_scope: true}
  - id: ignore_pattern
    matcher: {kind: any_flag, flags: [-I, --ignore, --hide]}
    parameters: [{name: patterns, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: value_options
    matcher: {kind: any_flag, flags: [-w, --width, -T, --tabsize, --sort, --time, --time-style, --format, --block-size, --quoting-style]}
    parameters: [{name: display_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
  - id: optional_display
    matcher: {kind: any_flag, flags: [--color, --classify, --hyperlink]}
    parameters: [{name: display_mode, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: optional_inline_or_short_attached}, cardinality: optional_many}]
  - id: indicator_style
    matcher: {kind: any_flag, flags: [--indicator-style]}
    parameters: [{name: indicator_style, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: mode, matcher: {kind: any_flag, flags: [-a, --all, -A, --almost-all, -b, --escape, -B, --ignore-backups, -c, -C, -d, --directory, -D, --dired, -f, -F, -g, -G, --no-group, -h, --human-readable, --si, -H, --dereference-command-line, --dereference-command-line-symlink-to-dir, --full-time, -i, --inode, -k, --kibibytes, -l, -L, --dereference, -m, -n, --numeric-uid-gid, -N, --literal, -o, -p, -q, --hide-control-chars, --show-control-chars, -Q, --quote-name, -r, --reverse, -R, --recursive, -s, --size, -S, -t, -u, -U, -v, -x, -X, -Z, --context, '-1', --zero, --group-directories-first, --author]}}

extensions:
  caushell.profile/sources: [https://github.com/coreutils/coreutils/blob/master/src/ls.c]
