dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: pdfgrep, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true

forms:
  - id: search_explicit_files
    selector: {kind: has_positional_at, index: 1}
    parameters:
      - name: pattern
        semantic: {kind: plain_value}
        binding: {kind: next_positional}
        cardinality: required_one
      - name: files
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: required_many
        value_constraints: [{kind: exclude_literal, value: "-"}]
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: files}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs}

modifiers:
  - {id: ignore_case, matcher: {kind: any_flag, flags: [-i, --ignore-case]}}
  - {id: fixed_strings, matcher: {kind: any_flag, flags: [-F, --fixed-strings]}}

extensions:
  caushell.profile/sources:
    - https://pdfgrep.org/manpages/manpage-2.1.2.html
  caushell.profile/review_scope:
    - Models the positional-pattern search of explicitly named files.
    - Cache, recursive lookup, pattern files and unsupported options remain opaque.
