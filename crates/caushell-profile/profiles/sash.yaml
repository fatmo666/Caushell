dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: sash, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: sash_command_string
    selector: {kind: has_flag, flag: -c}
    parameters: [{name: command_string, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: following_flag, flag: -c, operand_mode: next_arg}, cardinality: required_one}]
    effects: [{kind: execute_payload, target: {kind: slot, name: command_string}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: sash_script_file
    selector: {kind: has_flag, flag: -f}
    parameters: [{name: script_file, semantic: {kind: payload, language: opaque, source: script_file_ref, recursive: true}, binding: {kind: following_flag, flag: -f, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [], fallback: {name: script_file_path, semantic: {kind: path, role: read, purpose: script_source}}}}]
    effects: [{kind: read_path, target: {kind: slot, name: script_file_path}}, {kind: execute_payload, target: {kind: slot, name: script_file}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
  - id: sash_native_shell
    selector: {kind: all, items: [{kind: lacks_flag, flag: -c}, {kind: lacks_flag, flag: -f}]}
    parameters: []
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects: [{kind: open_interactive_escape_surface, target: {kind: implicit_input, source: interactive_session}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [run_command, spawn_shell]}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers: []
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/sash (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://manpages.debian.org/unstable/sash/sash.1.en.html"]
  caushell.profile/known_limitations: ["sash has a restricted set of built-in shell commands and its native parser is not Bash; command strings and script files remain opaque.", "The source begins an interactive shell and specifies no child command or path operand."]
