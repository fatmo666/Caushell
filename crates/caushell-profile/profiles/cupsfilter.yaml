dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: cupsfilter, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: raw_file_to_stdout
    selector:
      kind: all
      items:
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at, index: 1}}
        - {kind: has_modifier_parameter_matching, modifier: input_type, parameter: mime_type, matcher: {kind: literal, value: application/octet-stream}}
        - {kind: has_modifier_parameter_matching, modifier: output_type, parameter: mime_type, matcher: {kind: literal, value: application/octet-stream}}
        - {kind: not, item: {kind: has_modifier, modifier: delete_input}}
    parameters: [{name: input_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}]
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_path}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: copy_or_decompress}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
modifiers:
  - id: input_type
    matcher: {kind: any_flag, flags: ['-i']}
    parameters: [{name: mime_type, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: output_type
    matcher: {kind: any_flag, flags: ['-m']}
    parameters: [{name: mime_type, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: delete_input, matcher: {kind: any_flag, flags: ['-D']}}
subcommands: null
extensions:
  caushell.profile/source_research:
    - https://github.com/OpenPrinting/cups/blob/master/doc/help/man-cupsfilter.html
    - https://raw.githubusercontent.com/OpenPrinting/cups/master/scheduler/cupsfilter.c
    - GTFOBins fixed snapshot cupsfilter/file-read/0
  caushell.profile/known_limitations:
    - The source fixes both MIME types to application/octet-stream. Input type metadata, destination type metadata, and filename are distinct operands; only filename is a read path.
    - The verified src==dst branch selects the fixed gziptoany helper, which copies or decompresses data; it does not select an arbitrary MIME conversion chain or execute the input payload. Other MIME pairs may dispatch filters and are not covered by this form.
    - The helper's exact compression probe, CUPS configuration reads, and any filter effects outside the verified equal-type branch are not expanded by this profile.
    - -D is excluded because it deletes the input. Other options, extra operands, stdin, and output destination controls remain unresolved.
