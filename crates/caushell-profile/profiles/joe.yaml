dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: joe, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: interactive_editor
    selector: {kind: all, items: []}
    parameters:
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: read_path, target: {kind: slot, name: input_paths}}
      - {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: editor, requires_tty: true, capabilities: [spawn_shell, run_command, write_buffer_to_path]}}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/joe (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://manpages.debian.org/unstable/joe/joe.1.en.html"]
  caushell.profile/known_limitations: ["The ^K!/bin/sh sequence is retained as editor keystrokes in source evidence and is represented only by an interactive editor escape surface.", "The source starts joe without a named file, so this profile does not invent input or file-write effects.", "Interactive escape requires terminal input; session and privilege behavior are not evaluated."]
