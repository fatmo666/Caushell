dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: mtr, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: show_help_or_version
    selector: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: independent, stderr_dependency: independent}
  - id: probe_targets_from_stdin
    selector: {kind: has_modifier_parameter_matching, modifier: host_file, parameter: host_file, matcher: {kind: literal, value: '-'}}
    effects: [{kind: consume_stdin, target: {kind: none}}, {kind: network_endpoint, target: {kind: none}}]
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
  - id: probe_targets_from_file
    selector: {kind: all, items: [{kind: has_modifier, modifier: host_file}, {kind: not, item: {kind: has_modifier_parameter_matching, modifier: host_file, parameter: host_file, matcher: {kind: literal, value: '-'}}}]}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: host_file_path}}, {kind: network_endpoint, target: {kind: none}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
  - id: probe_explicit_host
    selector: {kind: all, items: [{kind: has_positional_at, index: 0}, {kind: not, item: {kind: has_modifier, modifier: host_file}}]}
    parameters: [{name: hosts, semantic: {kind: endpoint, endpoint_kind: host_port, usage: generic_endpoint}, binding: {kind: remaining_positionals}, cardinality: required_many}]
    effects: [{kind: network_endpoint, target: {kind: slot, name: hosts}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
modifiers:
  - id: host_file
    matcher: {kind: any_flag, flags: ['-F', '--filename']}
    parameters: [{name: host_file, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: literal, value: '-'}, target: null}], fallback: {name: host_file_path, semantic: {kind: path, role: read, purpose: generic_operand}}}}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: host_file_path}}]
  - {id: raw, matcher: {kind: any_flag, flags: ['-l', '--raw']}}
  - {id: report, matcher: {kind: any_flag, flags: ['--report']}}
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-v', '--version']}}
subcommands: null
extensions:
  caushell.profile/source_research: [https://manpages.debian.org/unstable/mtr-tiny/mtr.8.en.html, https://github.com/traviscross/mtr/blob/master/ui/mtr.c, GTFOBins fixed snapshot mtr/file-read/0]
  caushell.profile/scope: Models -F FILE as a newline-delimited hostname source and mtr probing as network traffic. The two documented short -r meanings are version/build dependent; both select the same network-only behavior here.
  caushell.profile/known_limitations:
    - Hostnames read from -F are content-derived, so exact endpoints remain unknown and the network endpoint target is none.
    - -F - consumes stdin as a host list; source code routes the dash marker to stdin rather than opening a file named '-'.
    - Other report modes and option-specific network parameters are unresolved.
