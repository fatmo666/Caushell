dsl_version: caushell.profile/v1alpha1
kind: command_profile

identity:
  canonical_name: sh
  aliases:
    - ash
    - dash

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families:
    - bourne
    - sh
  requires_features: []

opaque_on_unresolved: true
option_scope: leading_options

forms:
  - id: command_string
    selector:
      kind: has_flag
      flag: "-c"
    parameters:
      - name: payload
        semantic:
          kind: payload
          language: sh
          source: inline_string
          recursive: true
        binding:
          kind: next_positional
        cardinality: required_one
      - {name: script_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects:
      - kind: execute_payload
        target:
          kind: slot
          name: payload

  - id: script_file
    selector:
      kind: all
      items:
        - kind: has_positional_at
          index: 0
        - kind: not
          item:
            kind: has_flag
            flag: "-c"
        - kind: not
          item:
            kind: has_flag
            flag: "-s"
        - {kind: not, item: {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters:
      - name: script_path
        semantic:
          kind: path
          role: read
          purpose: script_source
        binding:
          kind: next_positional
        cardinality: required_one
      - {name: script_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    effects:
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: script_path
      - kind: execute_payload
        target:
          kind: slot
          name: script_path

  - id: stdin_script_explicit
    selector:
      kind: all
      items:
        - kind: has_flag
          flag: "-s"
        - kind: not
          item:
            kind: has_flag
            flag: "-c"
    parameters:
      - {name: script_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    implicit_inputs:
      - source: stdin_payload
        semantic:
          kind: payload
          language: sh
          source: stdin
          recursive: true
    stream_contract:
      stdin_mode: payload_required
      stdout_mode: opaque
      stderr_mode: opaque
    effects:
      - kind: consume_stdin
        target:
          kind: implicit_input
          source: stdin_payload
      - kind: execute_payload
        target:
          kind: implicit_input
          source: stdin_payload

  - id: stdin_script_implicit
    selector:
      kind: all
      items:
        - kind: not
          item:
            kind: has_flag
            flag: "-c"
        - kind: not
          item:
            kind: has_flag
            flag: "-s"
        - kind: no_positional_args
        - kind: stdin_payload_available
    implicit_inputs:
      - source: stdin_payload
        semantic:
          kind: payload
          language: sh
          source: stdin
          recursive: true
    stream_contract:
      stdin_mode: payload_required
      stdout_mode: opaque
      stderr_mode: opaque
    effects:
      - kind: consume_stdin
        target:
          kind: implicit_input
          source: stdin_payload
      - kind: execute_payload
        target:
          kind: implicit_input
          source: stdin_payload

  - id: interactive
    selector:
      kind: all
      items:
        - kind: not
          item:
            kind: has_flag
            flag: "-c"
        - kind: not
          item:
            kind: has_flag
            flag: "-s"
        - kind: no_positional_args
        - kind: interactive_session
    implicit_inputs:
      - source: interactive_session
        semantic:
          kind: payload
          language: sh
          source: interactive
          recursive: true
    effects:
      - kind: execute_payload
        target:
          kind: implicit_input
          source: interactive_session

  - id: shell_input_source_unknown
    selector:
      kind: all
      items:
        - {kind: not, item: {kind: has_flag, flag: "-c"}}
        - {kind: not, item: {kind: has_flag, flag: "-s"}}
        - {kind: no_positional_args}
        - {kind: not, item: {kind: stdin_payload_available}}
        - {kind: not, item: {kind: interactive_session}}
    implicit_inputs:
      - source: stdin_payload
        semantic: {kind: payload, language: sh, source: stdin, recursive: true}
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}
      - {kind: execute_payload, target: {kind: implicit_input, source: stdin_payload}}
    stream_contract: {stdin_mode: payload_required, stdout_mode: opaque, stderr_mode: opaque}

  - id: stdin_script_dash
    selector:
      kind: all
      items:
        - {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: '-'}}
        - {kind: not, item: {kind: has_positional_at, index: 1}}
        - {kind: not, item: {kind: has_flag, flag: '-c'}}
        - {kind: not, item: {kind: has_flag, flag: '-s'}}
    parameters:
      - {name: stdin_marker, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    implicit_inputs:
      - source: stdin_payload
        semantic: {kind: payload, language: sh, source: stdin, recursive: true}
    stream_contract: {stdin_mode: payload_required, stdout_mode: opaque, stderr_mode: opaque}
    effects:
      - {kind: consume_stdin, target: {kind: implicit_input, source: stdin_payload}}
      - {kind: execute_payload, target: {kind: implicit_input, source: stdin_payload}}

modifiers:
  - {id: command_string_mode, matcher: {kind: any_flag, flags: ['-c']}}
  - {id: stdin_script_mode, matcher: {kind: any_flag, flags: ['-s']}}

subcommands: null
extensions:
  caushell.profile/argument_ownership: "Shell mode options are leading options. -c selects the first positional command string after option parsing; later arguments are positional data. An exact lone '-' reads stdin and does not name a workspace file. Unresolved interpreter forms remain opaque; additional arguments after a leading '-' remain conservative."
