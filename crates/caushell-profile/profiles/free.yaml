{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "free",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "linux"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query_system_information",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ],
      "stdout_growth": {
        "kind": "continuous",
        "records": "lines",
        "required_modifier": "repeat",
        "finite_count_slots": [
          "count"
        ]
      }
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-b",
          "--bytes",
          "-k",
          "--kibi",
          "-m",
          "--mebi",
          "-g",
          "--gibi",
          "--tebi",
          "--pebi",
          "--kilo",
          "--mega",
          "--giga",
          "--tera",
          "--peta",
          "-h",
          "--human",
          "-w",
          "--wide",
          "-l",
          "--lohi",
          "-L",
          "--line",
          "--si",
          "-t",
          "--total",
          "-v",
          "--committed",
          "--help",
          "-V",
          "--version"
        ]
      }
    },
    {
      "id": "repeat",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-s",
          "--seconds"
        ]
      },
      "parameters": [
        {
          "name": "delay",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    },
    {
      "id": "count",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-c",
          "--count"
        ]
      },
      "parameters": [
        {
          "name": "count",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/source_research": [
      "https://man7.org/linux/man-pages/man1/free.1.html"
    ],
    "caushell.profile/review_scope": "Explicit query modes only; unsupported modes remain unresolved. No all-argv effect envelope or stdout key/number proof."
  }
}
