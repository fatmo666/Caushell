dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: aspell, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: interactive_check_file
    selector: {kind: all, items: [{kind: has_modifier, modifier: check}, {kind: has_positional_at, index: 0}]}
    parameters: [{name: input_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_many}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_path}}, {kind: write_path, target: {kind: slot, name: input_path}}, {kind: open_interactive_escape_surface, target: {kind: none}, surface: {kind: terminal_ui, requires_tty: true, capabilities: [write_buffer_to_path]}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: inputs}
  - id: parse_configuration_file
    selector: {kind: all, items: [{kind: has_modifier, modifier: config_file}, {kind: not, item: {kind: has_modifier, modifier: check}}]}
    parameters: []
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: config_path}}, {kind: read_path, target: {kind: none}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: data, stderr_dependency: inputs}
  - id: show_help_or_version
    selector: {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: data, stdout_dependency: independent, stderr_dependency: independent}
modifiers:
  - {id: check, matcher: {kind: any_flag, flags: ['-c', '--check']}}
  - id: config_file
    matcher: {kind: any_flag, flags: ['--conf']}
    parameters: [{name: config_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: config_path}}]
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['--version']}}
subcommands: null
extensions:
  caushell.profile/source_research: [https://aspell.net/man-html/Using-Aspell-as-a-Replacement-for-Ispell.html, GTFOBins fixed snapshot aspell/file-read/0, GTFOBins fixed snapshot aspell/file-read/1]
  caushell.profile/known_limitations:
    - aspell -c reads the selected text and can save corrected text back to the same host path; the spelling interface is a TUI. Additional operands and stdin handling are unresolved.
    - --conf selects and parses a configuration file. Diagnostics can expose content-derived text, but the exact message and lowercase conversion are not modeled.
    - Config includes, dictionary paths, and other implicit reads are not resolved.
