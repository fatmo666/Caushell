dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: xmodmap, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_matching: exact_names
opaque_on_unresolved: true
forms:
  - id: verbose_map_file
    selector: {kind: has_modifier, modifier: verbose}
    parameters: [{name: map_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: required_one}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: map_file}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: data, stderr_dependency: inputs}
modifiers:
  - {id: verbose, matcher: {kind: any_flag, flags: ['-v', '-verbose']}}
  - {id: display, matcher: {kind: any_flag, flags: ['-display']}, parameters: [{name: display_name, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]}
  - {id: expression, matcher: {kind: any_flag, flags: ['-e']}, parameters: [{name: expression, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_many}]}
extensions:
  caushell.profile/source_research:
    - https://gtfobins.org/gtfobins/xmodmap/
    - https://xorg.freedesktop.org/archive/X11R7.0/doc/html/xmodmap.1.html
  caushell.profile/known_limitations:
    - Requires an accessible X server. Reading -v input also applies key, modifier, or pointer mappings to that server.
    - The product risk model has no X-server-state mutation action. This profile records the input path and diagnostic flow but intentionally does not invent a filesystem write or alter policy.
    - -e expressions, default input selection, X server state changes, and non-file options remain outside this form.
