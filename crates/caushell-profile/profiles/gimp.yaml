dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: gimp, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: python_fu_batch_eval
    selector: {kind: has_flag, flag: -b}
    parameters: [{name: python_fu_code, semantic: {kind: payload, language: opaque, source: inline_string, recursive: true}, binding: {kind: following_flag, flag: -b, operand_mode: next_arg}, cardinality: required_one}]
    effects: [{kind: execute_payload, target: {kind: slot, name: python_fu_code}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
  - id: gimp_ui
    selector: {kind: all, items: [{kind: not, item: {kind: has_flag, flag: -b}}]}
    parameters: []
    implicit_inputs: [{source: interactive_session, semantic: {kind: payload, language: opaque, source: interactive, recursive: true}}]
    effects: [{kind: open_interactive_escape_surface, target: {kind: implicit_input, source: interactive_session}, surface: {kind: terminal_ui, requires_tty: false, capabilities: [run_command, spawn_shell]}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - {id: no_interface, matcher: {kind: any_flag, flags: [-i, --no-interface]}}
  - {id: no_data, matcher: {kind: any_flag, flags: [-d, --no-data]}}
  - {id: no_fonts, matcher: {kind: any_flag, flags: [-f, --no-fonts]}}
  - {id: combined_startup_mode, matcher: {kind: any_flag, flags: [-idf]}}
  - {id: batch_interpreter, matcher: {kind: any_flag, flags: [--batch-interpreter]}, parameters: [{name: batch_interpreter, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_one}]}
extensions:
  caushell.profile/source_research: ["research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/gimp (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)", "https://developer.gimp.org/api/3.0/libgimp/func.main.html"]
  caushell.profile/known_limitations: ["The source passes Python to GIMP's python-fu-eval batch interpreter; the code is opaque Python, never shell syntax.", "GUI, plug-in availability, and post-batch process behavior are not inferred."]
