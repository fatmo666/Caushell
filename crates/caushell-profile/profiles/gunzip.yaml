dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: gunzip, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
# GNU gunzip shares gzip's CLI but starts in decompression mode.
forms:
  - id: information
    selector: &info {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}, {kind: has_modifier, modifier: license}]}
    parameters:
      - {name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}
    stream_contract: &quiet {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: test_files
    selector:
      kind: all
      items:
        - &active {kind: not, item: *info}
        - &test_only {kind: all, items: [{kind: has_modifier, modifier: test}, {kind: not, item: {kind: has_modifier, modifier: list}}]}
        - &no_stdin
          kind: not
          item: &stdin
            kind: any
            items:
              - {kind: no_positional_args}
              - {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}
    parameters: &inputs
      - {name: stdin_markers, semantic: {kind: plain_value}, binding: {kind: positionals_matching, matcher: {kind: literal, value: '-'}}, cardinality: optional_many}
      - {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: remaining_positionals}, cardinality: optional_many, value_constraints: [{kind: exclude_literal, value: '-'}]}
    effects: [&read {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}]
    stream_contract: *quiet
  - id: test_stdin
    selector: {kind: all, items: [*active, *test_only, *stdin]}
    parameters: *inputs
    effects: [*read]
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: list_files
    selector: {kind: all, items: [*active, {kind: has_modifier, modifier: list}, *no_stdin]}
    parameters: *inputs
    effects: [*read]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: inputs}
  - id: list_stdin
    selector: {kind: all, items: [*active, {kind: has_modifier, modifier: list}, *stdin]}
    parameters: *inputs
    effects: [*read]
    stream_contract: {stdin_mode: data_required, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: inputs}
  - id: decompress_stdout_files
    selector:
      kind: all
      items:
        - &stdout_operation
          kind: all
          items:
            - *active
            - kind: not
              item: &inspect {kind: any, items: [{kind: has_modifier, modifier: list}, {kind: has_modifier, modifier: test}]}
            - kind: any
              items:
                - &stdout {kind: has_modifier, modifier: stdout}
                - kind: not
                  item: &files {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: regex_pattern, pattern: '^([^-]|-[\s\S]|$)'}}
        - *no_stdin
    parameters: *inputs
    effects: &decode [*read, &transform {kind: transform_data, target: {kind: none}, extensions: {transform.kind: decompress}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: decompress_stdout_stdin
    selector: {kind: all, items: [*stdout_operation, *stdin]}
    parameters: *inputs
    effects: *decode
    stream_contract: &stdin_output {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: default_file_mode
    selector:
      kind: all
      items:
        - &file_operation {kind: all, items: [*active, {kind: not, item: *inspect}, {kind: not, item: *stdout}, *files]}
        - &simple
          kind: all
          items:
            - {kind: not, item: {kind: has_modifier, modifier: recursive}}
            - {kind: not, item: {kind: has_modifier, modifier: name}}
            - {kind: not, item: {kind: has_modifier, modifier: suffix}}
        - &not_keep {kind: not, item: &keep {kind: has_modifier, modifier: keep}}
        - *no_stdin
    parameters: *inputs
    effects: &file_effects
      - *read
      - &write {kind: write_path, target: {kind: derived_path, source: {kind: slot, name: input_paths}, rule: {kind: strip_suffix, suffix: '.gz'}, purpose: generic_operand}}
      - &delete {kind: delete_path, target: {kind: slot, name: input_paths}}
      - *transform
    stream_contract: *quiet
  - id: decompress_files_keep
    selector: {kind: all, items: [*file_operation, *simple, *keep, *no_stdin]}
    parameters: *inputs
    effects: [*read, *write, *transform]
    stream_contract: *quiet
  - id: decompress_files_with_stdin
    selector: {kind: all, items: [*file_operation, *simple, *not_keep, *stdin]}
    parameters: *inputs
    effects: *file_effects
    stream_contract: *stdin_output
  - id: decompress_files_keep_with_stdin
    selector: {kind: all, items: [*file_operation, *simple, *keep, *stdin]}
    parameters: *inputs
    effects: [*read, *write, *transform]
    stream_contract: *stdin_output
  - id: unresolved_file_outputs
    selector: {kind: all, items: [*file_operation, {kind: not, item: *simple}, *not_keep, *no_stdin]}
    parameters: *inputs
    effects: &unknown [*read, &unknown_write {kind: write_path, target: {kind: none}}, &unknown_delete {kind: delete_path, target: {kind: none}}, *transform]
    stream_contract: *quiet
  - id: unresolved_file_outputs_keep
    selector: {kind: all, items: [*file_operation, {kind: not, item: *simple}, *keep, *no_stdin]}
    parameters: *inputs
    effects: [*read, *unknown_write, *transform]
    stream_contract: *quiet
  - id: unresolved_file_outputs_with_stdin
    selector: {kind: all, items: [*file_operation, {kind: not, item: *simple}, *not_keep, *stdin]}
    parameters: *inputs
    effects: *unknown
    stream_contract: *stdin_output
  - id: unresolved_file_outputs_keep_with_stdin
    selector: {kind: all, items: [*file_operation, {kind: not, item: *simple}, *keep, *stdin]}
    parameters: *inputs
    effects: [*read, *unknown_write, *transform]
    stream_contract: *stdin_output
modifiers:
  - {id: stdout, matcher: {kind: any_flag, flags: [-c, --stdout, --to-stdout]}}
  - {id: decompress, matcher: {kind: any_flag, flags: [-d, --decompress, --uncompress]}}
  - {id: keep, matcher: {kind: any_flag, flags: [-k, --keep]}}
  - {id: list, matcher: {kind: any_flag, flags: [-l, --list]}}
  - {id: test, matcher: {kind: any_flag, flags: [-t, --test]}}
  - {id: help, matcher: {kind: any_flag, flags: [-h, --help]}}
  - {id: version, matcher: {kind: any_flag, flags: [-V, --version]}}
  - {id: license, matcher: {kind: any_flag, flags: [-L, --license]}}
  - {id: force, matcher: {kind: any_flag, flags: [-f, --force]}}
  - {id: recursive, matcher: {kind: any_flag, flags: [-r, --recursive]}}
  - {id: name, matcher: {kind: any_flag, flags: [-N, --name]}}
  - {id: no_name, matcher: {kind: any_flag, flags: [-n, --no-name]}}
  - {id: level, matcher: {kind: any_flag, flags: ['-1', '-2', '-3', '-4', '-5', '-6', '-7', '-8', '-9', --fast, --best]}}
  - {id: diagnostics, matcher: {kind: any_flag, flags: [-q, --quiet, -v, --verbose]}}
  - {id: tuning, matcher: {kind: any_flag, flags: [--rsyncable, --synchronous]}}
  - id: suffix
    matcher: {kind: any_flag, flags: [-S, --suffix]}
    parameters:
      - {name: suffix, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}
subcommands: null
extensions:
  caushell.profile/source_research: [https://www.gnu.org/software/gzip/manual/html_node/Invoking-gzip.html]
  caushell.profile/known_limitations:
    - GNU gunzip 1.12 CLI semantics; older GZIP defaults, BSD/BusyBox extensions and dynamic environment-injected options are not certified.
    - Exact .gz output is represented by the native suffix rule, not suffix-based file-purpose guessing. Other suffixes, missing-file lookup and implicit header names are not materialized as concrete filenames.
    - Recursive, --name and custom suffix file outputs retain unknown mutation targets. No archive-header, filesystem, permissions or success probing is performed.
