dsl_version: "caushell.profile/v1alpha1"
kind: "command_profile"
option_scope: "permuted_options"
opaque_on_unresolved: true
identity: {"canonical_name":"mknod","aliases":[]}
trust: {"tier":"tier_a","source":"built_in"}
platform: {"os_families":["posix","linux","macos"],"shell_families":[],"requires_features":[]}
forms:
  - id: "show_help"
    selector: {"kind":"has_modifier","modifier":"information"}
    parameters: [{"name":"ignored_arguments","semantic":{"kind":"plain_value"},"binding":{"kind":"remaining_args"},"cardinality":"optional_many"}]
    stream_contract: {"stdin_mode":"ignored","stdout_mode":"data","stderr_mode":"opaque","stdout_dependency":"independent","stderr_dependency":"independent"}
  - id: "create_special_file"
    selector:
      kind: "all"
      items:
        - {"kind":"not","item":{"kind":"has_modifier","modifier":"information"}}
        - {"kind":"all","items":[{"kind":"has_positional_at","index":0},{"kind":"has_positional_at","index":1}]}
    parameters:
      - name: "output_path"
        semantic: {"kind":"path","role":"write","purpose":"generic_operand"}
        binding: {"kind":"next_positional"}
        cardinality: "required_one"
      - {"name":"node_args","semantic":{"kind":"plain_value"},"binding":{"kind":"remaining_positionals"},"cardinality":"required_many"}
    effects: [{"kind":"write_path","target":{"kind":"slot","name":"output_path"}},{"kind":"metadata_mutation","target":{"kind":"slot","name":"output_path"}}]
    stream_contract: {"stdin_mode":"ignored","stdout_mode":"opaque","stderr_mode":"opaque","stdout_dependency":"independent","stderr_dependency":"inputs"}
    remaining_selector: {"kind":"no_positional_args"}
modifiers:
  - {"id":"information","matcher":{"kind":"any_flag","flags":["--help","--version"]},"ends_option_scope":true}
  - id: "mode"
    matcher: {"kind":"any_flag","flags":["-m","--mode"]}
    parameters:
      - name: "mode"
        semantic: {"kind":"plain_value"}
        binding: {"kind":"following_matched_flag","operand_mode":"next_arg"}
        cardinality: "required_many"
  - {"id":"default_context","matcher":{"kind":"any_flag","flags":["-Z"]}}
  - id: "context"
    matcher: {"kind":"any_flag","flags":["--context"]}
    parameters:
      - name: "context"
        semantic: {"kind":"plain_value"}
        binding: {"kind":"following_matched_flag","operand_mode":"optional_inline_only"}
        cardinality: "optional_many"
subcommands: null
extensions:
  caushell.profile/source_research: ["command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md"]
  caushell.profile/sources: ["https://github.com/coreutils/coreutils/blob/master/src/mknod.c"]
