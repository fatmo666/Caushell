dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: iftop
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: traffic_monitor
  selector:
    kind: all
    items:
    - kind: not
      item:
        kind: has_flag
        flag: "-t"
  parameters: []
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: terminal_ui
      requires_tty: true
      capabilities:
      - spawn_shell
      - run_command
  stream_contract:
    stdin_mode: ignored
    stdout_mode: opaque
    stderr_mode: opaque
- id: text_output_mode
  selector:
    kind: has_flag
    flag: "-t"
  parameters: []
  effects: []
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
modifiers:
- id: interface
  matcher:
    kind: any_flag
    flags:
    - "-i"
  parameters:
  - name: interface_name
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
- id: text_output
  matcher:
    kind: any_flag
    flags:
    - "-t"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/iftop (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://manpages.debian.org/trixie/iftop/iftop.8.en.html
  caushell.profile/known_limitations:
  - The source uses the iftop terminal UI escape; capture permission is required and
    interface selection may require -i.
  - Packet capture behavior, interfaces, filters, and traffic observed by the UI are
    not represented as network endpoint facts.
