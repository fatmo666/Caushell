dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: unsquashfs
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: extract_filesystem_archive
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: squashfs_archive
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: next_positional
    cardinality: required_one
  effects:
  - kind: read_path
    target:
      kind: slot
      name: squashfs_archive
  - kind: write_path
    target:
      kind: slot
      name: extraction_directory
  - kind: write_path
    target:
      kind: configured_path
      sources: []
      missing: unknown
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "-help"
- id: destination_dir
  matcher:
    kind: any_flag
    flags:
    - "-d"
    - "-dest"
  parameters:
  - name: extraction_directory
    semantic:
      kind: path
      role: write
      purpose: generic_operand
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: optional_one
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/unsquashfs (GTFOBins
    acd524623f9c406acedd2754ebd9c2431f3675ad)
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
