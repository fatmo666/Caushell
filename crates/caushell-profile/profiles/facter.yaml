---
dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: facter
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  - macos
  shell_families: []
  requires_features: []
option_scope: permuted_options
opaque_on_unresolved: true
extensions:
  caushell.profile/source_research:
  - https://help.puppet.com/osp/8.11/Content/PuppetCore/Markdown/cli.htm
  - https://www.puppet.com/docs/puppet/5.5/custom_facts
  caushell.profile/known_limitations:
  - Facter custom directories select Ruby code at runtime; this is an opaque dynamic
    entry, not a guessed .rb path. Only single-directory FACTERLIB is concrete; multi-directory
    configuration, default custom loaders and external-fact executables remain unexpanded.
    FACTERLIB is modeled as a search-directory read only; environment-selected executable
    loading is a known missing semantic, not accepted as protected execution.
    --no-custom-facts suppresses the declared custom Ruby loader; external facts are
    not claimed disabled.
forms:
- id: custom_facts_directory
  selector:
    kind: all
    items:
    - kind: has_flag
      flag: "--custom-dir"
    - &1
      kind: all
      items:
      - kind: not
        item:
          kind: has_flag
          flag: "--help"
      - kind: not
        item:
          kind: has_flag
          flag: "--version"
      - kind: not
        item:
          kind: has_modifier
          modifier: disable_custom
  parameters:
  - &2
    name: fact_names
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: read_path
    target:
      kind: configured_path
      sources:
      - slot: custom_dir
        projection:
          kind: identity
      missing: skip
      purpose: generic_operand
  - kind: execute_payload
    target:
      kind: slot
      name: facts_payload
- id: custom_facts_env
  selector:
    kind: all
    items:
    - kind: no_positional_args
    - kind: not
      item:
        kind: has_flag
        flag: "--custom-dir"
    - *1
  effects: &4
  - kind: read_path
    target:
      kind: configured_path
      sources: []
      environment:
        name: FACTERLIB
      missing: skip
- id: custom_facts_env_with_names
  selector:
    kind: all
    items:
    - kind: has_positional_at
      index: 0
    - kind: not
      item:
        kind: has_flag
        flag: "--custom-dir"
    - *1
  parameters:
  - *2
  effects: *4
- id: help
  selector:
    kind: has_flag
    flag: "--help"
- id: version
  selector:
    kind: has_flag
    flag: "--version"
- id: query_without_custom_facts
  selector:
    kind: has_modifier
    modifier: disable_custom
  parameters:
  - name: fact_names
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  stream_contract:
    stdin_mode: ignored
    stdout_mode: data
    stderr_mode: opaque
    stdout_dependency: independent
modifiers:
- id: disable_custom
  matcher:
    kind: any_flag
    flags:
    - "--no-custom-facts"
  parameters: []
  effects: []
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
    - "--version"
  parameters: []
  effects: []
- id: custom_dir
  matcher:
    kind: any_flag
    flags:
    - "--custom-dir"
  parameters:
  - name: custom_dir
    semantic:
      kind: plain_value
    binding:
      kind: following_matched_flag
      operand_mode: next_arg
    cardinality: required_one
    structured_projection:
      branches: []
      fallback:
        name: facts_payload
        semantic:
          kind: payload
          language: opaque
          source: dynamic_reference
          recursive: true
