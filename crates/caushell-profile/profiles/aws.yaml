dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: aws
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
implicit_config_files:
- id: default_config
  protected_account_defaults: {kind: search}
  sources: [{kind: environment_directory, name: HOME, suffix: .aws/config}]
environment_inputs:
- name: cli_pager
  environment: {name: AWS_PAGER, empty_is_unset: true}
  unless_modifiers: [information]
  semantic: &native_configuration {kind: payload, language: opaque, source: dynamic_reference, recursive: true}
- name: cli_config
  environment: {name: AWS_CONFIG_FILE, empty_is_unset: true}
  semantic: *native_configuration
- name: cli_model_search_path
  environment: {name: AWS_DATA_PATH, empty_is_unset: true}
  unless_modifiers: [information]
  semantic: *native_configuration
forms:
- id: list_s3_buckets
  selector:
    kind: all
    items:
      - {kind: exact_argument_count, count: 2}
      - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: s3}}
      - {kind: has_argument_at_matching, index: 1, matcher: {kind: literal, value: ls}}
  parameters: &query_operation
    - {name: operation, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: required_many}
  effects: &remote_query
    - {kind: state_operation, state_operation: {domain: cloud_resource, operation: inspect}, target: {kind: none}}
    - {kind: network_endpoint, target: {kind: none}}
  stream_contract: &query_stream {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent}

- id: inspect_iam_password_policy
  selector:
    kind: all
    items:
      - {kind: exact_argument_count, count: 2}
      - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: iam}}
      - {kind: has_argument_at_matching, index: 1, matcher: {kind: literal, value: get-account-password-policy}}
  parameters: *query_operation
  effects: *remote_query
  stream_contract: *query_stream

- id: list_s3_objects
  selector:
    kind: all
    items:
      - {kind: has_argument_at_matching, index: 0, matcher: {kind: literal, value: s3api}}
      - {kind: has_argument_at_matching, index: 1, matcher: {kind: literal, value: list-objects-v2}}
      - {kind: no_dash_dash}
      - {kind: has_flag, flag: --bucket}
      - kind: any
        items:
          - kind: all
            items:
              - {kind: exact_argument_count, count: 4}
              - {kind: lacks_flag, flag: --output}
          - kind: all
            items:
              - {kind: exact_argument_count, count: 6}
              - {kind: has_flag, flag: --output}
  remaining_selector: {kind: no_positional_args}
  parameters:
    - {name: service, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    - {name: operation, semantic: {kind: plain_value}, binding: {kind: next_positional}, cardinality: required_one}
    - name: bucket
      semantic: {kind: plain_value}
      binding: {kind: following_flag, flag: --bucket, operand_mode: next_arg}
      cardinality: required_one
      value_constraints: [{kind: require_match, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,253}[A-Za-z0-9]$'}]
    - name: output
      semantic: {kind: plain_value}
      binding: {kind: following_flag, flag: --output, operand_mode: next_arg}
      cardinality: optional_one
      value_constraints: [{kind: require_match, pattern: '^(json|text|table|yaml|yaml-stream)$'}]
  effects: *remote_query
  stream_contract: *query_stream

- id: ec2_cloud_resource_create
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: ec2
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: regex_pattern
        pattern: "^(create-launch-template|run-instances)$"
    - kind: not
      item:
        kind: has_modifier
        modifier: information
  parameters:
  - name: operation
    semantic:
      kind: plain_value
    binding:
      kind: positional_at
      index: 1
    cardinality: required_one
  - name: cloud_operation_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: state_operation
    state_operation:
      domain: cloud_resource
      operation: mutate
    target:
      kind: none

- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: information_subcommand
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: literal
      value: help
  parameters:
  - name: help_topic_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: pager
      requires_tty: true
      capabilities:
      - run_command
      - spawn_shell
- id: local_file_parameter
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: ec2
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: literal
        value: describe-instances
    - kind: has_positional_at_or_after_matching
      index: 2
      matcher:
        kind: regex_pattern
        pattern: "^file://"
  parameters:
  - name: filter_file
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: args_with_prefix
      prefix: file://
    cardinality: required_one
  - name: native_operation_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: read_path
    target:
      kind: slot
      name: filter_file
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
- id: filter_option
  matcher:
    kind: any_flag
    flags:
    - "--filter"
- id: file_uri_parameters
  matcher:
    kind: any_flag
    flags:
    - "--user-data"
    - "--launch-template-data"
  parameters:
  - name: file_or_literal_data
    semantic: {kind: plain_value}
    binding: {kind: following_matched_flag, operand_mode: next_arg}
    cardinality: required_many
    structured_projection:
      branches:
        - {matcher: {kind: prefix, value: 'file://'}, target: {name: local_file_inputs, semantic: {kind: path, role: read, purpose: generic_operand}}}
        - {matcher: {kind: prefix, value: 'fileb://'}, target: {name: binary_file_inputs, semantic: {kind: path, role: read, purpose: generic_operand}}}
  effects:
  - kind: read_path
    target:
      kind: slot
      name: local_file_inputs
  - {kind: read_path, target: {kind: slot, name: binary_file_inputs}}
- id: cloud_option_values
  matcher: {kind: any_flag, flags: [--image-id, --instance-type, --launch-template-name, --profile, --region]}
  parameters: [{name: cloud_option_values, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/aws (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-parameters-file.html
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
  - https://docs.aws.amazon.com/cli/latest/reference/s3/ls.html
  - https://docs.aws.amazon.com/cli/latest/reference/s3api/list-objects-v2.html
  - https://docs.aws.amazon.com/cli/latest/reference/iam/get-account-password-policy.html
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
