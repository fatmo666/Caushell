dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity:
  canonical_name: aws
  aliases: []
trust:
  tier: tier_a
  source: built_in
platform:
  os_families:
  - posix
  - linux
  shell_families: []
  requires_features: []
opaque_on_unresolved: true
forms:
- id: information
  selector:
    kind: has_modifier
    modifier: information
  parameters:
  - name: ignored_help_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
- id: information_subcommand
  selector:
    kind: has_positional_at_matching
    index: 0
    matcher:
      kind: literal
      value: help
  parameters:
  - name: help_topic_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_args
    cardinality: optional_many
  effects:
  - kind: open_interactive_escape_surface
    target:
      kind: none
    surface:
      kind: pager
      requires_tty: true
      capabilities:
      - run_command
      - spawn_shell
- id: local_file_parameter
  selector:
    kind: all
    items:
    - kind: has_positional_at_matching
      index: 0
      matcher:
        kind: literal
        value: ec2
    - kind: has_positional_at_matching
      index: 1
      matcher:
        kind: literal
        value: describe-instances
    - kind: has_positional_at_or_after_matching
      index: 2
      matcher:
        kind: regex_pattern
        pattern: "^file://"
  parameters:
  - name: filter_file
    semantic:
      kind: path
      role: read
      purpose: generic_operand
    binding:
      kind: args_with_prefix
      prefix: file://
    cardinality: required_one
  - name: native_operation_arguments
    semantic:
      kind: plain_value
    binding:
      kind: remaining_positionals
    cardinality: optional_many
  effects:
  - kind: read_path
    target:
      kind: slot
      name: filter_file
modifiers:
- id: information
  matcher:
    kind: any_flag
    flags:
    - "--help"
- id: filter_option
  matcher:
    kind: any_flag
    flags:
    - "--filter"
subcommands:
extensions:
  caushell.profile/source_research:
  - research/gtfobins-profile-coverage-20261006/upstream/_gtfobins/aws (GTFOBins acd524623f9c406acedd2754ebd9c2431f3675ad)
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-parameters-file.html
  caushell.profile/known_limitations:
  - Source-specific bounded forms are modeled; unresolved CLI combinations remain
    opaque.
  - Inner configuration payloads and generated native child argv not explicitly represented
    by a form remain partial.
  - Known GTFOBins mechanism remains partially opaque until its native boundary has
    a dedicated form.
