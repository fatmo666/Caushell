dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: 7z, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos, windows], shell_families: [], requires_features: []}
option_scope: permuted_options
option_matching: exact_names
opaque_on_unresolved: true
forms:
  - id: create_tar_stream
    selector:
      kind: all
      items:
        - {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: a}}
        - {kind: has_modifier, modifier: tar_type}
        - {kind: has_modifier, modifier: no_archive_name}
        - {kind: has_modifier, modifier: stdout}
        - {kind: has_positional_at, index: 1}
        - {kind: not, item: {kind: has_positional_at, index: 2}}
    parameters: [{name: archive_operation, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}, {name: input_paths, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}]
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: archive_create}}
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: extract_tar_stream
    selector:
      kind: all
      items:
        - {kind: has_positional_at_matching, index: 0, matcher: {kind: literal, value: e}}
        - {kind: has_modifier, modifier: tar_type}
        - {kind: has_modifier, modifier: stdin_archive}
        - {kind: has_modifier, modifier: stdout}
        - {kind: not, item: {kind: has_positional_at, index: 1}}
    parameters: [{name: archive_operation, semantic: {kind: plain_value}, binding: {kind: positional_at, index: 0}, cardinality: required_one}]
    effects:
      - {kind: consume_stdin, target: {kind: none}}
      - {kind: transform_data, target: {kind: none}, extensions: {transform.kind: archive_extract}}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
modifiers:
  - {id: tar_type, matcher: {kind: any_flag, flags: ['-ttar']}}
  - {id: no_archive_name, matcher: {kind: any_flag, flags: ['-an']}}
  - {id: stdout, matcher: {kind: any_flag, flags: ['-so']}}
  - {id: stdin_archive, matcher: {kind: any_flag, flags: ['-si']}}
  - id: member_filters
    matcher: {kind: any_flag, flags: ['-i', '-x']}
    parameters: [{name: member_filters, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: optional_many}]
extensions:
  caushell.profile/source_research:
    - https://gtfobins.org/gtfobins/7z/
    - https://manpages.debian.org/unstable/7zip/7zz.1.en.html
  caushell.profile/known_limitations:
    - The modeled source form creates a tar stream from the positional input file, then extracts the incoming tar stream to stdout. No extracted member path is written to disk in this -so form.
    - The first command's archive input is a filesystem path; the second command's -si means archive bytes from stdin. Member filters are option data and are not treated as paths.
    - Other 7z archive commands can write or delete files, use response/list files, or dispatch format-specific behavior; they remain unresolved rather than inheriting this stream-only model.
