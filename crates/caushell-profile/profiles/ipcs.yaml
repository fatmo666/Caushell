{
  "dsl_version": "caushell.profile/v1alpha1",
  "kind": "command_profile",
  "option_scope": "permuted_options",
  "opaque_on_unresolved": true,
  "identity": {
    "canonical_name": "ipcs",
    "aliases": []
  },
  "trust": {
    "tier": "tier_a",
    "source": "built_in"
  },
  "platform": {
    "os_families": [
      "posix",
      "linux",
      "macos"
    ],
    "shell_families": [],
    "requires_features": []
  },
  "forms": [
    {
      "id": "query_system_information",
      "selector": {
        "kind": "no_positional_args"
      },
      "stream_contract": {
        "stdin_mode": "ignored",
        "stdout_mode": "data",
        "stderr_mode": "opaque",
        "stdout_dependency": "independent"
      },
      "effects": [
        {
          "kind": "transform_data",
          "target": {
            "kind": "none"
          }
        }
      ]
    }
  ],
  "modifiers": [
    {
      "id": "display",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-m",
          "--shmems",
          "-q",
          "--queues",
          "-s",
          "--semaphores",
          "-a",
          "--all",
          "-c",
          "--creator",
          "-l",
          "--limits",
          "-p",
          "--pid",
          "-t",
          "--time",
          "-u",
          "--summary",
          "-b",
          "--bytes",
          "--human",
          "-h",
          "--help",
          "-V",
          "--version"
        ]
      }
    },
    {
      "id": "id",
      "matcher": {
        "kind": "any_flag",
        "flags": [
          "-i",
          "--id"
        ]
      },
      "parameters": [
        {
          "name": "resource_id",
          "semantic": {
            "kind": "plain_value"
          },
          "binding": {
            "kind": "following_matched_flag",
            "operand_mode": "next_arg"
          },
          "cardinality": "required_many"
        }
      ]
    }
  ],
  "subcommands": null,
  "extensions": {
    "caushell.profile/source_research": [
      "https://man7.org/linux/man-pages/man1/ipcs.1.html"
    ],
    "caushell.profile/review_scope": "Explicit query modes only; unsupported modes remain unresolved. No all-argv effect envelope or stdout key/number proof."
  }
}
