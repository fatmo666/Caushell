dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: ul, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux, macos], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: information
    selector: &information {kind: any, items: [{kind: has_modifier, modifier: help}, {kind: has_modifier, modifier: version}]}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: render_files
    selector:
      kind: all
      items:
        - {kind: not, item: *information}
        - {kind: has_positional_at, index: 0}
        - {kind: not, item: {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}}
    parameters:
      - name: input_paths
        semantic: {kind: path, role: read, purpose: generic_operand}
        binding: {kind: remaining_positionals}
        cardinality: required_many
        value_constraints: [{kind: exclude_literal, value: '-'}]
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: input_paths}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
  - id: render_stdin
    selector: {kind: all, items: [{kind: not, item: *information}, {kind: no_positional_args}]}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
modifiers:
  - {id: indicated, matcher: {kind: any_flag, flags: ['-i', '--indicated']}}
  - id: terminal
    matcher: {kind: any_flag, flags: ['-t', '-T', '--terminal']}
    parameters: [{name: terminal_type, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - {id: help, matcher: {kind: any_flag, flags: ['-h', '--help']}}
  - {id: version, matcher: {kind: any_flag, flags: ['-V', '--version']}}
subcommands: null
extensions:
  caushell.profile/source_research:
    - https://man7.org/linux/man-pages/man1/ul.1.html
    - GTFOBins fixed snapshot ul/file-read/0
  caushell.profile/known_limitations:
    - ul reads supplied files and translates underlining/control sequences; its output is not byte-identical to the source.
    - No file operands means actual stdin; a literal '-' and unresolved options remain conservative/unresolved.
