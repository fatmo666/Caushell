dsl_version: caushell.profile/v1alpha1
kind: command_profile
option_scope: permuted_options
opaque_on_unresolved: true
read_only_control_surface: true
native_argv_read_envelope: true

identity:
  canonical_name: wc
  aliases: []

trust:
  tier: tier_a
  source: built_in

platform:
  os_families:
    - posix
    - linux
    - macos
  shell_families: []
  requires_features: []

forms:
  - id: show_help
    extensions: {caushell.form/suppress_modifier_semantics: true}
    selector: {kind: has_modifier, modifier: information}
    parameters: [{name: ignored_arguments, semantic: {kind: plain_value}, binding: {kind: remaining_positionals}, cardinality: optional_many}]
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: independent, stderr_dependency: independent}
  # Native filename records are data, never new options or shell code.
  - id: count_list_stdin
    implicit_inputs: [{source: stdin_data, semantic: {kind: plain_value}}]
    selector: {kind: all, items: [&count_list {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: has_modifier, modifier: files_from}, {kind: no_positional_args}]}, &list_stdin {kind: has_modifier_parameter_matching, modifier: files_from, parameter: list_file, matcher: {kind: literal, value: '-'}}]}
    stream_contract: {stdin_mode: data_required, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: implicit_input, source: stdin_data}, path_list: {separator: nul}}
      - {kind: transform_data, target: {kind: none}}
  - id: count_list_file
    selector: {kind: all, items: [*count_list, {kind: not, item: *list_stdin}]}
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: data, stdout_dependency: inputs, stderr_dependency: inputs}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: list_path}}
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: list_path}, path_list: {separator: nul}}
      - {kind: transform_data, target: {kind: none}}
  - id: count_inputs
    selector: {kind: all, items: [&ordinary {kind: all, items: [{kind: not, item: {kind: has_modifier, modifier: information}}, {kind: not, item: {kind: has_modifier, modifier: files_from}}]}, {kind: not, item: &stdin {kind: any, items: [{kind: no_positional_args}, {kind: has_positional_at_or_after_matching, index: 0, matcher: {kind: literal, value: '-'}}]}}]}
    parameters: &inputs
      - name: input_paths
        semantic:
          kind: path
          role: read
          purpose: generic_operand
        binding:
          kind: remaining_positionals
        cardinality: optional_many
        value_constraints:
          - kind: exclude_literal
            value: "-"
    stream_contract: {stdin_mode: ignored, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: &effects
      - kind: read_path
        path_access: content_open
        target:
          kind: slot
          name: input_paths
      - kind: transform_data
        target:
          kind: none
  - id: count_stdin_numeric
    selector: {kind: all, items: [*ordinary, {kind: no_positional_args}]}
    parameters: *inputs
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    stdout_scalar: arithmetic_text
    effects: *effects
  - id: count_inputs_stdin
    selector: {kind: all, items: [*ordinary, *stdin, {kind: not, item: {kind: no_positional_args}}]}
    parameters: *inputs
    stream_contract: {stdin_mode: data_optional, stdout_mode: data, stderr_mode: opaque, stdout_dependency: inputs}
    effects: *effects

modifiers:
  - id: files_from
    matcher: {kind: any_flag, flags: [--files0-from]}
    parameters:
      - {name: list_file, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one, structured_projection: {branches: [{matcher: {kind: literal, value: '-'}, target: null}], fallback: {name: list_path, semantic: {kind: path, role: read, purpose: generic_operand}}}}
  - {id: information, matcher: {kind: any_flag, flags: [--help, --version]}}
  - id: count_mode
    matcher:
      kind: any_flag
      flags:
        - "-c"
        - "--bytes"
        - "-m"
        - "--chars"
        - "-l"
        - "--lines"
        - "-L"
        - "--max-line-length"
        - "-w"
        - "--words"

subcommands: null
extensions:
  caushell.profile/source_research:
    - command-frequency/cross-validation/COMMAND_PROFILE_COVERAGE_PLAN.md
    - command-frequency/D4-security-bash/weaponizable_overlap.csv
  caushell.profile/native_read_review:
    - All native wc modes only read inputs and transform counts. Unknown argv may select --files0-from; its list source and listed targets are both covered by the unbounded read envelope, never a bounded pathname-domain assumption.
    - Explicit --files0-from uses NUL filename records. File-backed lists may select '-' and read stdin; their contents remain unknown without a content proof; stdin records use the shared bounded path-list decoder. List-mode stdout can contain names and total, so has no arithmetic scalar contract.
    - File-list mode rejects ordinary file operands. Unknown or missing option values retain a binding gap. Profiles do not infer a platform version from the executable name.
  caushell.profile/native_reference: [https://www.gnu.org/software/coreutils/manual/html_node/wc-invocation.html]
