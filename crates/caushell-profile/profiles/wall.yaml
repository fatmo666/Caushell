dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: wall, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [linux], shell_families: [], requires_features: []}
opaque_on_unresolved: true
forms:
  - id: broadcast_file
    selector: {kind: has_positional_at, index: 0}
    parameters:
      - {name: message_file, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: next_positional}, cardinality: required_one}
    effects: [{kind: read_path, path_access: content_open, target: {kind: slot, name: message_file}}]
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
  - id: broadcast_stdin_or_message
    selector: {kind: no_positional_args}
    parameters: []
    effects: [{kind: consume_stdin, target: {kind: none}}]
    stream_contract: {stdin_mode: data_optional, stdout_mode: opaque, stderr_mode: opaque, stdout_dependency: independent}
modifiers:
  - {id: nobanner, matcher: {kind: any_flag, flags: ['-n', '--nobanner']}}
  - id: timeout
    matcher: {kind: any_flag, flags: ['-t', '--timeout']}
    parameters: [{name: timeout_seconds, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
  - id: group
    matcher: {kind: any_flag, flags: ['-g', '--group']}
    parameters: [{name: group_name, semantic: {kind: plain_value}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_one}]
subcommands: null
extensions:
  caushell.profile/source: https://man7.org/linux/man-pages/man1/wall.1.html
  caushell.profile/known_limitations:
    - wall writes broadcast text to logged-in users' terminals, not stdout/stderr; tty destinations are external to this static profile.
