dsl_version: caushell.profile/v1alpha1
kind: command_profile
identity: {canonical_name: xpad, aliases: []}
trust: {tier: tier_a, source: built_in}
platform: {os_families: [posix, linux], shell_families: [], requires_features: []}
option_scope: permuted_options
opaque_on_unresolved: true
forms:
  - id: open_file
    selector: {kind: has_modifier, modifier: file}
    effects:
      - {kind: read_path, path_access: content_open, target: {kind: slot, name: input_path}}
      # Startup can create or migrate the store, and the import may be
      # forwarded to a running instance. The input path is not the store.
      - {kind: write_path, target: {kind: configured_path, sources: [], missing: unknown}}
    stream_contract: {stdin_mode: ignored, stdout_mode: opaque, stderr_mode: opaque}
modifiers:
  - id: file
    matcher: {kind: any_flag, flags: ['-f', --new-from-file]}
    parameters: [{name: input_path, semantic: {kind: path, role: read, purpose: generic_operand}, binding: {kind: following_matched_flag, operand_mode: next_arg}, cardinality: required_many}]
subcommands: null
extensions:
  caushell.profile/source_research:
    - https://sources.debian.org/src/xpad/5.3.0-1/src/xpad-app.c
    - https://manpages.debian.org/trixie/xpad/xpad.1.en.html
  caushell.profile/known_limitations:
    - File import creates a pad. Startup can create or migrate the application store even when no display is available.
    - The profile does not resolve the selected storage paths or the running instance, or infer GUI behavior.
